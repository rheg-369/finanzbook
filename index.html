/* Layout: one-column phone app. Sticky month switcher, month summary + budget, category bars, entries by day, floating add button, bottom sheet editor */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#191f1b; --muted:#646d66; --line:#e2e5df;
  --accent:#2f6b4f; --accent-soft:#e2eee7; --danger:#b3412e; --warn:#9a5f0c; --chip:#eceee9; --track:#e8ebe6;
  --shadow:0 10px 30px rgba(20,40,30,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#8a918c;
  --f-display:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
  --f-serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:16px}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.ptitle{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;min-width:9.5ch;text-align:center}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
.icon:disabled{opacity:.35}

.hero{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.big .cents{font-size:.55em;color:var(--muted)}
.trio{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.trio div{min-width:0}
.trio .v{font-weight:600;margin-top:2px;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)} .neg{color:var(--danger)}
.budget{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--danger)}
.bline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.bline b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.88rem;align-self:flex-start}

section{margin-top:22px}
section > h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px 2px;display:flex;justify-content:space-between}
.cats{background:var(--surface);border-radius:16px;padding:6px 0;list-style:none;margin:0}
.cat{width:100%;border:0;background:none;text-align:left;padding:9px 16px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat .name{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0}
.cat .amt{font-weight:600;font-size:.95rem}
.cat .amt small{color:var(--muted);font-weight:400;margin-left:6px}
.cat .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--track)}
.cat .track i{display:block;height:100%;border-radius:4px;min-width:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.filter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0 0 8px 2px}
.filter button{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8rem}

.day{margin-top:14px}
.day h3{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:500;margin:0 0 6px 2px}
.entries{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.entry{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.entries li:last-child .entry{border-bottom:0}
.badge{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.entry .mid{flex:1;min-width:0}
.entry .t{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);margin-bottom:6px}
.status{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:94%;overflow-y:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{font-family:var(--f-display);font-size:1.15rem;margin:0}
.xbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center;padding:0}
.xbtn svg{width:16px;height:16px}
.sheet-head h3{text-align:center;flex:1;min-width:0}
.txt{border:0;background:none;padding:0;color:var(--muted);font-weight:500;min-width:80px;text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0}
.amount input{border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:3rem;text-align:right;width:6.5ch;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount span{font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip input[type=date]{border:0;background:none;padding:0;font-size:.88rem;width:8.5em;min-width:0}
.row{display:flex;gap:10px}
.primary{flex:1;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--bg);font-weight:600;font-size:1rem}
.primary:disabled{opacity:.45}
.danger{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:none;color:var(--danger);font-weight:600}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.remind{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.9rem}
.remind span{flex:1 1 180px}
.remind button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.remind .go{background:var(--accent);color:var(--bg)}
.remind .later{background:none;color:var(--muted)}
.accs{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.acc{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.accs li:last-child .acc{border-bottom:0}
.acc .mid{flex:1;min-width:0}
.acc .t{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.acc .a{font-weight:600;white-space:nowrap}
.goal{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goals{display:flex;flex-direction:column;gap:10px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .name{border:0;background:none;padding:0;font-weight:600;font-size:1rem;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .of{font-size:.88rem;color:var(--muted);white-space:nowrap}
.goal .of b{color:var(--ink)}
.goal .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.goal .put{border:0;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addbtn{flex:1 1 40%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:11px;color:var(--muted);font-weight:500;font-size:.92rem}
.seg3{grid-template-columns:1fr 1fr 1fr}
.sublabel{font-size:.82rem;color:var(--muted);margin:-4px 0 0}
.warnmsg{font-size:.85rem;color:var(--danger);margin:0}
.splits{display:flex;flex-direction:column;gap:8px}
.splitrow{display:grid;grid-template-columns:1fr 7.5em;gap:10px;align-items:center}
.splitrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splitrow input{text-align:right;padding:10px 12px}
.splitrest{font-size:.88rem;margin:8px 0 0;color:var(--muted)}
.splitrest b{color:var(--ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip .x{margin-left:2px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--surface);display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;line-height:1}
.newacc{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.inv{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.inv .yr{display:flex;align-items:center;justify-content:space-between}
.inv .yr button{border:0;background:var(--chip);border-radius:10px;width:36px;height:32px;font-weight:700;color:var(--ink)}
.inv .yr button:disabled{opacity:.3}
.inv .yr b{font-family:var(--f-display);font-size:1.05rem}
.inv .tot{text-align:center}
.inv .tot .v{font-family:var(--f-display);font-weight:700;font-size:2rem}
.inv .parts{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.inv .parts div{display:flex;justify-content:space-between;gap:10px}
.inv .parts span{color:var(--muted)}
.inv .months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:70px}
.inv .months i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.inv .months i.z{background:var(--line)}
.inv .mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:.62rem;color:var(--muted);text-align:center;margin-top:-8px}
.chk{display:flex;flex-direction:column;gap:10px}
.chkrow{display:grid;grid-template-columns:1fr 8em;gap:4px 10px;align-items:center}
.chkrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chkrow .app{grid-column:1;font-size:.8rem;color:var(--muted)}
.chkrow input{grid-row:1/span 2;grid-column:2;text-align:right;padding:10px 12px}
.chkrow .df{grid-column:1/-1;font-size:.82rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:30;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;padding:0}

/* ---- Design 2.3: iOS-Look ---- */
:root{--card-shadow:0 1px 2px rgba(20,40,30,.05),0 6px 18px rgba(20,40,30,.06);--hero1:#2f7354;--hero2:#1d4a36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card-shadow:none;--hero1:#2a6449;--hero2:#163628}}
:root[data-theme="dark"]{--card-shadow:none;--hero1:#2a6449;--hero2:#163628}
.wrap{padding-block:0 170px}
header{padding-block:10px 8px}
.ptitle,.month h1{font-size:1.7rem;letter-spacing:-.01em}
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(29,74,54,.28)}
.hero .label{color:rgba(255,255,255,.72)}
.hero .big .cents{color:rgba(255,255,255,.7)}
.hero .trio{border-top-color:rgba(255,255,255,.18)}
.hero .pos{color:#b8f0cf} .hero .neg{color:#ffc4b8}
.hero .bar{background:rgba(255,255,255,.2)} .hero .bar i{background:#fff} .hero .bar i.warn{background:#ffd27a} .hero .bar i.over{background:#ff9d8a}
.hero .bline{color:rgba(255,255,255,.75)} .hero .bline b{color:#fff}
.hero .linkbtn{color:#fff;text-decoration:underline;text-underline-offset:3px}
.hero .hint{color:rgba(255,255,255,.78)}
/* Jahresrückblick */
.wr{--wa:#e9d3a6;--wb:#3a2a14;--wc:#0d0b09;position:fixed;inset:0;z-index:60;color:#f6f1e8;background:var(--wc);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 26px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:hidden;user-select:none;-webkit-user-select:none;animation:wrIn .42s cubic-bezier(.2,.7,.2,1)}
.wr.out{animation:wrOut .3s ease forwards}
@keyframes wrIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes wrOut{to{opacity:0;transform:scale(.98)}}
.wr-bg{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(60% 45% at 85% 8%,color-mix(in srgb,var(--wa) 38%,transparent),transparent 70%),radial-gradient(70% 55% at 0% 100%,color-mix(in srgb,var(--wb) 90%,transparent),transparent 70%),var(--wc);transition:background .6s ease;animation:wrDrift 18s ease-in-out infinite alternate}
@keyframes wrDrift{to{transform:translate3d(-4%,3%,0) scale(1.06)}}
.wr::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .6px);background-size:3px 3px}
.wr[data-tone="gold"]{--wa:#e9cf9c;--wb:#4a3316;--wc:#0e0b08}
.wr[data-tone="emerald"]{--wa:#8fd6b4;--wb:#0f3b2c;--wc:#06110d}
.wr[data-tone="rose"]{--wa:#f2a7bf;--wb:#4c1630;--wc:#12070c}
.wr[data-tone="sapphire"]{--wa:#9fb8f5;--wb:#16245a;--wc:#070a16}
.wr[data-tone="plum"]{--wa:#d1a6ef;--wb:#35164f;--wc:#0d0714}
.wr[data-tone="ember"]{--wa:#f4b48a;--wb:#55200f;--wc:#120806}
.wr[data-tone="jade"]{--wa:#a8e0d2;--wb:#103e3a;--wc:#06100f}
.wr[data-tone="night"]{--wa:#c9c3e6;--wb:#25223f;--wc:#0a0a10}
.wr-top{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.wr-prog{flex:1;display:flex;gap:4px}
.wr-prog i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.wr-prog i b{display:block;height:100%;width:0;background:rgba(255,255,255,.92)}
.wr-prog i.done b{width:100%}
.wr-prog i.now b{width:100%;animation:wrBar .5s ease}
@keyframes wrBar{from{width:0}}
.wr-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;padding:0;backdrop-filter:blur(8px)}
.wr-x svg{width:16px;height:16px}
.wr-stage{position:relative;z-index:1;flex:1;display:flex;align-items:center}
.wr-slide{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start}

function parseAmount(s){

  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isFinite(n) && n>0 ? Math.round(n*100) : 0;
}

const pad = n => String(n).padStart(2,"0");

const dayOffset = n => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d); };
const curMonth = () => iso(new Date()).slice(0,7);
function shiftMonth(m, k){ const [y,mo] = m.split("-").map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
// ---- Gehaltsmonat: Monat läuft von Gehalt zu Gehalt (settings.payday = Tag, 0 = Kalendermonat) ----
const PD = () => { const p = Number((state.settings||{}).payday)||0; return p>=2 && p<=28 ? p : 0; };
const addDays = (d, n) => { const x = new Date(d+"T12:00"); x.setDate(x.getDate()+n); return iso(x); };
const isPay = e => e.type==="in" && !isKorr(e) && (e.cat==="gehalt" || e.pay);
let perCache = {e:null, p:0, t:"", map:new Map()};
function payStart(sm){
  // Erwarteter Gehaltstag im Monat sm; tatsächlich gebuchtes Gehalt (5 Tage vorher bis 6 Tage später) verschiebt den Start
  const P = PD(), [y,mo] = sm.split("-").map(Number), exp = sm+"-"+pad(Math.min(P, new Date(y,mo,0).getDate()));
  const lo = addDays(exp,-5), hi = addDays(exp,6);
  const got = state.entries.filter(e => isPay(e) && e.date>=lo && e.date<=hi).map(e=>e.date).sort()[0];
  if(got) return got;
  const today = iso(new Date());
  if(today>=exp && today<=addDays(exp,5)) return addDays(today,1); // Gehalt noch nicht da: alter Monat läuft weiter
  return exp;
}
function periodRange(m){
  const P = PD(), today = iso(new Date());
  if(perCache.e!==state.entries || perCache.p!==P || perCache.t!==today) perCache = {e:state.entries, p:P, t:today, map:new Map()};
  let r = perCache.map.get(m); if(r) return r;
  if(!P){ const [y,mo] = m.split("-").map(Number); r = {from:m+"-01", to:m+"-"+pad(new Date(y,mo,0).getDate())}; }
  else { const sm = P>=16 ? shiftMonth(m,-1) : m; r = {from:payStart(sm), to:addDays(payStart(shiftMonth(sm,1)),-1)}; }
  perCache.map.set(m, r); return r;
}
const inPer = (d, m) => { if(!d) return false; if(!PD()) return d.slice(0,7)===m; const r = periodRange(m); return d>=r.from && d<=r.to; };
const periodOf = d => { if(!PD()) return d.slice(0,7); const c = d.slice(0,7); return [c, shiftMonth(c,1), shiftMonth(c,-1)].find(m=>inPer(d,m)) || c; };
function curPeriod(){ const c = curMonth(); if(!PD()) return c; const t = iso(new Date()); return [shiftMonth(c,-1), c, shiftMonth(c,1)].find(m=>inPer(t,m)) || c; }
const perDaysLeft = m => { const r = periodRange(m), t = iso(new Date()); return Math.max(0, Math.round((new Date(r.to+"T12:00") - new Date(t+"T12:00"))/864e5) + 1); };
const perLabel = m => { const r = periodRange(m); return fmtShort(r.from)+" – "+fmtShort(r.to); };
function monthName(m){ const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1,1); const n=d.toLocaleDateString("de-DE",{month:"long"}); return y===new Date().getFullYear()? n : n+" "+y; }
function fmtDay(s){
  if(s===dayOffset(0)) return "Heute";
  if(s===dayOffset(-1)) return "Gestern";
  return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"});
}

function parseSigned(s){

  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s); if(!isFinite(n)) return NaN;
  return Math.round(n*100) * (neg?-1:1);
}

function movement(id){

  for(const e of state.entries){
    if(e.type==="transfer"){ if(e.to===id) m += e.amount; if(e.from===id) m -= e.amount; }
    else if(accOf(e)===id) m += e.type==="in" ? e.amount : -e.amount;
  }
  return m;
}

// Investiert: alles, was in einem Jahr auf Depot-Konten geflossen ist (Einzahlungen, Round-up, Saveback)
function investedYear(year){
  const D = new Set(state.accounts.filter(a=>a.kind==="depot").map(a=>a.id));
  const r = {manual:0, roundup:0, saveback:0, out:0, months:Array(12).fill(0), by:{}};
  const y = String(year);
  for(const e of state.entries){
    if(typeof year==="function" ? !year(e.date||"") : !(e.date||"").startsWith(y)) continue;
    const m = Number((e.date||"").slice(5,7))-1;
    let v = 0;
    if(e.type==="transfer"){
      if(D.has(e.to) && !D.has(e.from)){ v = e.amount; if(e.auto) r.roundup += v; else r.manual += v; }
      else if(D.has(e.from) && !D.has(e.to)){ r.out += e.amount; }
    }
    if(v && m>=0 && m<12) r.months[m] += v;
    if(v){ const dep = e.type==="transfer" ? e.to : accOf(e); r.by[dep] = (r.by[dep]||0) + v; }
  }
  r.total = r.manual + r.roundup + r.saveback;
  return r;
}
const KINDS = {konto:"Konto", bar:"Bargeld", depot:"Depot", ziel:"Sparziel", umschlag:"Zip"};

// Round-up (z. B. Trade Republic): Aufrundung auf den nächsten vollen Euro × Multiplikator, als Umbuchung aufs Depot
const ruDiff = a => a>0 ? (a % 100 === 0 ? 100 : 100 - a % 100) : 0; // 15,00 € → 1,00 €, 0,85 € → 0,15 €
function roundupFor(amount, acc){
  if(!acc || !acc.roundup || !acc.roundupTo || !accById(acc.roundupTo)) return 0;
  return ruDiff(amount) * acc.roundup;
}
const childOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="transfer");
const sbOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="in");
// Saveback (z. B. Trade Republic): Prozent der Kartenzahlung als Einnahme ins Depot, mit Monatsdeckel
// Saveback ist seit v2.25 entfernt (Geschenk, kein Investment): es wird nichts mehr gebucht.
const isSb = e => e.cat==="saveback";
function savebackFor(amount, acc, date, parentId){
  return 0;
  if(!acc || !acc.saveback || !acc.savebackTo || !accById(acc.savebackTo)) return 0;
  const raw = Math.round(amount * acc.saveback / 100);
  const cap = acc.savebackCap || 0;
  if(!cap) return raw;
  const m = (date||"").slice(0,7);
  const used = state.entries.filter(e => e.auto && e.type==="in" && e.sbFrom===acc.id && (e.date||"").slice(0,7)===m && e.parent!==parentId).reduce((s,e)=>s+e.amount,0);
  return Math.max(0, Math.min(raw, cap - used));
}
async function syncRoundup(parentId, data){
  const child = childOf(parentId);
  const acc = data && data.type==="out" ? accById(data.account) : null;
  const amt = acc ? roundupFor(data.amount, acc) : 0;
  if(amt>0) await save("entries", child ? child.id : parentId+"-ru", {type:"transfer", auto:true, parent:parentId, from:acc.id, to:acc.roundupTo, amount:amt, date:data.date, note:"", createdAt:data.createdAt});
  else if(child) await store.del("entries", child.id);
  const sb = sbOf(parentId);
  const sv = acc ? savebackFor(data.amount, acc, data.date, parentId) : 0;
  if(sv>0) await save("entries", sb ? sb.id : parentId+"-sb", {type:"in", auto:true, parent:parentId, sbFrom:acc.id, account:acc.savebackTo, cat:"saveback", amount:sv, date:data.date, note:"", createdAt:data.createdAt});
  else if(sb) await store.del("entries", sb.id);
}

let store = null;
// ---- Automatische Kopien (zweiter Speicher auf dem Gerät) ----
const SAFE = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open("spent-safe", 1); r.onupgradeneeded = () => r.result.createObjectStore("snap"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }));
  const tx = (mode, fn) => db().then(d => new Promise(res => { const t = d.transaction("snap", mode), st = t.objectStore("snap"); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => res(null); t.onabort = () => res(null); })).catch(() => null);
  const SKIP = /^hhb\.(lock|resetUndo|needSetup|hide)$/;
  const dump = () => { const o = {}; try { for(const k of Object.keys(localStorage)) if(k.startsWith("hhb.") && !SKIP.test(k)) o[k] = localStorage.getItem(k); } catch(e){} return o; };
  const count = d => { try { return Object.keys(JSON.parse(d["hhb.entries"]||"{}")).length; } catch(e){ return 0; } };
  const worth = d => { try { const a = JSON.parse(d["hhb.accounts"]||"{}"); return count(d)>0 || Object.values(a).some(x=>x.start); } catch(e){ return false; } };
  const day = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  let tm = null;
  const api = {
    async save(key, force){
      const data = dump(); if(!worth(data)) return;
      key = key || "d-"+day();
      if(!force){ const old = await tx("readonly", st => st.get(key)); if(old && count(old.data) >= 5 && count(data) < count(old.data)/2) return; } // nach Datenverlust die gute Kopie nicht überschreiben
      await tx("readwrite", st => { st.put({at:Date.now(), n:count(data), data}, key); });
      const keys = await tx("readonly", st => st.getAllKeys()) || [];
      const days = keys.filter(k=>String(k).startsWith("d-")).sort(); if(days.length > 7) await tx("readwrite", st => { days.slice(0, days.length-7).forEach(k=>st.delete(k)); });
    },
    later(){ clearTimeout(tm); tm = setTimeout(() => api.save(), 1500); },
    async list(){
      const keys = await tx("readonly", st => st.getAllKeys()) || [], out = [];
      for(const k of keys){ const v = await tx("readonly", st => st.get(k)); if(v && v.data) out.push({key:k, ...v}); }
      return out.sort((a,b)=>b.at-a.at);
    },
    async best(){ const l = (await api.list()).filter(x=>x.n>0); if(!l.length) return null; const mx = Math.max(...l.map(x=>x.n)); return l.find(x=>x.n >= mx*0.8); },
    restore(snap){
      try { Object.keys(localStorage).filter(k=>k.startsWith("hhb.") && !/^hhb\.(lock)$/.test(k)).forEach(k=>localStorage.removeItem(k)); Object.entries(snap.data).forEach(([k,v]) => { if(v!=null) localStorage.setItem(k, v); }); sessionStorage.setItem("hhb.importMsg", "Daten wiederhergestellt: "+snap.n+" Einträge"); } catch(e){}
      location.reload();

const subsOf = cat => { const L = ((state.settings||{}).subsList||{})[cat]; return L ? L.slice() : (SUBS[cat]||[]).concat(customSubs(cat).filter(x=>!(SUBS[cat]||[]).includes(x))); };
function subChips(cat, sel){
  if(!cat) return "";
  return subsOf(cat).map(n=>`<button class="chip sub" data-sub="${esc(n)}" aria-pressed="${n===sel}">${esc(n)}</button>`).join("")
    + (sel && !subsOf(cat).includes(sel) ? `<button class="chip sub" data-sub="${esc(sel)}" aria-pressed="true">${esc(sel)}</button>` : "")
    + `<button class="chip ghost" data-subnew="1">+ Eigene</button>`;
}
// Klick-Logik für eine Unterkategorie-Zeile; gibt true zurück, wenn der Klick behandelt wurde
function subClick(e, box, d, redraw){
  const b = e.target.closest("[data-sub]");
  if(b && box.contains(b)){ d.sub = d.sub===b.dataset.sub ? null : b.dataset.sub; redraw(); return true; }
  const nb = e.target.closest("[data-subnew]");
  if(nb && box.contains(nb)){
    nb.outerHTML = `<span class="subadd"><input class="input" id="subIn" placeholder="z. B. Motorrad" autocomplete="off" aria-label="Eigene Unterkategorie"><button class="chip" data-subok="1">Hinzufügen</button></span>`;
    const inp = box.querySelector("#subIn"); inp.focus();
    inp.onkeydown = ev => { if(ev.key==="Enter"){ ev.preventDefault(); box.querySelector("[data-subok]").click(); } };
    return true;
  }
  const ok = e.target.closest("[data-subok]");
  if(ok && box.contains(ok)){
    const v = (box.querySelector("#subIn").value||"").trim().slice(0,40);
    if(v){ d.sub = v; if(!subsOf(d.cat).includes(v)){ const subs = {...(state.settings.subs||{})}; subs[d.cat] = customSubs(d.cat).concat([v]); const sl = {...(state.settings.subsList||{})}; if(sl[d.cat]) sl[d.cat] = sl[d.cat].concat([v]); state.settings = {...state.settings, subs, subsList:sl}; save("settings","main",{...settingsData(), subs, subsList:sl}).catch(()=>{}); } }
    redraw(); return true;
  }
  return false;
}

function subBreak(list){
  const g = {}; list.forEach(e=>{ const k = e.sub || "Ohne Unterkategorie"; g[k] = (g[k]||0) + e.amount; });
  const arr = Object.entries(g).sort((a,b)=>b[1]-a[1]);
  if(arr.length<2 && arr[0] && arr[0][0]==="Ohne Unterkategorie") return "";
  return `<ul class="subs">${arr.map(([k,v])=>`<li><span>${esc(k)}</span><b class="num">${money(v)}</b></li>`).join("")}</ul>`;
}

    const sf = el.querySelector("#obSafe"); if(sf && safeSnap) sf.innerHTML = safeHtml();
    const b = el.querySelector("#obBank"); if(b) b.oninput = e => { st.bank = e.target.value; };

    el.querySelectorAll("[data-xn]").forEach(x => x.oninput = e => { st.extra[+e.target.dataset.xn].name = e.target.value; const nx = el.querySelector("[data-obnext]"); if(nx && fresh) nx.disabled = !(st.acc.size>0 || st.extra.some(y=>y.name.trim())); });

  };
  const close = () => { el.classList.add("out"); document.body.style.overflow = ""; setTimeout(()=>el.remove(), 260); };
  const finish = async () => {
    const accs = local.read("accounts"); const ents = Object.keys(local.read("entries")).length;
    const make = (k,n,kind,o) => ({name:n, kind, start:0, order:o});
    if(fresh && !ents){
      const nw = {}; const L = plan();
      L.forEach(p => { nw[p.k] = {...make(p.k, p.name, p.kind, p.o), start: st.bal[p.k]||0, ...(p.depot?{depot:p.depot}:{})}; });
      if(!Object.keys(nw).length) nw.giro = make("giro","Girokonto","konto",0);
      if(st.inv && !L.some(p=>p.kind==="depot")) nw.depot = make("depot", st.depot.trim() || "Depot", "depot", 10);
      if(st.zips) [...st.zipSel].forEach((n,k)=>{ const e = (ZIPS.find(z=>z[0]===n)||[])[1]; nw["z"+k+newId()] = {name:n, kind:"umschlag", start:0, order:20+k, ...(e?{icon:e}:{})}; });
      local.write("accounts", nw);
    } else {
      if(st.acc.has("neo") && !Object.values(accs).some(a=>a.kind==="konto" && (a.name||"").toLowerCase()===st.neo.toLowerCase())){ const did = "depot"+newId(); accs[did] = make("", depName(st.neo), "depot", 9.5); accs["neo"+newId()] = {...make("", st.neo, "konto", 9), depot:did}; }
      ACC.forEach(([k,,n],o)=>{ if(!st.acc.has(k) || k==="neo") return; const exists = k==="giro" ? Object.values(accs).some(a=>a.kind==="konto") : k==="bargeld" ? Object.values(accs).some(a=>a.kind==="bar") : Object.values(accs).some(a=>new RegExp(n,"i").test(a.name||"")); if(!exists) accs[k+newId()] = make(k,n,k==="bargeld"?"bar":"konto",o); });
      st.extra.forEach((x,j)=>{ if(x.name.trim()) accs[x.id] = make("", x.name.trim().slice(0,30), x.kind, 30+j); });
      if(st.inv && !st.acc.has("neo") && !Object.values(accs).some(a=>a.kind==="depot")) accs["depot"+newId()] = make("depot", st.depot.trim() || "Depot", "depot", 10);
      local.write("accounts", accs);
    }
    try { localStorage.setItem("hhb.theme", st.theme); } catch(_){} applyTheme(st.theme);
    await save("settings","main",{...settingsData(), zips: !!st.zips});
    { const all = local.read("accounts"), k0 = Object.keys(all)[0]; if(k0) await store.set("accounts", k0, all[k0]); }
    state.tab = st.zips ? "sips" : "monat"; close(); render();
    toast(fresh ? (Object.values(st.bal).some(Boolean) ? "Fertig eingerichtet" : "Fertig eingerichtet. Kontostände trägst du unter Konten ein.") : "Einstellungen übernommen");
  };
  el.addEventListener("click", e => {
    const t = e.target;
    if(t.closest("[data-obskip]")){ close(); return; }
    if(t.closest("[data-obimp]")){ close(); pickBackup(); return; }
    if(t.closest("[data-obsafe]")){ if(safeSnap) SAFE.restore(safeSnap); return; }
    if(t.closest("[data-obback]")){ i = Math.max(0,i-1); draw(); return; }
    if(t.closest("[data-obnext]")){ if(i===pages.length-1) finish(); else { i++; draw(); } return; }
    if(t.closest("[data-xadd]")){ st.extra.push({id:"a"+newId(), name:"", kind:"konto"}); draw(); const ins = el.querySelectorAll("[data-xn]"); if(ins.length) ins[ins.length-1].focus(); return; }
    const xd = t.closest("[data-xd]"); if(xd){ st.extra.splice(+xd.dataset.xd,1); draw(); return; }
    const xk = t.closest("[data-xk]"); if(xk){ const [j,k] = xk.dataset.xk.split(":"); st.extra[+j].kind = k; if(k==="depot") st.inv = true; draw(); return; }
    const a = t.closest("[data-acc]"); if(a){ const k = a.dataset.acc; st.acc.has(k) ? st.acc.delete(k) : st.acc.add(k); if(k==="neo" && st.acc.has(k)) st.inv = true; draw(); return; }
    const o = t.closest("[data-ob]"); if(o){ st[o.dataset.ob] = o.dataset.v==="true"; draw(); return; }
    const nb = t.closest("[data-neo]"); if(nb){ st.neo = nb.dataset.neo; st.inv = true; draw(); return; }
    const z = t.closest("[data-zs]"); if(z){ const n = z.dataset.zs; st.zipSel.has(n) ? st.zipSel.delete(n) : st.zipSel.add(n); draw(); return; }
    const th = t.closest("[data-obtheme]"); if(th){ st.theme = th.dataset.obtheme; applyTheme(st.theme); draw(); return; }
  });
  draw();
}

// ---- Prognose für kommende Monate ----
function recDates(r, m){
  if(!r.amount || !r.start) return [];
  const day = Number(r.start.slice(8,10)), end = periodRange(m).to, out = []; let d = r.next || r.start, g = 0;
  while(d <= end && g++ < 400){ if(inPer(d, m)) out.push(d); d = addInterval(d, r.interval, day); }
  return out;
}
function usualSpend(){
  // Ø Alltagsausgaben (ohne Daueraufträge) der letzten 3 vollen Monate mit Einträgen
  const cur = curPeriod(), ms = [1,2,3].map(k=>shiftMonth(cur,-k));
  const sums = ms.map(mm => state.entries.filter(e=>e.type==="out" && !e.rec && !isKorr(e) && inPer(e.date, mm)).reduce((s,e)=>s+e.amount,0)).filter(v=>v>0);
  return sums.length ? Math.round(sums.reduce((a,b)=>a+b,0)/sums.length) : 0;
}
function forecastMonth(m){
  const items = [];
  for(const r of state.recurring){
    const isInv = r.type==="transfer" && (accById(r.to)||{}).kind==="depot" && (accById(r.from)||{}).kind!=="depot";
    if(r.type==="transfer" && !isInv) continue;
    for(const d of recDates(r, m)) items.push({d, r, kind: r.type==="in" ? "in" : isInv ? "inv" : "out"});
  }
  items.sort((a,b)=>a.d.localeCompare(b.d));
  const sum = k => items.filter(x=>x.kind===k).reduce((s,x)=>s+x.r.amount,0);
  const inn = sum("in"), out = sum("out"), inv = sum("inv"), usual = usualSpend();
  return {items, inn, out, inv, usual, net: inn - out - inv - usual};
}
function availNow(){
  const m = curPeriod(), ents = state.entries.filter(e=>inPer(e.date, m) && !isKorr(e));
  const earned = ents.filter(e=>e.type==="in" && !isSb(e)).reduce((s,e)=>s+e.amount,0), spent = ents.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0);
  const pend = pendingRecs(m).reduce((s,x)=>s+x.r.amount,0);
  return earned - spent - investedYear(d=>inPer(d,m)).total - pend;
}

  if(noIncome) h += `<div class="fixcard"><div><b>Gehalt fehlt in der Prognose</b><p>Leg dein Gehalt als Dauerauftrag (Einnahme) an, dann rechnet die Prognose damit.</p></div><button id="addRec">Anlegen</button></div>`;

    : `<p class="hint" style="margin:0 4px">Für diesen Monat ist nichts geplant.</p>`;

// ---- Noch verfügbar ----
function pendingRecs(m){
  // noch fällige Daueraufträge in Monat m (nach heute, noch nicht gebucht)
  const today = iso(new Date()), end = periodRange(m).to, out = [];
  for(const r of state.recurring){
    const isInv = r.type==="transfer" && (accById(r.to)||{}).kind==="depot";
    if(!(r.type==="out" || isInv) || !r.amount || !r.start) continue;
    const day = Number(r.start.slice(8,10)); let d = r.next || r.start, g = 0;
    while(d <= end && g++ < 100){
      if(inPer(d, m) && d > today && !state.entries.some(e=>e.id==="rec-"+r.id+"-"+d)) out.push({r, d, inv:isInv});
      d = addInterval(d, r.interval, day);
    }
  }
  return out.sort((a,b)=>a.d.localeCompare(b.d));
}

    : [["Einnahmen", "+"+money(earned), "pos"], ["Ausgaben", "−"+money(spent)]]; if(!live && (hasDepot()||invM)) rows.push(["Investiert", "−"+money(invM)]);

  const list = pend.map(x=>`<div class="pl"><span>${esc(fmtShort(x.d))} · ${esc(x.r.name || (x.inv?"Sparplan":(catById(x.r.cat)||{}).name||"Dauerauftrag"))}</span><span class="num">−${money(x.r.amount)}</span></div>`).join("");
  return `<details class="avail"><summary>
      <div><div class="label">${PD() ? (cur ? "Noch verfügbar bis "+esc(fmtShort(periodRange(m).to)) : "Übrig · "+esc(perLabel(m))) : cur?"Noch verfügbar im "+esc(monthName(m).split(" ")[0]):"Übrig im "+esc(monthName(m).split(" ")[0])}</div>

        ${cur && ccOpen().length ? `<div class="asub">Kreditkarte: <b class="num">${money(ccOpen().reduce((s,x)=>s+x.open,0))}</b> gehen am ${esc(fmtShort(ccOpen()[0].d))} vom ${esc(accName(ccOpen()[0].a.cc.from))} ab</div>` : ""}

// ---- Kontoübersicht: was lief über welches Konto ----
const accMatch = (e, f) => { const ids = f==="__zips" ? new Set(umschlaege().map(a=>a.id)) : new Set([f]);
  return e.type==="transfer" ? (ids.has(e.from) || ids.has(e.to)) : ids.has(accOf(e)); };
function accOverview(inMonth, m, bare){
  const rows = konten().filter(a=>a.kind!=="depot").map(a=>({id:a.id, name:a.name, kind:a.kind, a}));
  if(umschlaege().length) rows.push({id:"__zips", name:"Zips", kind:"zip"});
  const real = inMonth.filter(e => !isKorr(e) && !isSb(e) && !e.auto);
  for(const r of rows){ const es = real.filter(e => e.type!=="transfer" && accMatch(e, r.id));
    r.out = es.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0); r.inn = es.filter(e=>e.type==="in").reduce((s,e)=>s+e.amount,0); r.n = es.length; }
  const act = rows.filter(r=>r.out||r.inn).sort((a,b)=>b.out-a.out || b.inn-a.inn);
  if(!act.length) return "";
  const mx = Math.max(1, ...act.map(r=>r.out));
  const ic = r => r.kind==="zip" ? "zip" : r.kind==="bar" ? "atm" : pairOf(r.a) ? "invest" : "bank";
  const col = r => r.kind==="zip" ? "--c5" : r.kind==="bar" ? "--c3" : "--c1";
  const list = `<div class="accov">${act.map(r=>`
    <button class="aov" data-accf="${esc(r.id)}" aria-pressed="${state.accF===r.id}">
      <span class="badge" style="--bc:var(${col(r)})" aria-hidden="true">${svgI(ic(r))}</span>
      <span class="aov-mid"><span class="aov-n">${esc(r.name)}</span><span class="aov-s">${r.n} ${r.n===1?"Eintrag":"Einträge"}${r.inn?` · <b class="pos num">+${money(r.inn)}</b> rein`:""}</span>
        <span class="track"><i style="width:${(r.out/mx*100).toFixed(1)}%;background:var(${col(r)})"></i></span></span>
      <span class="aov-a num">${r.out?"−"+money(r.out):"–"}</span></button>`).join("")}</div>`;
  return bare ? list : `<section><h2><span>Über welches Konto?</span></h2>${list}</section>`;
}

  document.querySelectorAll("#tabs [data-tab]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tab===state.tab)));

  if(state.tab==="sips" && state.ready){ renderSips(); return; }

  $("#next").disabled = m >= shiftMonth(curPeriod(), 12);
  const main = $("#main");
  if(!state.ready){ main.innerHTML = `<div class="empty">Daten werden geladen …</div>`; return; }

  const ins = inMonth.filter(e => e.type==="in" && !isKorr(e) && !isSb(e));
  const spent = outs.reduce((s,e)=>s+(e.amount||0),0);

  const invM = investedYear(d=>inPer(d,m)).total;

  // budget

  let budgetHtml = "";

    const rest = budget - spent;
    const isCur = m===curPeriod();
    const daysLeft = isCur ? perDaysLeft(m) : 0;
    const perDay = isCur && rest>0 && daysLeft>0 ? ` · <span>noch <b class="num">${money(Math.floor(rest/daysLeft))}</b> pro Tag</span>` : "";
    budgetHtml = `<div class="budget">
      <div class="bline"><span>Budget <b class="num">${money(budget)}</b></span><span>${rest>=0?`<b class="num">${money(rest)}</b> übrig`:`<b class="num neg">${money(-rest)}</b> überzogen`}</span></div>
      <div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent des Budgets verbraucht"><i class="${pct>1?"over":pct>.85?"warn":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i></div>
    </div>`;
  }

  let html = reminderHtml() + `<div class="hero">
    ${availHtml(m, earned, spent, invM)}
    ${budgetHtml}

      <div><div class="label">Raus</div><div class="v num">${money(spent)}</div></div>
      ${hasDepot()||invM?`<div><div class="label">Investiert</div><div class="v num">${money(invM)}</div></div>`:""}
    </div>
  </div>`;

  if(m===curPeriod()) html += wrappedBanner();
  // categories + Kuchendiagramm
  const byCat = OUT_CATS.map(c => ({...c, sum: outs.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0), n: outs.filter(e=>e.cat===c.id).length}))
    .filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
  if(byCat.length){
    const hasZips = umschlaege().length>0;
    const accL = accOverview(inMonth, m, true);
    const mode = state.pie==="acc" && accL ? "acc" : state.pie==="place" ? "place" : state.pie==="zip" && hasZips ? "zip" : "cat";
    let segs = [];
    if(mode==="cat") segs = byCat.map(c=>({k:c.id, name:c.name, i:c.i, sum:c.sum, n:c.n, col:c.c}));

// Beträge beim Tippen mit Tausenderpunkt anzeigen (9100 → 9.100), beim Verlassen mit Cent (9.100,00)
function fmtAmountStr(v, full){
  v = String(v||"");
  const neg = /^\s*[-−]/.test(v);
  let t = v.replace(/[^\d,.]/g,"");
  t = t.replace(/\./g,"");
  const i = t.indexOf(","); let int = i<0 ? t : t.slice(0,i), dec = i<0 ? null : t.slice(i+1).replace(/,/g,"").slice(0,2);
  int = int.replace(/^0+(?=\d)/,"");
  if(!int && dec===null) return neg ? "-" : "";
  int = (int||"0").replace(/\B(?=(\d{3})+(?!\d))/g,".");
  if(full){ dec = (dec||"").padEnd(2,"0"); }
  return (neg?"-":"") + int + (dec!==null ? ","+dec : "");
}
const centFmt = v => { v = String(v||""); const neg = /^\s*[-−]/.test(v); const dg = v.replace(/\D/g,"").replace(/^0+/,"").slice(0,11); if(!dg) return neg ? "-" : "";
  const c = dg.padStart(3,"0"); return (neg?"-":"") + c.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,".") + "," + c.slice(-2); };

    if(centMode()){ inp.setAttribute("inputmode","numeric"); if(/^0(,00)?$/.test(inp.placeholder||"")) inp.placeholder = "0,00"; }

  if(centMode()){ const nv = centFmt(inp.value); if(nv!==inp.value) inp.value = nv; try { inp.setSelectionRange(nv.length, nv.length); } catch(_){} return; }
  const old = inp.value, pos = inp.selectionStart ?? old.length;
  const digitsBefore = old.slice(0,pos).replace(/[^\d,]/g,"").length;

const ZIP_SVG = {"✉️":"zip","✈️":"plane","🚗":"mobilitaet","🎁":"geschenk","🛒":"lebensmittel","💸":"atm","🛟":"lifebuoy","👕":"shirt","🏠":"wohnen","🐾":"paw","📱":"phone","🎉":"sparkle","💊":"gesundheit","🐷":"piggy","💇":"scissors","📄":"receipt","🎓":"cap","👶":"baby","🍼":"baby","⚽":"ball","🎮":"game","📚":"book","🎄":"tree","💍":"ring","🏖️":"sun","🍽️":"restaurant","⛽":"fuel","🧾":"receipt"};

const zipColor = a => { const i = umschlaege().findIndex(z=>z.id===a.id); return "--c"+((Math.max(0,i)%8)+1); };
function zipMonth(id, m){
  let inn = 0, out = 0;
  for(const e of state.entries){
    if(!inPer(e.date, m)) continue;
    if(e.type==="transfer" && (isTg(e.from) || isTg(e.to) || e.park)) continue;
    if(e.type==="transfer"){ if(e.to===id) inn += e.amount; if(e.from===id) out += e.amount; }
    else if(e.type==="out" && e.zip===id){ out += e.amount; }
    else if(accOf(e)===id && !isKorr(e)){ if(e.type==="out") out += e.amount; else inn += e.amount; }
  }
  return {inn, out};
}

  const [whole, cents] = money(Math.abs(inEnv)).replace(/\s?€/,"").split(",");

    <div><div class="label">In allen Zips</div><div class="big num">${inEnv<0?"−":""}${esc(whole)}<span class="cents">,${esc(cents)} €</span></div>${inTg||inPk?`<div class="asub">davon bar <b class="num">${money(inEnv-inTg-inPk)}</b>${inTg?` · Tagesgeld <b class="num">${money(inTg)}</b>`:""}${inPk?` · auf Konten <b class="num">${money(inPk)}</b>`:""}</div>`:""}</div>
    ${us.length?`<div class="acts"><button class="main" id="fillAll">Zips befüllen</button><button id="payZip">Aus Zip bezahlen</button></div>`:""}
  </div>`;
  if(free<0 && us.length) html += `<div class="fixcard"><div><b>Bargeld ohne Zip: ${money(free)}</b><p>Meist wurden Zips aus Bargeld befüllt, obwohl das Geld schon drin steckte.</p></div><button id="fixFills">Korrigieren</button></div>`;
  html += `<section><h2><span>Deine Zips</span></h2>`;
  if(!us.length) html += `<div class="empty" style="padding:20px 16px"><strong>Noch keine Zips</strong>Für dein Bargeld im Budgetplaner. Leg los mit einem Tipp:</div>
    <div class="chips" style="justify-content:center">${["Urlaub","Auto","Rückzahlung","Geschenke","Lebensmittel","Notgroschen"].map(n=>`<button class="chip" data-newenv="${n}">+ ${n}</button>`).join("")}</div>
    <div class="addrow" style="margin-top:14px"><button class="addbtn" id="addEnv">+ Eigenen Zip anlegen</button></div>`;
  else html += `<div class="zgrid">${us.map(a => {
    const b = zipTotal(a), tg = tgShare(a.id), t = a.target||0, pct = t ? Math.max(0,Math.min(1,b/t)) : 0, x = zipMonth(a.id, m);
    return `<div class="zcard" style="--zc:var(${zipColor(a)})">
      <button class="open" data-zip="${esc(a.id)}" aria-label="${esc(a.name)} öffnen">
        <span class="ztop"><span class="ic" aria-hidden="true">${zipSvg(a)}</span><span class="zn">${esc(a.name)}</span></span>
        <span class="zb num ${b<0?"neg":""}">${money(b)}</span>${tg?`<span class="ztg"><i aria-hidden="true">${svgI("bank")}</i>${money(tg)} auf Tagesgeld</span>`:""}${parkAccs(a.id).filter(x=>x.v>0).map(x=>`<span class="ztg"><i aria-hidden="true">${svgI("bank")}</i>${money(x.v)} auf ${esc(x.a.name)}</span>`).join("")}
        ${t?`<span class="zbar" role="img" aria-label="${Math.round(pct*100)} Prozent von ${money(t)}"><i style="width:${(pct*100).toFixed(1)}%"></i></span><span class="zt">${b>=t?"Ziel erreicht":`${Math.round(pct*100)} % von ${money(t)}`}</span>`:""}
        <span class="zm">${x.out ? `${MON[Number(m.slice(5))-1]} ausgegeben ${money(x.out)}` : x.inn ? `${MON[Number(m.slice(5))-1]} befüllt ${money(x.inn)}` : ""}</span>
      </button>
    </div>`;
  }).join("")}<button class="zcard addz" id="addEnv">+ Neuer Zip</button></div>`;
  html += `</section>`;
  if(us.length && zipTgOn()){
    html += `<section><h2><span>Tagesgeld</span><button class="linkbtn" id="addTg">+ Neu</button></h2>`;
    html += tgAccs().map(t => { const bal = balance(t), sh = us.reduce((s,a)=>s+tgShare(a.id, t.id),0), x = accBreak(t.id);
      const zins = x.inn - x.out, rest = bal - sh - zins;
      const parts = us.map(a=>({a, v:tgShare(a.id, t.id)})).filter(x=>x.v);
      return `<div class="tgcard"><button class="tgtop" data-account="${esc(t.id)}"><span class="ic" aria-hidden="true">${svgI("bank")}</span><span class="tgn">${esc(t.name)}</span><b class="num">${money(bal)}</b></button>
        <div class="tgrows">${parts.map(x=>`<div><span><i class="zi" style="color:var(${zipColor(x.a)})">${zipSvg(x.a)}</i>${esc(x.a.name)}</span><b class="num">${money(x.v)}</b></div>`).join("")}
          ${zins?`<div><span>Zinsen</span><b class="num ${zins>0?"pos":"neg"}">${zins>0?"+":""}${money(zins)}</b></div>`:""}
          ${rest?`<div class="tgfree"><span>Keinem Zip zugeordnet</span><b class="num">${money(rest)}</b></div>${rest>0?`<p class="hint">Gehört es zu euren Zips? Dann zuordnen.</p><button class="tgint" data-tgasg="${esc(t.id)}">${svgI("zip")}Zips zuordnen</button>`:""}`:""}
          ${!parts.length&&!rest&&!zins?`<p class="hint">Noch nichts eingezahlt. Öffne einen Zip und tippe auf „Aufs Tagesgeld“.</p>`:""}</div>
        <button class="tgint" data-tgint="${esc(t.id)}">${svgI("plus")}Zinsen eintragen</button></div>`; }).join("");
    html += `</section>`;
  }
  if(us.length){
    const ids = new Set(us.map(a=>a.id));
    const moves = state.entries.filter(e => !e.parkRel && (e.type==="transfer" ? (ids.has(e.from)||ids.has(e.to)) : (ids.has(accOf(e)) || ids.has(e.zip))))
      .sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1)).slice(0,15);
    if(moves.length) html += `<section><h2><span>Letzte Bewegungen</span></h2><ul class="entries">${moves.map(entryRow).join("")}</ul></section>`;
  }
  $("#main").innerHTML = html;
}

// Tagesgeld-Geld nachträglich Zips zuordnen (Tagesgeld-Stand bleibt gleich)
function tgAssignSheet(t){
  const us = umschlaege(); const x = accBreak(t.id);
  const free = balance(t) - us.reduce((s,a)=>s+tgShare(a.id, t.id),0) - (x.inn - x.out);
  let mode = "add";
  openSheet(`
    <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Zips zuordnen</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="sublabel" style="margin:0">Auf ${esc(t.name)} liegen <b class="num">${money(free)}</b>, die noch keinem Zip gehören. Der Stand vom Tagesgeld bleibt gleich.</p>
    <div><div class="label" style="margin-bottom:6px">Zählt der Zip-Betrag dieses Geld schon mit?</div><div class="chips" id="taMode">
      <button class="chip" data-tam="add">Nein, kommt dazu</button><button class="chip" data-tam="in">Ja, ist schon drin</button></div>
      <p class="hint" id="taHint" style="margin-top:8px"></p></div>
    <div class="splits">${us.map(a=>`<label class="splitrow" style="--zc:var(${zipColor(a)})"><span><i class="zi" style="color:var(${zipColor(a)})">${zipSvg(a)}</i>${esc(a.name)} <small class="num" style="color:var(--muted)">(${money(zipTotal(a))})</small></span><input class="input num" inputmode="decimal" placeholder="0" data-ta="${esc(a.id)}" autocomplete="off" aria-label="Betrag für ${esc(a.name)}"></label>`).join("")}</div>
    <p class="splitrest" id="taSum"></p>
    <div class="row"><button class="primary" id="ok">Zuordnen</button></div>
  `);
  const vals = () => us.map(a=>({a, v: parseAmount(document.querySelector(`[data-ta="${a.id}"]`).value)}));
  const sync = () => {
    document.querySelectorAll("#taMode [data-tam]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tam===mode)));
    $("#taHint").textContent = mode==="add" ? "Der Zip wird um den Betrag größer (Bargeld bleibt gleich, Tagesgeld-Anteil kommt dazu). Gesamtvermögen bleibt gleich." : "Der Betrag wird im Zip vom Bargeld zum Tagesgeld verschoben. Der Zip bleibt gleich groß, die doppelte Zählung im Gesamtvermögen verschwindet.";
    const sum = vals().reduce((s,x)=>s+x.v,0), left = free - sum;
    $("#taSum").innerHTML = `Zugeordnet <b class="num">${money(sum)}</b> · danach frei <b class="num ${left<0?"neg":""}">${money(left)}</b>${left<0?`<br><span style="color:var(--danger)">Mehr als frei ist</span>`:""}`;
    $("#ok").disabled = !sum || left<0;
  };
  sync();
  document.querySelectorAll("[data-ta]").forEach(i=>i.oninput = sync);
  $("#taMode").onclick = e => { const b = e.target.closest("[data-tam]"); if(b){ mode = b.dataset.tam; sync(); } };
  $("#cancel").onclick = closeSheet;
  $("#ok").onclick = async () => {
    const vs = vals().filter(x=>x.v>0), sum = vs.reduce((s,x)=>s+x.v,0), today = iso(new Date()), now = Date.now();
    closeSheet();
    for(const {a,v} of vs){
      if(mode==="add"){ const {id, ...d} = a; await store.set("accounts", id, {...d, start:(d.start||0)+v}); }
      await store.set("entries", newId(), {type:"transfer", from:a.id, to:t.id, amount:v, date:today, note:"Zuordnung Tagesgeld", createdAt:now});
    }
    const {id, ...td} = accById(t.id); await store.set("accounts", id, {...td, start:(td.start||0)-sum});
    toast(`${money(sum)} zugeordnet`);
  };
}

// Zip-Detail
function zipSheet(a){
  const b = zipTotal(a), cash = balance(a), tg = tgShare(a.id), tgs = tgAccs(), t = a.target||0, pct = t ? Math.max(0,Math.min(1,b/t)) : 0;
  const now = new Date(); const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); const mm = d.getFullYear()+"-"+pad(d.getMonth()+1); months.push({mm, l:MON[d.getMonth()], ...zipMonth(a.id, mm)}); }
  const mx = Math.max(1, ...months.map(x=>Math.max(x.inn,x.out)));
  const moves = state.entries.filter(e => !e.parkRel && (e.type==="transfer" ? (e.from===a.id||e.to===a.id) : (accOf(e)===a.id || e.zip===a.id)))
    .sort((x,y)=> x.date===y.date ? (y.createdAt||0)-(x.createdAt||0) : (x.date<y.date?1:-1)).slice(0,12);
  const spent = state.entries.filter(e=>e.type==="out" && (accOf(e)===a.id || e.zip===a.id) && !isKorr(e));
  const pks = parkAccs(a.id), pkTo = konten().filter(a=>isParkAcc(a.id)).sort((x,y)=>(!!y.roundup - !!x.roundup))[0];
  const byCat = OUT_CATS.map(c=>({c, sum: spent.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0)})).filter(x=>x.sum).sort((x,y)=>y.sum-x.sum).slice(0,3);
  openSheet(`
    <div class="sheet-head"><button class="xbtn" id="zEdit" aria-label="Zip bearbeiten">${svgI("edit")}</button><h3 id="sheetTitle">Zip</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="zhead" style="--zc:var(${zipColor(a)})"><span class="ic" aria-hidden="true">${zipSvg(a)}</span><div style="min-width:0"><div style="font-weight:600">${esc(a.name)}</div><div class="zb num ${b<0?"neg":""}">${money(b)}</div></div></div>
    ${t?`<div><div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent"><i style="width:${(pct*100).toFixed(1)}%"></i></div><p class="hint" style="margin-top:6px">${b>=t?"Ziel erreicht 🎉":`Noch ${money(t-b)} bis ${money(t)}`}</p></div>`:""}
    ${zipTgOn() && tgs.length ? `<div class="zsplit"><div><span>${svgI("zip")}Bar im Zip</span><b class="num ${cash<0?"neg":""}">${money(cash)}</b></div><div><span>${svgI("bank")}Auf Tagesgeld</span><b class="num">${money(tg)}</b></div>
      <div class="zsplit-acts"><button data-zact="tgin">Aufs Tagesgeld</button><button data-zact="tgout" ${tg>0?"":"disabled"}>Zurückholen</button></div></div>` : tg ? `<p class="hint">Davon ${money(tg)} auf Tagesgeld.</p>` : ""}
    ${pks.length ? `<div class="zpark">${pks.map(x=>`<div class="zpk"><span>${svgI("bank")}Auf ${esc(x.a.name)}</span><b class="num ${x.v<0?"neg":""}">${money(x.v)}</b></div>
      ${x.v>0?`<div class="zsplit-acts"><button data-zback="${esc(x.a.id)}">Zurück in den Zip</button><button data-zfree="${esc(x.a.id)}">Freigeben</button></div>`:""}`).join("")}
      <p class="hint">Ausgaben mit dem Konto ordnest du beim Eintragen dem Zip zu. Round-up läuft ganz normal.</p></div>` : ""}
    <div class="zacts"><button data-zact="pay">${svgI("pay")}Bezahlen</button><button data-zact="fill">${svgI("plus")}Befüllen</button>${pkTo?`<button data-zact="park">${svgI("bank")}Aufs Konto</button>`:""}<button data-zact="take">${svgI("out")}Rausnehmen</button></div>
    <div><div class="label" style="margin-bottom:8px">Letzte 6 Monate</div>
      <div class="hist" role="img" aria-label="Befüllt und ausgegeben pro Monat">${months.map(x=>`<div class="col"><i class="in" style="height:${x.inn?Math.max(3,x.inn/mx*100):0}%" title="${x.l}: +${money(x.inn)}"></i><i class="out" style="height:${x.out?Math.max(3,x.out/mx*100):0}%" title="${x.l}: −${money(x.out)}"></i></div>`).join("")}</div>
      <div class="hlab">${months.map(x=>`<span>${x.l}</span>`).join("")}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Befüllt</span><span><i style="background:var(--danger)"></i>Raus</span></div>
    </div>
    ${byCat.length?`<div><div class="label" style="margin-bottom:6px">Wofür ausgegeben</div><p class="hint" style="color:var(--ink)">${byCat.map(x=>`${esc(x.c.name)} <b class="num">${money(x.sum)}</b>`).join(" · ")}</p></div>`:""}
    <div><div class="label" style="margin-bottom:6px">Bewegungen</div>${moves.length?`<ul class="entries">${moves.map(entryRow).join("")}</ul>`:`<p class="hint">Noch keine.</p>`}</div>
  `);
  $("#cancel").onclick = closeSheet;
  document.querySelectorAll("[data-zact]").forEach(btn => btn.onclick = () => {
    const bar0 = konten().find(x=>x.kind==="bar") || konten()[0]; const k = btn.dataset.zact;
    if(k==="pay") entrySheet(null, {type:"out", account:a.id});
    else if(k==="fill") entrySheet(null, {type:"transfer", from:bar0&&bar0.id, to:a.id});
    else if(k==="take") entrySheet(null, {type:"transfer", from:a.id, to:bar0&&bar0.id});
    else if(k==="tgin") entrySheet(null, {type:"transfer", from:a.id, to:tgs[0].id, note:"Aufs Tagesgeld"});
    else if(k==="tgout"){ const src = tgs.find(t=>tgShare(a.id, t.id)>0) || tgs[0]; entrySheet(null, {type:"transfer", from:src.id, to:a.id, note:"Vom Tagesgeld"}); }
    else if(k==="park") entrySheet(null, {type:"transfer", from:a.id, to:pkTo.id, park:true});
    else accountSheet(a);
  });
  $("#zEdit").onclick = () => accountSheet(a);
  // Rest vom Konto zurück in den Zip (nur Zuordnung) oder freigeben (gehört dann dem Konto)
  document.querySelectorAll("[data-zback],[data-zfree]").forEach(btn => btn.onclick = async () => {
    const acc = accById(btn.dataset.zback || btn.dataset.zfree), v = parkShare(a.id, acc.id); if(!acc || v<=0) return;
    const today = iso(new Date()), now = Date.now();
    if(btn.dataset.zback){ entrySheet(null, {type:"transfer", from:acc.id, to:a.id, park:true, amount:v, note:"Zurück in den Zip"}); return; }
    closeSheet();
    const id1 = newId(), id2 = newId();
    await save("entries", id1, {type:"transfer", park:true, parkRel:true, from:acc.id, to:a.id, amount:v, date:today, note:"", createdAt:now});
    await save("entries", id2, {type:"transfer", from:a.id, to:acc.id, amount:v, date:today, note:"Rest freigegeben", createdAt:now+1});
    toast(`${money(v)} gehören jetzt ${acc.name}`, async () => { await store.del("entries", id1); await store.del("entries", id2); });
  });
}

// Anfangsbestände aller Zips (ohne Buchung, ohne Bargeld-Abzug)
function zipStartSheet(){
  const us = umschlaege();
  openSheet(`
    <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Anfangsbestände</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <div class="splits">${us.map(a=>`<label class="splitrow" style="--zc:var(${zipColor(a)})"><span><i class="zi" style="color:var(${zipColor(a)})">${zipSvg(a)}</i>${esc(a.name)}</span><input class="input num" inputmode="decimal" placeholder="0" value="${esc(toInput(a.start||0))}" data-zs="${esc(a.id)}" autocomplete="off" aria-label="Anfangsbestand ${esc(a.name)}"></label>`).join("")}</div>

// Befüllungen aus Bargeld nachträglich als Anfangsbestand werten
function fixFillsSheet(){
  const bars = new Set(konten().filter(a=>a.kind==="bar").map(a=>a.id)), zips = new Set(umschlaege().map(a=>a.id));
  const fills = state.entries.filter(e=>e.type==="transfer" && bars.has(e.from) && zips.has(e.to)).sort((a,b)=>a.date<b.date?1:-1);
  const free = konten().filter(a=>a.kind==="bar").reduce((s,a)=>s+balance(a),0);
  const sel = new Set(); let acc = 0; for(const f of fills){ if(free+acc>=0) break; sel.add(f.id); acc += f.amount; }
  openSheet(`
    <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Bargeld korrigieren</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="hint" style="margin-top:0">Welche Befüllungen waren eigentlich Geld, das schon im Zip steckte? Die markierten werden zum Anfangsbestand des Zips. Der Zip behält seinen Stand, das Bargeld bekommt das Geld zurück.</p>
    <ul class="accs fixlist">${fills.map(f=>`<li><button class="acc" data-fx="${esc(f.id)}" aria-pressed="${sel.has(f.id)}"><span class="tick" aria-hidden="true">${svgI("check")}</span><span class="mid"><div class="t">${esc(accName(f.to))}</div><div class="s">${esc(fmtShort(f.date))} · aus ${esc(accName(f.from))}</div></span><span class="a num">${money(f.amount)}</span></button></li>`).join("") || `<li class="hint" style="padding:14px">Keine Befüllungen aus Bargeld gefunden.</li>`}</ul>
    <p class="splitrest" id="fxSum"></p>
    <div class="row"><button class="primary" id="ok">Als Anfangsbestand werten</button></div>
  `);
  const sync = () => { const sum = fills.filter(f=>sel.has(f.id)).reduce((s,f)=>s+f.amount,0); document.querySelectorAll("[data-fx]").forEach(b=>b.setAttribute("aria-pressed", String(sel.has(b.dataset.fx)))); $("#fxSum").innerHTML = `Bargeld ohne Zip danach: <b class="num ${free+sum<0?"neg":""}">${money(free+sum)}</b>`; $("#ok").disabled = !sel.size; };
  sync();
  $("#sheet").onclick = e => { const b = e.target.closest("[data-fx]"); if(!b) return; const id = b.dataset.fx; sel.has(id) ? sel.delete(id) : sel.add(id); sync(); };
  $("#cancel").onclick = () => { $("#sheet").onclick = null; closeSheet(); };
  $("#ok").onclick = async () => {
    const list = fills.filter(f=>sel.has(f.id)); $("#sheet").onclick = null; closeSheet();
    const add = {}; list.forEach(f=>{ add[f.to] = (add[f.to]||0) + f.amount; });
    for(const [zid, v] of Object.entries(add)){ const z = accById(zid); if(!z) continue; const {id, ...d} = z; await store.set("accounts", id, {...d, start:(d.start||0)+v}); }
    for(const f of list) await store.del("entries", f.id);
    toast(list.length===1 ? "1 Befüllung korrigiert" : list.length+" Befüllungen korrigiert");
  };
}

// Alle Zips auf einmal befüllen
function fillAllSheet(){
  const us = umschlaege(); const srcs = konten().filter(x=>x.kind!=="depot");
  let src = (srcs.find(x=>x.kind==="bar")||srcs[0]||{}).id;
  const hasLast = us.some(a=>a.lastFill);
  openSheet(`
    <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Zips befüllen</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    ${dp?`<div class="asub">im Depot <b class="num">${money(balance(dp))}</b>${depTxt?`<br><small>${esc(depTxt)}</small>`:""}</div>`:""}
    <div class="ahrows"><div class="label" style="margin-bottom:2px">${esc(monthName(m).split(" ")[0])} auf diesem Konto</div>${parts.length ? parts.map(([l,v,g])=>`<div><span>${l}</span><b class="num ${g==="+"?"pos":""}">${g==="±"?(v<0?"−":"+"):g}${money(Math.abs(v))}</b></div>`).join("") + `<div class="atot"><span>Zusammen</span><b class="num">${net<0?"−":"+"}${money(Math.abs(net))}</b></div>` : `<div><span>Noch nichts gebucht</span></div>`}</div></div>`;

        await save("settings","main",{...settingsData(), goneAcc:{...(state.settings.goneAcc||{}), [acc.id]:acc.name}});
        await store.del("accounts", acc.id);
        toast(`„${acc.name}“ gelöscht`);

    try { await store.del("accounts", id); toast("Gelöscht", () => save("accounts", id, data)); } catch(e){ toast("Löschen fehlgeschlagen."); }
  };
}

// ---- Daueraufträge ----
const IV = {weekly:"Wöchentlich", monthly:"Monatlich", quarterly:"Vierteljährlich", halfyearly:"Halbjährlich", yearly:"Jährlich"};
const IV_PER_MONTH = {weekly:52/12, monthly:1, quarterly:1/3, halfyearly:1/6, yearly:1/12};
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function addInterval(date, iv, day){
  const [y,m,d] = date.split("-").map(Number);
  if(iv==="weekly") return iso(new Date(y, m-1, d+7));
  const step = iv==="yearly" ? 12 : iv==="halfyearly" ? 6 : iv==="quarterly" ? 3 : 1;
  const t = new Date(y, m-1+step, 1); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(Math.min(day||d, last));
}
let recRunning = false;
// ---- Kreditkarte: Käufe laufen auf die Karte, am Abrechnungstag zieht das Referenzkonto den offenen Betrag ein ----
const ccDate = (m, day) => { const [y,mo] = m.split("-").map(Number), last = new Date(y,mo,0).getDate(); return m+"-"+pad(!day || day>last ? last : day); };
const ccNext = a => { const t = iso(new Date()); let m = t.slice(0,7); for(let i=0;i<3;i++){ const d = ccDate(m, a.cc.day); if(d >= t && (!a.cc.last || d > a.cc.last)) return d; m = shiftMonth(m,1); } return ccDate(m, a.cc.day); };
const balAt = (a, d) => (a.start||0) + state.entries.reduce((s,e)=> (e.date||"") > d ? s : e.type==="transfer" ? s + (e.to===a.id?e.amount:0) - (e.from===a.id?e.amount:0) : accOf(e)===a.id ? s + (e.type==="in"?e.amount:-e.amount) : s, 0);
// Depotwert: von Hand eingetragene Werte (acc.vals = [{d, v}]), danach Ein-/Auszahlungen obendrauf
const depVals = a => (a.vals||[]).slice().sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
const depLast = a => depVals(a).pop() || null;
const depValAt = (a, d) => { const v = depVals(a).filter(x=>x.d<=d).pop(); return v ? v.v + balAt(a, d) - balAt(a, v.d) : balAt(a, d); };
const depNow = a => { const v = depLast(a); return v ? v.v + balance(a) - balAt(a, v.d) : balance(a); };
const accVal = a => a.kind==="depot" ? depNow(a) : balance(a);
const wealthAccs = () => konten().concat(ziele(), umschlaege());
const wealthNow = () => wealthAccs().reduce((s,a)=>s+accVal(a),0);
const wealthAt = d => wealthAccs().reduce((s,a)=>s+(a.kind==="depot" ? depValAt(a,d) : balAt(a,d)),0);
// Offene Kreditkartenbeträge, die noch von einem Konto abgebucht werden
const ccOpen = fromId => state.accounts.filter(a=>a.kind==="konto" && a.cc && a.cc.from && (!fromId || a.cc.from===fromId)).map(a=>({a, open: Math.max(0, -balance(a)), d: ccNext(a)})).filter(x=>x.open>0);
// Jetzt frei verfügbares Geld: Alltagskonten (nach offener Kreditkarte) + Bargeld, das nicht in Zips steckt
// Zählt ein Konto bei „Noch verfügbar“ mit? Standard: ja, außer Tagesgeld. Pro Konto umschaltbar (acc.avail).
const inAvail = a => (a.kind==="bar" || a.kind==="konto") && !a.cc && (typeof a.avail==="boolean" ? a.avail : !a.tg);
function freeMoney(){
  const rows = konten().filter(inAvail)
    .map(a => { const cc = ccOpen(a.id).reduce((s,x)=>s+x.open,0), pk = parkedOn(a.id); return {a, v: balance(a) - cc - pk, cc, pk}; }).filter(x => x.v || x.a.kind==="bar");
  return {rows, total: rows.reduce((s,x)=>s+x.v,0)};
}
let ccRunning = false;
async function runCards(){
  if(ccRunning || !state.ready) return; ccRunning = true;
  try {
    const t = iso(new Date());
    for(const a of state.accounts.filter(x=>x.kind==="konto" && x.cc && x.cc.from)){
      if(!accById(a.cc.from)) continue;
      let m = (a.cc.last || a.cc.since || t).slice(0,7), last = a.cc.last, g = 0;
      while(g++ < 24){ const d = ccDate(m, a.cc.day); if(d > t) break;
        if(d > (a.cc.last || a.cc.since || "")){ const open = -balAt(a, d), eid = "cc-"+a.id+"-"+d;
          if(open > 0 && !state.entries.some(e=>e.id===eid)){ await store.set("entries", eid, {type:"transfer", from:a.cc.from, to:a.id, amount:open, date:d, note:"Kreditkartenabrechnung", ccBill:true, createdAt:Date.now()}); toast(`${a.name} abgerechnet: ${money(open)} von ${accName(a.cc.from)}`); }
          last = d; }
        m = shiftMonth(m,1); }
      if(last !== a.cc.last){ const {id, ...d} = accById(a.id); await store.set("accounts", id, {...d, cc:{...d.cc, last}}); }
    }
  } finally { ccRunning = false; }
}
async function runRecurring(){
  if(recRunning) return; recRunning = true;
  try {
    const today = iso(new Date()); let n = 0;
    for(const r of state.recurring){
      const ok = r.type==="transfer" ? accById(r.from) && accById(r.to) : accById(r.account);
      if(!ok || !r.amount || !r.start || r.confirm) continue;
      const first = r.next || r.start, day = Number(r.start.slice(8,10)); let next = first, guard = 0;
      while(next <= today && guard++ < 500){
        const eid = "rec-"+r.id+"-"+next;
        if(!state.entries.some(e=>e.id===eid)){
          const base = {amount:r.amount, date:next, note:r.name||"", createdAt:Date.now(), rec:r.id};
          const data = r.type==="transfer" ? {...base, type:"transfer", from:r.from, to:r.to} : {...base, type:r.type, cat:r.cat, account:r.account, ...(r.sub?{sub:r.sub}:{})};
          await store.set("entries", eid, data); n++;
        }
        next = addInterval(next, r.interval, day);
      }
      if(next !== first){ const {id, ...d} = r; await store.set("recurring", id, {...d, next}); }
    }
    if(n) toast(n===1 ? "1 Dauerauftrag eingetragen" : n+" Daueraufträge eingetragen");
  } finally { recRunning = false; }
}
const fmtShort = d => { const x = new Date(d+"T12:00"); return x.getDate()+"."+(x.getMonth()+1)+"."+(x.getFullYear()!==new Date().getFullYear()?String(x.getFullYear()).slice(2):""); };
function recRow(r){
  const c = r.type==="transfer" ? null : catById(r.cat);
  const sign = r.type==="in" ? "+" : r.type==="out" ? "−" : "";
  const where = r.type==="transfer" ? accName(r.from)+" → "+accName(r.to) : accName(r.account);

function recParts(){
  const recs = state.recurring.slice().sort((a,b)=>(a.next||a.start||"").localeCompare(b.next||b.start||""));
  const pm = t => Math.round(recs.filter(r=>t(r)).reduce((s,r)=>s+r.amount*(IV_PER_MONTH[r.interval]||1),0));
  const isInv = r => r.type==="transfer" && (accById(r.to)||{}).kind==="depot";
  return {recs, fixOut: pm(r=>r.type==="out"), fixInv: pm(isInv), fixIn: pm(r=>r.type==="in")};
}

    const tp = e.target.closest("[data-tpl]"); if(tp){ const [ic, n, o] = TPL[+tp.dataset.tpl]; d.sub = null; Object.assign(d, o); d.icon = ic;
      if(o.type==="transfer"){ const dep = konten().filter(a=>a.kind==="depot"); d.to = (dep[0]||{}).id || null; d.from = (konten().find(a=>a.kind==="konto")||{}).id || k0; }
      $("#rName").value = n==="Investment" ? "Sparplan" : n; document.querySelectorAll("#rTpl [data-tpl]").forEach(b=>b.setAttribute("aria-pressed", String(b===tp))); sync(); $("#rAmount").focus(); return; }
  };
  $("#cancel").onclick = () => { $("#sheet").onclick = null; closeSheet(); };
  $("#ok").onclick = async () => {
    const start = $("#rStart").value;
    const data = {type:d.type, amount:parseAmount($("#rAmount").value), name:$("#rName").value.trim(), interval:d.interval, start, ...(d.icon?{icon:d.icon}:{}),
      next: rec && rec.start===start && rec.interval===d.interval ? (rec.next||start) : (rec ? (start > iso(new Date()) ? start : nextAfterToday(start, d.interval)) : start)};
    if(d.type==="transfer"){ data.from = d.from; data.to = d.to; } else { data.cat = d.cat; data.account = d.account; if(d.type==="out" && d.sub) data.sub = d.sub; }
    if(d.type==="in" && d.confirm){ data.confirm = true; if(rec && !rec.confirm) data.next = rec.next || start; }
    $("#sheet").onclick = null; closeSheet();
    await store.set("recurring", rec ? rec.id : newId(), data);
    toast(rec ? "Dauerauftrag gespeichert" : "Dauerauftrag angelegt");
    await runRecurring();
  };
  if(rec) $("#del").onclick = async () => { const {id, ...data} = rec; $("#sheet").onclick = null; closeSheet(); await store.del("recurring", id); toast("Dauerauftrag gelöscht", () => store.set("recurring", id, data)); };
}
// Beim Bearbeiten: nichts rückwirkend doppelt buchen, nächster Termin nach heute
function nextAfterToday(start, iv){ const today = iso(new Date()), day = Number(start.slice(8,10)); let n = start, g = 0; while(n <= today && g++ < 1000) n = addInterval(n, iv, day); return n; }

const checkAccs = () => konten().filter(a=>a.kind!=="depot").concat(umschlaege());
function checkSheet(){
  const accs = checkAccs();
  openSheet(`
    <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Abgleich</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <div class="chk">${accs.map(a=>`<div class="chkrow"><span class="n">${a.kind==="umschlag"?"✉ ":""}${esc(a.name)}</span><span class="app">In der App: ${money(balance(a))}</span>
      <input class="input num" data-chk="${esc(a.id)}" inputmode="decimal" placeholder="${esc(toSigned(balance(a))||"0")}" autocomplete="off" aria-label="Echter Stand ${esc(a.name)}">
      <p class="df" data-df="${esc(a.id)}"></p></div>`).join("")}</div>
    <div class="row"><button class="primary" id="ok">Alles stimmt</button></div>
  `);
  const diffs = () => accs.map(a => { const inp = document.querySelector(`[data-chk="${a.id}"]`); const v = inp.value.trim(); const real = v ? parseSigned(v) : NaN; return {a, d: isNaN(real) ? 0 : real - balance(a), bad: !!v && isNaN(real)}; });
  const sync = () => {
    const ds = diffs(); let n = 0;
    for(const {a,d,bad} of ds){
      const el = document.querySelector(`[data-df="${a.id}"]`);
      el.textContent = bad ? "Bitte eine Zahl eingeben" : d ? `Differenz ${d>0?"+":"−"}${money(Math.abs(d))}` : "";
      el.style.color = bad||d<0 ? "var(--danger)" : "var(--ink)";
      if(d) n++;
    }
    $("#ok").textContent = n ? `${n} Korrektur${n>1?"en":""} buchen` : "Alles stimmt";
    $("#ok").disabled = ds.some(x=>x.bad);
  };
  document.querySelectorAll("[data-chk]").forEach(i => i.oninput = sync);
  $("#cancel").onclick = closeSheet;
  $("#ok").onclick = async () => {
    const ds = diffs().filter(x=>x.d); const today = iso(new Date()); const now = Date.now();
    closeSheet();
    try {
      for(const {a,d} of ds) await save("entries", newId(), {type: d>0?"in":"out", cat:"korrektur", amount: Math.abs(d), account:a.id, date:today, note:"", createdAt:now});
      try { localStorage.setItem("hhb.lastCheck", curMonth()); localStorage.removeItem("hhb.checkSnooze"); } catch(_){}
      toast(ds.length ? `${ds.length} Korrektur${ds.length>1?"en":""} gebucht` : "Super, alles stimmt"); render();
    } catch(e){}
  };
}

function reminderHtml(){ return payHtml() + resetUndoHtml() + checkHtml() + backupHtml(); }
function backupHtml(){
  if(!state.entries.length) return "";
  const now = Date.now();
  if(+(lsGet("hhb.snooze")||0) > now) return "";
  const last = +(lsGet("hhb.lastBackup")||0);
  const since = last || Math.min(...state.entries.map(e => e.createdAt||now));
  const days = Math.floor((now - since)/DAY);
  if(days < REMIND_DAYS) return "";
  const msg = last ? `Letzte Sicherung vor ${days} Tagen.` : `Du hast deine Einträge noch nie gesichert.`;
  return `<div class="remind" role="status"><span>${msg} Speichere jetzt eine Kopie in iCloud Drive.</span><button class="later" id="snooze">Später</button><button class="go" id="backupNow">Jetzt sichern</button></div>`;
}

async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  const file = new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return true; } catch(e){ if(e && e.name==="AbortError") return false; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000); return true;
}

const DEFAULT_ACCS = () => ({giro:{name:"Girokonto", kind:"konto", start:0, order:0}, bargeld:{name:"Bargeld", kind:"bar", start:0, order:1}});
const asMap = x => Array.isArray(x) ? Object.fromEntries(x.filter(e=>e&&e.id).map(({id,...r})=>[id,r])) : (x && typeof x==="object" ? x : {});
// Sicherung einlesen (auch ältere Versionen: ohne Konten, Einträge ohne Konto = Girokonto)
function parseBackup(text){
  const d = JSON.parse(text);
  if(!d || d.app!=="haushaltsbuch" || typeof d.entries!=="object") throw 0;
  const entries = asMap(d.entries), accounts = asMap(d.accounts);
  let settings = d.settings && typeof d.settings==="object" ? d.settings : null;
  if(settings && !settings.main && "budget" in settings) settings = {main: settings};
  return {entries, accounts, settings, recurring: asMap(d.recurring), places: d.places && typeof d.places==="object" ? d.places : null, at: d.exportedAt};
}
function fixAccounts(accs, entries){
  if(!Object.keys(accs).length) accs = DEFAULT_ACCS();
  for(const e of Object.values(entries)){
    const ids = e.type==="transfer" ? [e.from, e.to] : [e.account || "giro"];
    for(const id of ids) if(id && !accs[id]) accs[id] = id==="giro" ? DEFAULT_ACCS().giro : id==="bargeld" ? DEFAULT_ACCS().bargeld : {name:"Konto aus Sicherung", kind:"konto", start:0, order:Date.now()};
  }
  return accs;
}
