const b64 = buf => { const a = new Uint8Array(buf); let t = ""; for(let i=0;i<a.length;i+=0x8000) t += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const hasCrypto = () => !!(window.crypto && crypto.subtle);
const lockCfg = () => { try { const o = JSON.parse(localStorage.getItem("hhb.lock")||"null"); return o && o.hash ? o : null; } catch(e){ return null; } };
const setLockCfg = o => { try { o ? localStorage.setItem("hhb.lock", JSON.stringify(o)) : localStorage.removeItem("hhb.lock"); } catch(e){} };
async function pinHash(pin, salt, iter){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, k, 256));
}
async function aesKey(pw, salt, iter){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptText(text, pw){
  const salt = rnd(16), iv = rnd(12), iter = 310000;
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await aesKey(pw, salt, iter), new TextEncoder().encode(text));
  return JSON.stringify({app:"haushaltsbuch", enc:1, alg:"AES-256-GCM", kdf:"PBKDF2-SHA256", iter, salt:b64(salt), iv:b64(iv), data:b64(ct)});
}
async function decryptText(j, pw){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(j.iv)}, await aesKey(pw, unb64(j.salt), j.iter||310000), unb64(j.data));
  return new TextDecoder().decode(pt);
}
// Face ID / Touch ID über die Geräte-Entsperrung (WebAuthn, Schlüssel bleibt im iPhone)
const bioAvail = async () => { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } };
async function bioRegister(){
  const c = await navigator.credentials.create({publicKey:{rp:{name:"Spent"}, user:{id:rnd(16), name:"Spent", displayName:"Spent"}, challenge:rnd(32),
    pubKeyCredParams:[{type:"public-key", alg:-7},{type:"public-key", alg:-257}], authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"discouraged"}, timeout:60000, attestation:"none"}});
  return b64(c.rawId);
}
async function bioCheck(id){
  const c = await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:"public-key", id:unb64(id), transports:["internal"]}], userVerification:"required", timeout:60000}});
  return !!c;
}

// Ziffernfeld (Sperre, Code festlegen, Code prüfen)
function pinPad(o){
  const el = document.createElement("div"); el.className = "lock"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  let pin = "", len = o.len || 4, busy = false;
  el.innerHTML = `<div class="lock-in"><div class="lock-ic">${ICON.lock}</div><h2 class="lock-t"></h2><p class="lock-s"></p>
    <div class="lock-dots" aria-hidden="true"></div><p class="lock-err" role="alert"></p>
    <div class="lock-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="lk" data-k="${n}">${n}</button>`).join("")}${o.bio?`<button class="lk lk-x" data-bio aria-label="Mit Face ID entsperren">${ICON.face}</button>`:"<span></span>"}<button class="lk" data-k="0">0</button><button class="lk lk-x" data-del aria-label="Ziffer löschen">${ICON.del}</button></div>
    <div class="lock-foot">${o.foot||""}</div></div>`;
  const q = sel => el.querySelector(sel);
  const draw = () => { q(".lock-dots").innerHTML = Array.from({length:len}, (_,i)=>`<i class="${i<pin.length?"on":""}"></i>`).join(""); };
  const api = { el,
    set(t, sub){ q(".lock-t").textContent = t; q(".lock-s").textContent = sub||""; el.setAttribute("aria-label", t); },
    err(m){ q(".lock-err").textContent = m||""; if(m){ const d = q(".lock-dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); } },
    reset(){ pin = ""; draw(); }, setLen(n){ len = n; pin = ""; draw(); },
    close(){ document.removeEventListener("keydown", onKey); el.classList.add("out"); setTimeout(()=>el.remove(), 220); } };
  const press = async k => {
    if(busy) return;
    if(k==="del"){ pin = pin.slice(0,-1); draw(); return; }
    if(pin.length>=len) return;
    pin += k; draw(); if(pin.length===1) api.err("");
    if(pin.length===len){ busy = true; const p = pin; await new Promise(r=>setTimeout(r,140)); try { await o.onDone(p, api); } catch(e){ api.reset(); api.err("Das hat nicht geklappt. Versuch es nochmal."); } busy = false; }
  };
  el.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.k!=null) press(b.dataset.k); else if(b.hasAttribute("data-del")) press("del"); else if(b.hasAttribute("data-bio")) o.bio(api, false); else if(o.onFoot) o.onFoot(b, api); });
  el.addEventListener("autobio", () => o.bio && o.bio(api, true), true);
  const onKey = e => { if(el !== document.querySelector(".lock:last-of-type")) return; if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); };
  document.addEventListener("keydown", onKey);
  api.set(o.title, o.sub); draw(); document.body.appendChild(el);
  return api;
}
const failInfo = () => { try { return JSON.parse(localStorage.getItem("hhb.lockFail")) || {n:0, until:0}; } catch(e){ return {n:0, until:0}; } };
const setFail = o => { try { localStorage.setItem("hhb.lockFail", JSON.stringify(o)); } catch(e){} };
// Prüft den Code. Nach 5 Fehlversuchen wächst die Wartezeit (30 s, 1 min, 2 min … bis 15 min).
async function checkPin(pin, api){
  const cfg = lockCfg(); if(!cfg) return true;
  const f = failInfo();
  if(f.until > Date.now()){ api.reset(); api.err(`Zu viele Versuche. Warte noch ${Math.ceil((f.until-Date.now())/1000)} Sekunden.`); return false; }
  if(await pinHash(pin, unb64(cfg.salt), cfg.iter) === cfg.hash){ setFail({n:0, until:0}); return true; }
  f.n++; if(f.n>=5) f.until = Date.now() + Math.min(900, 30*2**(f.n-5))*1000; setFail(f);
  api.reset(); api.err(f.n>=5 ? `Falscher Code. Warte ${Math.round((f.until-Date.now())/1000)} Sekunden.` : `Falscher Code${f.n>=3?` (noch ${5-f.n} Versuche, dann Wartezeit)`:""}`);
  return false;
}
let lockApi = null, hiddenAt = 0, wasOpen = false;
function unlockNow(){ if(!lockApi) return; lockApi.close(); lockApi = null; document.documentElement.classList.remove("locked"); }
function showLock(){
  const cfg = lockCfg(); if(!cfg || lockApi) return;
  document.documentElement.classList.add("locked");
  const bio = cfg.bio ? async (api, auto) => { try { if(await bioCheck(cfg.bio)){ setFail({n:0, until:0}); unlockNow(); } } catch(e){ if(!auto) api.err("Face ID hat nicht geklappt. Gib deinen Code ein."); } } : null;
  lockApi = pinPad({title:"Spent", sub:"Code eingeben", len:cfg.len||4, bio,
    foot:`<button class="linkbtn" data-forgot>Code vergessen?</button>`,
    onFoot:(b, api) => { if(b.hasAttribute("data-forgot")) forgotPin(api); },
    onDone: async (pin, api) => { if(await checkPin(pin, api)) unlockNow(); } });
  if(bio && document.visibilityState==="visible") setTimeout(()=>{ if(lockApi) bio(lockApi, true); }, 400);
}
function forgotPin(api){
  const f = api.el.querySelector(".lock-foot");
  f.innerHTML = `<p class="hint">Den Code kann niemand zurückholen. Du kannst nur alle Daten auf diesem Gerät löschen und danach deine Sicherung wieder laden.</p><button class="linkbtn wipe" data-wipe>Alles löschen und neu starten</button><button class="linkbtn" data-back>Doch nicht</button>`;
  f.querySelector("[data-back]").onclick = () => { f.innerHTML = `<button class="linkbtn" data-forgot>Code vergessen?</button>`; };
  f.querySelector("[data-wipe]").onclick = e => { const b = e.currentTarget; if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "Wirklich alles löschen? Nochmal tippen"; return; }
    SAFE.save("vor-loeschen", true).finally(() => { try { Object.keys(localStorage).filter(k=>k.startsWith("hhb.")).forEach(k=>localStorage.removeItem(k)); sessionStorage.setItem("hhb.importMsg", "Alles gelöscht. Deine letzte Kopie findest du beim Start."); } catch(_){} location.reload(); }); };
}
function setupPin(done){
  let first = null, len = 4;
  const sub = () => `Wähle einen Code mit ${len} Ziffern`;
  pinPad({title:"Code festlegen", sub:sub(), len,
    foot:`<button class="linkbtn" data-len>6-stelligen Code verwenden</button><button class="linkbtn" data-cancel>Abbrechen</button>`,
    onFoot:(b, api) => {
      if(b.hasAttribute("data-cancel")){ api.close(); done(null); }
      if(b.hasAttribute("data-len")){ len = len===4 ? 6 : 4; first = null; api.setLen(len); api.set("Code festlegen", sub()); api.err(""); b.textContent = `${len===4?6:4}-stelligen Code verwenden`; }
    },
    onDone: async (pin, api) => {
      if(first===null){ first = pin; api.reset(); api.set("Code wiederholen", "Gib den Code zur Sicherheit noch einmal ein"); return; }
      if(pin!==first){ first = null; api.reset(); api.set("Code festlegen", sub()); api.err("Die Codes waren nicht gleich. Nochmal von vorn."); return; }
      const salt = rnd(16), iter = 210000, hash = await pinHash(pin, salt, iter);
      api.close(); done({hash, salt:b64(salt), iter, len});
    }});
}
function verifyPin(title, done){
  const cfg = lockCfg(); if(!cfg){ done(true); return; }
  pinPad({title, sub:"Gib deinen aktuellen Code ein", len:cfg.len||4, foot:`<button class="linkbtn" data-cancel>Abbrechen</button>`,
    onFoot:(b, api) => { if(b.hasAttribute("data-cancel")){ api.close(); done(false); } },
    onDone: async (pin, api) => { if(await checkPin(pin, api)){ api.close(); done(true); } } });
}
// Beim Wechsel in eine andere App sofort abdecken (auch im App-Umschalter), beim Zurückkommen je nach Einstellung entsperrt lassen
document.addEventListener("visibilitychange", () => {
  const cfg = lockCfg(); if(!cfg) return;
  if(document.hidden){ wasOpen = !lockApi; hiddenAt = Date.now(); showLock(); }
  else if(lockApi){
    if(wasOpen && Date.now()-hiddenAt < (cfg.after ?? 60)*1000) unlockNow();
    else if(cfg.bio) setTimeout(()=>{ const b = lockApi && lockApi.el.querySelector("[data-bio]"); if(b) b.dispatchEvent(new CustomEvent("autobio")); }, 300);
  }
});

function bindSecurity(){
  const reopen = () => { const sc = $("#sheet").scrollTop; budgetSheet(); $("#sheet").scrollTop = sc; };
  $("#tLock").onclick = () => {
    if(lockCfg()) verifyPin("Sperre ausschalten", ok => { if(ok){ setLockCfg(null); toast("App-Sperre ist aus"); reopen(); } });
    else setupPin(c => { if(c){ setLockCfg({...c, after:60}); toast("App-Sperre ist an"); reopen(); } });
  };
  $("#tHide").onclick = () => { setHide(!HIDE); reopen(); };
  if(!lockCfg()) return;
  bioAvail().then(ok => { const r = $("#bioRow"); if(ok && r) r.hidden = false; });
  $("#tBio").onclick = async () => {
    const cfg = lockCfg();
    if(cfg.bio){ setLockCfg({...cfg, bio:null}); reopen(); return; }
    try { const id = await bioRegister(); setLockCfg({...lockCfg(), bio:id}); toast("Face ID ist an"); } catch(e){ toast("Face ID konnte nicht eingerichtet werden."); }
    reopen();
  };
  $("#lockAfter").onclick = e => { const b = e.target.closest("[data-after]"); if(!b) return; setLockCfg({...lockCfg(), after:+b.dataset.after}); document.querySelectorAll("#lockAfter [data-after]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); };
  $("#pinChange").onclick = () => verifyPin("Code ändern", ok => ok && setupPin(c => { if(c){ setLockCfg({...lockCfg(), ...c}); toast("Neuer Code gespeichert"); } }));
}

$("#prev").onclick = () => { state.accF = null; state.navMoved = true; state.month = shiftMonth(state.month,-1); state.cat=null; render(); };
$("#next").onclick = () => { if(state.month<shiftMonth(curPeriod(),12)){ state.accF = null; state.navMoved = true; state.month = shiftMonth(state.month,1); state.cat=null; render(); } };
$("#settings").onclick = budgetSheet;
$("#eye").onclick = () => { setHide(!HIDE); toast(HIDE ? "Beträge verborgen" : "Beträge sichtbar"); };
drawEye();
$("#fab").onclick = () => entrySheet(null);
$("#scrim").onclick = closeSheet;
// Nach unten wischen schließt das Fenster
(() => { const s = $("#sheet"); let y0 = null, dy = 0, t0 = 0, head = false;
  s.addEventListener("touchstart", e => { head = !!e.target.closest(".grab,.sheet-head"); if((!head && s.scrollTop > 2) || e.touches.length>1 || e.target.closest("input,textarea,select,.chips,.hist,.theme,.splits,.xbtn")){ y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); }, {passive:true});
  s.addEventListener("touchmove", e => { if(y0===null) return; dy = e.touches[0].clientY - y0; if(dy > 0 && (head || s.scrollTop <= 0)){ s.style.transition = "none"; s.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  s.addEventListener("touchend", () => { if(y0===null) return; const fast = dy > 60 && Date.now()-t0 < 250; y0 = null;
    if(dy > 120 || fast){ s.style.transition = "transform .22s cubic-bezier(.3,.7,.3,1)"; s.style.transform = "translateY(105%)"; $("#scrim").classList.add("closing"); clearTimeout(sheetT); sheetT = setTimeout(closeSheetNow, 220); }
    else { s.style.transition = "transform .28s cubic-bezier(.2,.9,.3,1.15)"; s.style.transform = ""; } dy = 0; });
})();
// Haptik bei wichtigen Tipps
document.addEventListener("click", e => { const t = e.target.closest && e.target.closest("button,[role=switch]"); if(!t || t.disabled) return;
  if(t.matches("#del,.danger#resetAll,[data-dvdel],.csx")) HAPTIC.fire("warn");
  else if(t.matches(".primary,.ob-next")) HAPTIC.fire("success");
  else if(t.matches("#fab,.tabbar button,.switch,.seg button,.mini button,.qacts button,[data-zact],.acts button,.xbtn,.chip,.ob-opt,[data-obtheme],[data-theme-pick],.lk")) HAPTIC.fire("light");
}, true);
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ runCards(); if(!state.navMoved) state.month = curPeriod(); runRecurring(); render(); } });

boot();
try { const m = sessionStorage.getItem("hhb.importMsg"); if(m){ sessionStorage.removeItem("hhb.importMsg"); toast(m); } } catch(e){}
})();
</script>

</body>
</html>
