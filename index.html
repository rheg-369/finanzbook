<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haushaltsbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushaltsbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one-column phone app. Sticky month switcher, month summary + budget, category bars, entries by day, floating add button, bottom sheet editor */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#191f1b; --muted:#646d66; --line:#e2e5df;
  --accent:#2f6b4f; --accent-soft:#e2eee7; --danger:#b3412e; --warn:#9a5f0c; --chip:#eceee9; --track:#e8ebe6;
  --shadow:0 10px 30px rgba(20,40,30,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#8a918c;
  --f-display:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:16px}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.ptitle{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;min-width:9.5ch;text-align:center}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
.icon:disabled{opacity:.35}

.hero{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.big .cents{font-size:.55em;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.trio div{min-width:0}
.trio .v{font-weight:600;margin-top:2px;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)} .neg{color:var(--danger)}
.budget{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--danger)}
.bline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.bline b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.88rem;align-self:flex-start}

section{margin-top:22px}
section > h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px 2px;display:flex;justify-content:space-between}
.cats{background:var(--surface);border-radius:16px;padding:6px 0;list-style:none;margin:0}
.cat{width:100%;border:0;background:none;text-align:left;padding:9px 16px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat .name{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0}
.cat .amt{font-weight:600;font-size:.95rem}
.cat .amt small{color:var(--muted);font-weight:400;margin-left:6px}
.cat .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--track)}
.cat .track i{display:block;height:100%;border-radius:4px;min-width:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.filter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0 0 8px 2px}
.filter button{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8rem}

.day{margin-top:14px}
.day h3{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:500;margin:0 0 6px 2px}
.entries{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.entry{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.entries li:last-child .entry{border-bottom:0}
.badge{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.entry .mid{flex:1;min-width:0}
.entry .t{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);margin-bottom:6px}
.status{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:94%;overflow-y:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{font-family:var(--f-display);font-size:1.15rem;margin:0}
.xbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center;padding:0}
.xbtn svg{width:16px;height:16px}
.sheet-head h3{text-align:center;flex:1;min-width:0}
.txt{border:0;background:none;padding:0;color:var(--muted);font-weight:500;min-width:80px;text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0}
.amount input{border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:3rem;text-align:right;width:6.5ch;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount span{font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip input[type=date]{border:0;background:none;padding:0;font-size:.88rem;width:8.5em;min-width:0}
.row{display:flex;gap:10px}
.primary{flex:1;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--bg);font-weight:600;font-size:1rem}
.primary:disabled{opacity:.45}
.danger{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:none;color:var(--danger);font-weight:600}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.remind{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.9rem}
.remind span{flex:1 1 180px}
.remind button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.remind .go{background:var(--accent);color:var(--bg)}
.remind .later{background:none;color:var(--muted)}
.accs{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.acc{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.accs li:last-child .acc{border-bottom:0}
.acc .mid{flex:1;min-width:0}
.acc .t{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.acc .a{font-weight:600;white-space:nowrap}
.goal{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goals{display:flex;flex-direction:column;gap:10px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .name{border:0;background:none;padding:0;font-weight:600;font-size:1rem;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .of{font-size:.88rem;color:var(--muted);white-space:nowrap}
.goal .of b{color:var(--ink)}
.goal .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.goal .put{border:0;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addbtn{flex:1 1 40%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:11px;color:var(--muted);font-weight:500;font-size:.92rem}
.seg3{grid-template-columns:1fr 1fr 1fr}
.sublabel{font-size:.82rem;color:var(--muted);margin:-4px 0 0}
.warnmsg{font-size:.85rem;color:var(--danger);margin:0}
.splits{display:flex;flex-direction:column;gap:8px}
.splitrow{display:grid;grid-template-columns:1fr 7.5em;gap:10px;align-items:center}
.splitrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splitrow input{text-align:right;padding:10px 12px}
.splitrest{font-size:.88rem;margin:8px 0 0;color:var(--muted)}
.splitrest b{color:var(--ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip .x{margin-left:2px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--surface);display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;line-height:1}
.newacc{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.inv{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.inv .yr{display:flex;align-items:center;justify-content:space-between}
.inv .yr button{border:0;background:var(--chip);border-radius:10px;width:36px;height:32px;font-weight:700;color:var(--ink)}
.inv .yr button:disabled{opacity:.3}
.inv .yr b{font-family:var(--f-display);font-size:1.05rem}
.inv .tot{text-align:center}
.inv .tot .v{font-family:var(--f-display);font-weight:700;font-size:2rem}
.inv .parts{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.inv .parts div{display:flex;justify-content:space-between;gap:10px}
.inv .parts span{color:var(--muted)}
.inv .months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:70px}
.inv .months i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.inv .months i.z{background:var(--line)}
.inv .mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:.62rem;color:var(--muted);text-align:center;margin-top:-8px}
.chk{display:flex;flex-direction:column;gap:10px}
.chkrow{display:grid;grid-template-columns:1fr 8em;gap:4px 10px;align-items:center}
.chkrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chkrow .app{grid-column:1;font-size:.8rem;color:var(--muted)}
.chkrow input{grid-row:1/span 2;grid-column:2;text-align:right;padding:10px 12px}
.chkrow .df{grid-column:1/-1;font-size:.82rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:30;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;padding:0}

/* ---- Design 2.3: iOS-Look ---- */
:root{--card-shadow:0 1px 2px rgba(20,40,30,.05),0 6px 18px rgba(20,40,30,.06);--hero1:#2f7354;--hero2:#1d4a36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card-shadow:none;--hero1:#2a6449;--hero2:#163628}}
:root[data-theme="dark"]{--card-shadow:none;--hero1:#2a6449;--hero2:#163628}
.wrap{padding-block:0 170px}
header{padding-block:10px 8px}
.ptitle,.month h1{font-size:1.7rem;letter-spacing:-.01em}
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(29,74,54,.28)}
.hero .label{color:rgba(255,255,255,.72)}
.hero .big .cents{color:rgba(255,255,255,.7)}
.hero .trio{border-top-color:rgba(255,255,255,.18)}
.hero .pos{color:#b8f0cf} .hero .neg{color:#ffc4b8}
.hero .bar{background:rgba(255,255,255,.2)} .hero .bar i{background:#fff} .hero .bar i.warn{background:#ffd27a} .hero .bar i.over{background:#ff9d8a}
.hero .bline{color:rgba(255,255,255,.75)} .hero .bline b{color:#fff}
.hero .linkbtn{color:#fff;text-decoration:underline;text-underline-offset:3px}
.hero .hint{color:rgba(255,255,255,.78)}
section{margin-top:26px}
section > h2{font-family:var(--f-display);font-size:1.15rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700;margin:0 0 10px 4px;align-items:center}
section > h2 .num{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:500}
.cats,.entries,.accs,.goal,.inv,.pie{border-radius:20px;box-shadow:var(--card-shadow)}
.goal .bar{height:8px}
.day h3{font-size:.82rem;font-weight:600;margin:0 0 8px 6px}
.badge{width:40px;height:40px;border-radius:13px;font-size:1.2rem;color:var(--ink);background:var(--chip)}
.entry{padding:12px 14px;gap:13px}
.entry .t{font-weight:500}
.addbtn{border:0;background:var(--surface);box-shadow:var(--card-shadow);color:var(--accent);font-weight:600;border-radius:14px;padding:12px}
.remind{border-radius:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px));background:var(--surface);background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:140px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;color:var(--muted);font-size:.68rem;font-weight:600}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-pressed="true"]{color:var(--accent)}
.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;box-shadow:0 8px 22px rgba(29,74,54,.35)}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.sheet{border-radius:24px 24px 0 0}
.pie{background:var(--surface);padding:16px 0 6px}
.pie .donut{display:block;width:170px;height:170px;margin:0 auto 6px}
.pie .donut circle{transition:opacity .2s}
.pie .ctr{font-family:var(--f-display);font-weight:700}
.pie .cats{box-shadow:none;border-radius:0;padding:0}
.mini{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px}
.mini button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.recs .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-in{font-size:16px}
@media (prefers-reduced-motion:reduce){.pie .donut circle{transition:none}}

/* ---- Zips 2.4 ---- */
.hero .acts{display:flex;gap:8px}
.hero .acts button{flex:1;border:0;border-radius:14px;padding:12px 8px;font-weight:700;font-size:.92rem;background:rgba(255,255,255,.16);color:#fff}
.hero .acts button.main{background:#fff;color:var(--hero2)}
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zcard{background:var(--surface);border-radius:22px;box-shadow:var(--card-shadow);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-width:0}
.zcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--zc)}
.zcard .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.zcard .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;background:var(--chip);background:color-mix(in srgb,var(--zc) 18%,var(--surface))}
.zcard .zn{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcard .zb{font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;white-space:nowrap}
.zcard .zt{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcard .zbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.zcard .zbar i{display:block;height:100%;background:var(--zc);border-radius:3px}
.zcard .zm{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcard .zact{display:flex;gap:6px;margin-top:2px}
.zcard .zact button{white-space:nowrap;flex:1;border:0;border-radius:10px;padding:8px 4px;font-size:.8rem;font-weight:700;background:var(--chip);color:var(--ink)}
.zcard .zact button.fill{background:color-mix(in srgb,var(--zc) 20%,var(--surface));background:var(--chip)}
.zcard.addz{align-items:center;justify-content:center;border:2px dashed var(--line);box-shadow:none;background:none;color:var(--muted);font-weight:600;min-height:150px}
.zcard.addz::before{display:none}
.zhead{display:flex;align-items:center;gap:12px}
.zhead .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:var(--chip);background:color-mix(in srgb,var(--zc) 18%,var(--surface))}
.zhead .zb{font-family:var(--f-display);font-weight:700;font-size:1.8rem}
.zacts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.zacts button{border:0;border-radius:12px;padding:10px 2px;background:var(--chip);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.zacts button span{font-size:1.2rem}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:90px}
.hist .col{display:flex;gap:2px;align-items:flex-end;height:100%;justify-content:center}
.hist i{display:block;width:40%;border-radius:3px 3px 0 0}
.hist i.in{background:var(--accent)} .hist i.out{background:var(--danger)}
.hlab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:.7rem;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:340px){.zgrid{grid-template-columns:1fr}}
/* Rosa Dunkel */
:root[data-theme="pink"]{
  --bg:#1a1016; --surface:#26171f; --ink:#fbe9f1; --muted:#c29aae; --line:#3d2633;
  --accent:#ff8fc0; --accent-soft:#4a2338; --danger:#ff8a7a; --warn:#f2b45c; --chip:#33202b; --track:#3a2531;
  --shadow:0 10px 30px rgba(0,0,0,.55); --card-shadow:none; --hero1:#c2457f; --hero2:#6e1f48;
  --c1:#6fa8ff; --c2:#ff8a5c; --c3:#3fd1a0; --c4:#ffc24d; --c5:#ff9ed0; --c6:#7fdc6a; --c7:#b49cff; --c8:#ff7b8f; --c9:#a8909c;
  color-scheme:dark }
:root[data-theme="pink"] .hero{box-shadow:0 10px 28px rgba(194,69,127,.35)}
:root[data-theme="pink"] .fab{box-shadow:0 8px 22px rgba(255,143,192,.35)}
:root[data-theme="pink"] .hero .pos{color:#ffd1e6}
.theme{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.theme button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px}
.theme button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.theme i{width:26px;height:26px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="hrow">
    <div class="month" id="monthNav">
      <button class="icon" id="prev" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="monthTitle">November</h1>
      <button class="icon" id="next" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <h1 class="ptitle" id="pageTitle" hidden>Konten</h1>
    <button class="icon" id="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <div class="status" id="status" hidden></div>
</div>

<nav class="tabbar" id="tabs" aria-label="Bereiche">
  <button data-tab="sips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>Zips</button>
  <button data-tab="monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Übersicht</button>
  <button data-tab="konten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/></svg>Konten</button>
</nav>
<button class="fab" id="fab" aria-label="Neue Ausgabe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const THEMES = {auto:{n:"Auto", sw:"linear-gradient(135deg,#f4f5f2 50%,#111513 50%)"}, light:{n:"Hell", sw:"#f4f5f2"}, dark:{n:"Dunkel", sw:"#111513"}, pink:{n:"Rosa", sw:"linear-gradient(135deg,#c2457f,#1a1016)"}};
function applyTheme(t){
  if(!THEMES[t]) t = "auto";
  if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t==="dark" || t==="pink" || (t==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t==="pink" ? "#1a1016" : dark ? "#111513" : "#f4f5f2");
}
try { applyTheme(localStorage.getItem("hhb.theme")||"auto"); } catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Categories: fixed order = fixed color slot (never re-colored by rank)
const OUT_CATS = [
  {id:"lebensmittel", i:"🛒", name:"Lebensmittel", c:"--c1"},
  {id:"wohnen", i:"🏠", name:"Wohnen & Nebenkosten", c:"--c2"},
  {id:"mobilitaet", i:"🚗", name:"Mobilität", c:"--c3"},
  {id:"restaurant", i:"🍽️", name:"Restaurant & Café", c:"--c4"},
  {id:"freizeit", i:"🎉", name:"Freizeit", c:"--c5"},
  {id:"gesundheit", i:"💊", name:"Gesundheit", c:"--c6"},
  {id:"shopping", i:"🛍️", name:"Shopping", c:"--c7"},
  {id:"abos", i:"📺", name:"Abos & Verträge", c:"--c8"},
  {id:"sonstiges", i:"📦", name:"Sonstiges", c:"--c9"},
];
const IN_CATS = [
  {id:"gehalt", i:"💼", name:"Gehalt", c:"--accent"},
  {id:"taschengeld", i:"💶", name:"Taschengeld", c:"--accent"},
  {id:"trinkgeld", i:"🪙", name:"Trinkgeld", c:"--accent"},
  {id:"geschenk", i:"🎁", name:"Geschenk", c:"--accent"},
  {id:"verkauf", i:"🏷️", name:"Verkauf", c:"--accent"},
  {id:"saveback", i:"🔁", name:"Saveback", c:"--accent"},
  {id:"einnahme-sonst", i:"💰", name:"Sonstige Einnahme", c:"--accent"},
];
// Vordefinierte Orte, gruppiert nach der Kategorie, die beim Auswählen vorgeschlagen wird
const PLACES = {
  lebensmittel: ["REWE","EDEKA","Lidl","Aldi Süd","Aldi Nord","Kaufland","Penny","Netto","Norma","Bäckerei","Metzgerei","Wochenmarkt"],
  restaurant: ["Restaurant","Café","Imbiss","Lieferando","McDonald's","Burger King","Starbucks","Bar"],
  mobilitaet: ["Tankstelle","Aral","Shell","Deutsche Bahn","ÖPNV-Ticket","Parken","Taxi / Uber","Werkstatt"],
  shopping: ["Amazon","dm","Rossmann","Müller","IKEA","MediaMarkt / Saturn","Decathlon","Otto"],
  mode: ["Zara","Reserved","Uniqlo","H&M","Primark","Adidas","Nike","Zalando","About You","Snipes","Bershka","Pull&Bear","New Yorker","TK Maxx","C&A"],
  freizeit: ["Kino","Fitnessstudio","Konzert / Event","Urlaub / Reise","Geschenk"],
  gesundheit: ["Apotheke","Arzt","Optiker","Friseur"],
  wohnen: ["Miete","Strom","Gas / Heizung","Rundfunkbeitrag"],
  abos: ["Netflix","Spotify","Disney+","Amazon Prime","Handyvertrag","Internet","Versicherung"],
};
const placeCat = p => { for(const [c, list] of Object.entries(PLACES)) if(list.includes(p)) return c==="mode" ? "shopping" : c; return null; };
const PRESET = new Set(Object.values(PLACES).flat());
function recentPlaces(){
  const seen = new Map();
  state.entries.filter(e => e.place && !PRESET.has(e.place)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(e => { if(!seen.has(e.place)) seen.set(e.place, true); });
  return [...seen.keys()].slice(0,12);
}
const KORR = {id:"korrektur", i:"±", name:"Korrektur", c:"--muted"};
const isKorr = e => e.cat==="korrektur";
const tint = v => `background:var(--chip);background:color-mix(in srgb, var(${v}) 17%, var(--surface))`;
const catById = id => OUT_CATS.concat(IN_CATS, [KORR]).find(c => c.id===id) || OUT_CATS[OUT_CATS.length-1];

// ---- money & dates ----
const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const money = cents => eur.format((cents||0)/100);
function parseAmount(s){
  s = String(s||"").trim().replace(/\s|€/g,"");
  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isFinite(n) && n>0 ? Math.round(n*100) : 0;
}
const toInput = cents => cents ? (cents/100).toFixed(2).replace(".",",").replace(/,00$/,"") : "";
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dayOffset = n => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d); };
const curMonth = () => iso(new Date()).slice(0,7);
function shiftMonth(m, k){ const [y,mo] = m.split("-").map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function monthName(m){ const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1,1); const n=d.toLocaleDateString("de-DE",{month:"long"}); return y===new Date().getFullYear()? n : n+" "+y; }
function fmtDay(s){
  if(s===dayOffset(0)) return "Heute";
  if(s===dayOffset(-1)) return "Gestern";
  return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"});
}

// ---- state ----
const state = { entries:[], accounts:[], settings:{budget:0}, month:curMonth(), cat:null, ready:false, tab:"monat", recurring:[], pie:"cat", invYear:new Date().getFullYear() };
try { const accs0 = JSON.parse(localStorage.getItem("hhb.accounts")||"{}"); if(Object.values(accs0).some(a=>a.kind==="umschlag")) state.tab = "sips"; } catch(e){}
function parseSigned(s){
  s = String(s||"").trim().replace(/\s|€/g,"");
  const neg = /^[-−]/.test(s); s = s.replace(/^[-−+]/,"");
  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s); if(!isFinite(n)) return NaN;
  return Math.round(n*100) * (neg?-1:1);
}
const toSigned = c => c ? (c<0?"-":"") + (Math.abs(c)/100).toFixed(2).replace(".",",").replace(/,00$/,"") : "";
const accOf = e => e.account || "giro";
const umschlaege = () => state.accounts.filter(a=>a.kind==="umschlag").sort((a,b)=>(a.order||0)-(b.order||0));
const konten = () => state.accounts.filter(a=>a.kind!=="ziel" && a.kind!=="umschlag").sort((a,b)=>(a.order||0)-(b.order||0));
const ziele = () => state.accounts.filter(a=>a.kind==="ziel").sort((a,b)=>(a.order||0)-(b.order||0));
const accById = id => state.accounts.find(a=>a.id===id);
const accName = id => (accById(id)||{name:"Unbekannt"}).name;
function movement(id){
  let m = 0;
  for(const e of state.entries){
    if(e.type==="transfer"){ if(e.to===id) m += e.amount; if(e.from===id) m -= e.amount; }
    else if(accOf(e)===id) m += e.type==="in" ? e.amount : -e.amount;
  }
  return m;
}
const balance = a => (a.start||0) + movement(a.id);
// Investiert: alles, was in einem Jahr auf Depot-Konten geflossen ist (Einzahlungen, Round-up, Saveback)
function investedYear(year){
  const D = new Set(state.accounts.filter(a=>a.kind==="depot").map(a=>a.id));
  const r = {manual:0, roundup:0, saveback:0, out:0, months:Array(12).fill(0), by:{}};
  const y = String(year);
  for(const e of state.entries){
    if(!(e.date||"").startsWith(y)) continue;
    const m = Number((e.date||"").slice(5,7))-1;
    let v = 0;
    if(e.type==="transfer"){
      if(D.has(e.to) && !D.has(e.from)){ v = e.amount; if(e.auto) r.roundup += v; else r.manual += v; }
      else if(D.has(e.from) && !D.has(e.to)){ r.out += e.amount; }
    } else if(e.type==="in" && e.cat==="saveback" && D.has(accOf(e))){ v = e.amount; r.saveback += v; }
    if(v && m>=0 && m<12) r.months[m] += v;
    if(v){ const dep = e.type==="transfer" ? e.to : accOf(e); r.by[dep] = (r.by[dep]||0) + v; }
  }
  r.total = r.manual + r.roundup + r.saveback;
  return r;
}
const KINDS = {konto:"Konto", bar:"Bargeld", depot:"Depot", ziel:"Sparziel", umschlag:"Zip"};
const KIND_ORDER = {konto:0, bar:0, depot:0, umschlag:1, ziel:2};
// Round-up (z. B. Trade Republic): Aufrundung auf den nächsten vollen Euro × Multiplikator, als Umbuchung aufs Depot
function roundupFor(amount, acc){
  if(!acc || !acc.roundup || !acc.roundupTo || !accById(acc.roundupTo)) return 0;
  return ((100 - amount % 100) % 100) * acc.roundup;
}
const childOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="transfer");
const sbOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="in");
// Saveback (z. B. Trade Republic): Prozent der Kartenzahlung als Einnahme ins Depot, mit Monatsdeckel
function savebackFor(amount, acc, date, parentId){
  if(!acc || !acc.saveback || !acc.savebackTo || !accById(acc.savebackTo)) return 0;
  const raw = Math.round(amount * acc.saveback / 100);
  const cap = acc.savebackCap || 0;
  if(!cap) return raw;
  const m = (date||"").slice(0,7);
  const used = state.entries.filter(e => e.auto && e.type==="in" && e.sbFrom===acc.id && (e.date||"").slice(0,7)===m && e.parent!==parentId).reduce((s,e)=>s+e.amount,0);
  return Math.max(0, Math.min(raw, cap - used));
}
async function syncRoundup(parentId, data){
  const child = childOf(parentId);
  const acc = data && data.type==="out" ? accById(data.account) : null;
  const amt = acc ? roundupFor(data.amount, acc) : 0;
  if(amt>0) await save("entries", child ? child.id : parentId+"-ru", {type:"transfer", auto:true, parent:parentId, from:acc.id, to:acc.roundupTo, amount:amt, date:data.date, note:"", createdAt:data.createdAt});
  else if(child) await store.del("entries", child.id);
  const sb = sbOf(parentId);
  const sv = acc ? savebackFor(data.amount, acc, data.date, parentId) : 0;
  if(sv>0) await save("entries", sb ? sb.id : parentId+"-sb", {type:"in", auto:true, parent:parentId, sbFrom:acc.id, account:acc.savebackTo, cat:"saveback", amount:sv, date:data.date, note:"", createdAt:data.createdAt});
  else if(sb) await store.del("entries", sb.id);
}
const usedBy = id => state.entries.some(e => e.type==="transfer" ? (e.from===id||e.to===id) : accOf(e)===id);

// ---- storage: only on this device ----
let store = null;
const local = {
  read(col){ try { return JSON.parse(localStorage.getItem("hhb."+col)||"{}"); } catch(e){ return {}; } },
  write(col,o){ try { localStorage.setItem("hhb."+col, JSON.stringify(o)); } catch(e){} },
};
function localStore(){
  const subs = {};
  const emit = col => { const o = local.read(col); (subs[col]||[]).forEach(cb => cb(Object.entries(o).map(([id,d])=>({id,...d})))); };
  return { kind:"local",
    sub(col,cb){ (subs[col] ||= []).push(cb); emit(col); },
    async set(col,id,data){ const o=local.read(col); o[id]=data; local.write(col,o); emit(col); },
    async del(col,id){ const o=local.read(col); delete o[id]; local.write(col,o); emit(col); } };
}
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function status(msg){ const el=$("#status"); el.textContent=msg||""; el.hidden=!msg; }

function boot(){
  store = localStore();
  if(!Object.keys(local.read("accounts")).length) local.write("accounts", {giro:{name:"Girokonto", kind:"konto", start:0, order:0}, bargeld:{name:"Bargeld", kind:"bar", start:0, order:1}});
  // PayPal einmalig als Standard-Konto ergänzen (gelöscht bleibt gelöscht)
  try { if(!localStorage.getItem("hhb.mig.paypal")){ const accs = local.read("accounts"); if(!Object.values(accs).some(a=>/paypal/i.test(a.name||""))){ accs.paypal = {name:"PayPal", kind:"konto", start:0, order:2}; local.write("accounts", accs); } localStorage.setItem("hhb.mig.paypal","1"); } } catch(e){}
  try { if(!localStorage.getItem("hhb.mig.union")){ const accs = local.read("accounts"); if(!Object.values(accs).some(a=>/union/i.test(a.name||""))){ accs.union = {name:"Union Depot", kind:"depot", start:0, order:4}; local.write("accounts", accs); } localStorage.setItem("hhb.mig.union","1"); } } catch(e){}
  store.sub("accounts", rows => { state.accounts=rows; render(); });
  store.sub("entries", rows => { state.entries=rows; state.ready=true; render(); });
  store.sub("recurring", rows => { state.recurring=rows; render(); });
  runRecurring();
  store.sub("settings", rows => { const m = rows.find(r=>r.id==="main"); state.settings = m ? m : {budget:0}; render(); });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadController && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => {
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
}

// ---- render ----
function render(){
  const m = state.month;
  document.querySelectorAll("#tabs [data-tab]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tab===state.tab)));
  $("#monthNav").hidden = state.tab!=="monat"; $("#pageTitle").hidden = state.tab==="monat";
  $("#pageTitle").textContent = state.tab==="sips" ? "Zips" : "Konten";
  if(state.tab==="konten" && state.ready){ renderKonten(); return; }
  if(state.tab==="sips" && state.ready){ renderSips(); return; }
  $("#monthTitle").textContent = monthName(m);
  $("#next").disabled = m >= curMonth();
  const main = $("#main");
  if(!state.ready){ main.innerHTML = `<div class="empty">Daten werden geladen …</div>`; return; }

  const inMonth = state.entries.filter(e => (e.date||"").slice(0,7)===m);
  const outs = inMonth.filter(e => e.type!=="in" && e.type!=="transfer" && !isKorr(e));
  const ins = inMonth.filter(e => e.type==="in" && !isKorr(e));
  const spent = outs.reduce((s,e)=>s+(e.amount||0),0);
  const earned = ins.reduce((s,e)=>s+(e.amount||0),0);
  const invM = investedYear(m).total;
  const saldo = earned - spent - invM;
  const [whole, cents] = money(spent).replace(/\s?€/,"").split(",");

  // budget
  const budget = state.settings.budget||0;
  let budgetHtml = `<button class="linkbtn" id="setBudget">Monatsbudget festlegen</button>`;
  if(budget){
    const pct = spent/budget;
    const rest = budget - spent;
    const isCur = m===curMonth();
    const [y,mo] = m.split("-").map(Number);
    const daysLeft = isCur ? new Date(y,mo,0).getDate() - new Date().getDate() + 1 : 0;
    const perDay = isCur && rest>0 ? ` · <span>noch <b class="num">${money(Math.floor(rest/daysLeft))}</b> pro Tag</span>` : "";
    budgetHtml = `<div class="budget">
      <div class="bline"><span>Budget <b class="num">${money(budget)}</b></span><span>${rest>=0?`Übrig <b class="num pos">${money(rest)}</b>`:`Überzogen <b class="num neg">${money(-rest)}</b>`}${perDay}</span></div>
      <div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent des Budgets verbraucht"><i class="${pct>1?"over":pct>.85?"warn":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i></div>
    </div>`;
  }

  let html = reminderHtml() + `<div class="hero">
    <div><div class="label">Ausgaben im ${esc(monthName(m).split(" ")[0])}</div>
      <div class="big num">${esc(whole)}<span class="cents">,${esc(cents)} €</span></div></div>
    ${budgetHtml}
    <div class="trio">
      <div><div class="label">Einnahmen</div><div class="v num pos">${money(earned)}</div></div>
      <div><div class="label">Ausgaben</div><div class="v num">${money(spent)}</div></div>
      <div><div class="label">Investiert</div><div class="v num">${money(invM)}</div></div>
    </div>
    <div class="bline" style="font-size:.92rem"><span>Bleibt nach Ausgaben &amp; Investieren</span><span><b class="num">${saldo>0?"+":saldo<0?"−":""}${money(Math.abs(saldo))}</b></span></div>
  </div>`;

  // categories + Kuchendiagramm
  const byCat = OUT_CATS.map(c => ({...c, sum: outs.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0), n: outs.filter(e=>e.cat===c.id).length}))
    .filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
  if(byCat.length){
    const hasZips = umschlaege().length>0;
    const mode = state.pie==="place" ? "place" : state.pie==="zip" && hasZips ? "zip" : "cat";
    let segs;
    if(mode==="cat") segs = byCat.map(c=>({k:c.id, name:c.name, i:c.i, sum:c.sum, n:c.n, col:c.c}));
    else if(mode==="zip"){
      const g = {}; outs.forEach(e => { const a = accById(accOf(e)); const k = a && a.kind==="umschlag" ? a.id : "_"; (g[k] ||= {sum:0,n:0}); g[k].sum += e.amount; g[k].n++; });
      segs = Object.entries(g).map(([k,v]) => k==="_" ? {name:"Nicht aus Zips", i:"🏦", col:"--c9", ...v} : {name:accName(k), i:zipIcon(accById(k)), col:zipColor(accById(k)), ...v}).sort((a,b)=>b.sum-a.sum);
    }
    else {
      const g = {}; outs.forEach(e => { const k = e.place || "Ohne Ort"; (g[k] ||= {sum:0,n:0}); g[k].sum += e.amount; g[k].n++; });
      const arr = Object.entries(g).map(([name,v])=>({name, ...v})).sort((a,b)=>b.sum-a.sum);
      const top = arr.slice(0,7), rest = arr.slice(7);
      if(rest.length) top.push({name:"Andere Orte", sum:rest.reduce((s,x)=>s+x.sum,0), n:rest.reduce((s,x)=>s+x.n,0)});
      segs = top.map((x,i)=>({...x, col:"--c"+(i+1), i:"📍"}));
    }
    let cum = 0; const gap = segs.length>1 ? .7 : 0;
    const arcs = segs.map(x => { const len = x.sum/spent*100; const o = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="var(${x.col})" stroke-width="5.2" stroke-dasharray="${Math.max(.01,len-gap).toFixed(3)} ${(100-Math.max(.01,len-gap)).toFixed(3)}" stroke-dashoffset="${(25-cum).toFixed(3)}" ${mode==="cat"?`data-pcat="${x.k}"`:""} style="opacity:${mode==="cat"&&state.cat&&state.cat!==x.k?.25:1}"><title>${esc(x.name)}: ${money(x.sum)}</title></circle>`; cum += len; return o; }).join("");
    const sel = mode==="cat" && state.cat ? segs.find(x=>x.k===state.cat) : null;
    const max = segs[0].sum;
    html += `<section><h2><span>Wofür ging's raus?</span><span class="mini" role="group" aria-label="Ansicht"><button data-pie="cat" aria-pressed="${mode==="cat"}">Kategorien</button>${hasZips?`<button data-pie="zip" aria-pressed="${mode==="zip"}">Zips</button>`:""}<button data-pie="place" aria-pressed="${mode==="place"}">Orte</button></span></h2>
    <div class="pie"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Kuchendiagramm der Ausgaben">${arcs}
      <text x="21" y="20.2" text-anchor="middle" font-size="2.6" fill="var(--muted)">${esc(sel ? sel.name.split(" ")[0] : "Ausgaben")}</text>
      <text class="ctr" x="21" y="25" text-anchor="middle" font-size="4.6" fill="var(--ink)">${esc(money(sel?sel.sum:spent).replace(/,\d\d\s?€/," €"))}</text></svg>
    <ul class="cats">${segs.map(x => mode==="cat" ? `
      <li><button class="cat" data-cat="${x.k}" aria-pressed="${state.cat===x.k}" title="${esc(x.name)}: ${money(x.sum)}, ${x.n} Einträge">
        <span class="name"><span class="dot" style="background:var(${x.col})"></span>${esc(x.name)}</span>
        <span class="amt num">${money(x.sum)}<small>${Math.round(x.sum/spent*100)} %</small></span>
        <span class="track"><i style="width:${(x.sum/max*100).toFixed(1)}%;background:var(${x.col})"></i></span>
      </button></li>` : `
      <li><div class="cat"><span class="name"><span class="dot" style="background:var(${x.col})"></span>${esc(x.name)}${x.n>1?` <small style="color:var(--muted)">${x.n}×</small>`:""}</span>
        <span class="amt num">${money(x.sum)}<small>${Math.round(x.sum/spent*100)} %</small></span>
        <span class="track"><i style="width:${(x.sum/max*100).toFixed(1)}%;background:var(${x.col})"></i></span></div></li>`).join("")}</ul></div></section>`;
  }

  html += recSection();

  // entries
  let list = inMonth.filter(e => !e.auto);
  if(state.cat) list = list.filter(e=>e.cat===state.cat);
  list.sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1));
  html += `<section><h2><span>Einträge</span><span class="num">${list.length}</span></h2>`;
  if(state.cat) html += `<div class="filter">Nur ${esc(catById(state.cat).name)} <button id="clearCat">Alle zeigen</button></div>`;
  if(!list.length){
    html += `<div class="empty"><strong>${inMonth.length? "Keine Einträge in dieser Kategorie" : "Noch keine Einträge im "+esc(monthName(m))}</strong>Tippe auf das Plus unten rechts, um eine Ausgabe einzutragen.</div>`;
  } else {
    const days = {};
    list.forEach(e => (days[e.date] ||= []).push(e));
    html += Object.keys(days).sort().reverse().map(d => {
      const daySum = days[d].reduce((s,e)=> s + ((e.type==="out"||!e.type) && !isKorr(e) ? e.amount : 0),0);
      return `<div class="day"><h3><span>${esc(fmtDay(d))}</span><span class="num">${daySum?"−"+money(daySum):""}</span></h3>
        <ul class="entries">${days[d].map(entryRow).join("")}</ul></div>`;
    }).join("");
  }
  html += `</section>`;
  main.innerHTML = html;
}
function entryRow(e){
  if(isKorr(e)){
    const pl = e.type==="in";
    return `<li><button class="entry" data-korr="${esc(e.id)}">
      <span class="badge" aria-hidden="true">±</span>
      <span class="mid"><div class="t">Korrektur (Abgleich)</div><div class="s">${esc(accName(accOf(e)))} · zählt nicht als ${pl?"Einnahme":"Ausgabe"}</div></span>
      <span class="a num" style="color:var(--muted)">${pl?"+":"−"}${money(e.amount)}</span>
    </button></li>`;
  }
  if(e.type==="transfer"){
    const toKind = (accById(e.to)||{}).kind;
    const fromKind = (accById(e.from)||{}).kind;
    const label = e.auto ? "Round-up" : toKind==="umschlag" ? "In Zip gesteckt" : fromKind==="umschlag" ? "Aus Zip genommen" : ({ziel:"Zurückgelegt", bar:"Abgehoben", depot:"Investiert"})[toKind] || "Umbuchung";
    return `<li><button class="entry" data-edit="${esc(e.id)}">
      <span class="badge" aria-hidden="true">${label==="Investiert"||label==="Round-up"?"📈":(accById(e.to)||{}).kind==="umschlag"||(accById(e.from)||{}).kind==="umschlag"?"✉️":label==="Abgehoben"?"🏧":label==="Zurückgelegt"?"🎯":"⇄"}</span>
      <span class="mid"><div class="t">${esc(e.note || label)}</div><div class="s">${esc(accName(e.from))} → ${esc(accName(e.to))}</div></span>
      <span class="a num" style="color:var(--muted)">${money(e.amount)}</span>
    </button></li>`;
  }
  const c = catById(e.cat);
  const multi = state.accounts.length > 1;
  const isIn = e.type==="in";
  const title = e.note || e.place || c.name;
  const ru = e.type==="out" ? childOf(e.id) : null;
  const sbk = e.type==="out" ? sbOf(e.id) : null;
  return `<li><button class="entry" data-edit="${esc(e.id)}">
    <span class="badge" style="${tint(c.c)}" aria-hidden="true">${c.i||esc(c.name.slice(0,2))}</span>
    <span class="mid"><div class="t">${esc(title)}</div>${(e.note||e.place||multi||ru||sbk)?`<div class="s">${esc([(e.note||e.place)?c.name:"", e.note&&e.place?e.place:"", multi?accName(accOf(e)):"", ru?"Round-up "+money(ru.amount):"", sbk?"Saveback +"+money(sbk.amount):"", e.rec?"Dauerauftrag":""].filter(Boolean).join(" · "))}</div>`:""}</span>
    <span class="a num ${isIn?"pos":""}">${isIn?"+":"−"}${money(e.amount)}</span>
  </button></li>`;
}

// ---- toast ----
let toastTimer;
function toast(msg, undo){
  const el=$("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button id="undo">Rückgängig</button>':""}`;
  el.hidden=false;
  if(undo) $("#undo").onclick = () => { undo(); el.hidden=true; };
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,4000);
}
async function save(col,id,data){
  try { await store.set(col,id,data); }
  catch(e){ toast(e && e.code==="quota_exceeded" ? "Speicher voll. Lösche alte Einträge." : "Speichern fehlgeschlagen. Versuch es nochmal."); throw e; }
}

function closeSheet(){ $("#sheet").hidden=true; $("#scrim").hidden=true; }
function openSheet(html){ const s=$("#sheet"); s.innerHTML=`<div class="sheet-inner"><div class="grab"></div>${html}</div>`; s.hidden=false; $("#scrim").hidden=false; }

function entrySheet(entry, preset){
  const defDate = state.month===curMonth() ? dayOffset(0) : state.month+"-01";
  const k0 = (konten()[0]||{}).id || "giro";

  const dateChips = [["Heute",dayOffset(0)],["Gestern",dayOffset(-1)]];

    <div id="destBox" hidden><div class="label" style="margin-bottom:6px">Wohin?</div>

    <div id="accBox"><div class="label" style="margin-bottom:6px" id="accLabel">Konto</div><div class="chips" id="fAcc"></div></div>
    <div id="splitBox" hidden><div class="label" style="margin-bottom:6px">Verteilen auf</div>
      <div class="splits" id="splitRows"></div>

      <p class="splitrest" id="splitRest"></p></div>

      <div class="label" style="margin:12px 0 6px">Nach</div><div class="chips" id="fTo"></div>
      <div class="newacc" id="newAcc" hidden>
        <div class="label">Neu anlegen für „<span id="naSlot"></span>“</div>
        <input class="input" id="naName" placeholder="Name, z. B. PayPal oder Tagesgeld" autocomplete="off">
        <div class="chips" id="naKind">${["konto","bar","depot","umschlag","ziel"].map(k=>`<button class="chip" data-nakind="${k}">${KINDS[k]==="Umschlag"?"Zip":KINDS[k]}</button>`).join("")}</div>
        <div class="row"><button class="danger" style="color:var(--ink)" id="naCancel">Abbrechen</button><button class="primary" id="naOk">Anlegen</button></div>
      </div>
      <p class="warnmsg" id="trWarn" hidden></p>
      <p class="hint" style="margin-top:10px">Umbuchungen zählen weder als Ausgabe noch als Einnahme.</p></div>
    <div><div class="label" style="margin-bottom:6px">Datum</div><div class="chips" id="fDate">
      ${dateChips.map(([n,v])=>`<button class="chip" data-date="${v}">${n}</button>`).join("")}
      <label class="chip" id="dateCustom">Datum <input type="date" id="fDateIn" value="${esc(d.date)}" aria-label="Datum wählen"></label>
    </div></div>
    <input class="input" id="fNote" placeholder="Notiz (optional)" value="${esc(d.note||"")}" autocomplete="off" enterkeyhint="done">
    <div class="row">${entry?`<button class="danger" id="del">Löschen</button>`:""}<button class="primary" id="ok">${entry?"Speichern":"Eintragen"}</button></div>
  `);
  const cats = () => d.type==="in" ? IN_CATS : OUT_CATS;
  const drawCats = () => {
    if(!cats().some(c=>c.id===d.cat)) d.cat = d.type==="in" ? "gehalt" : null;
    const isIn = d.type==="in";
    $("#fCat").hidden = isIn; $("#fCatSel").hidden = !isIn; $("#catLabel").textContent = isIn ? "Was kommt rein?" : "Kategorie";
    if(isIn){ $("#fCatSel").innerHTML = IN_CATS.filter(c=>c.id!=="saveback" || d.cat==="saveback").map(c=>`<option value="${c.id}">${c.i} ${esc(c.name)}</option>`).join(""); $("#fCatSel").value = d.cat; }
    else $("#fCat").innerHTML = cats().map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${c.id===d.cat}"><span class="dot" style="background:var(${c.c})"></span>${esc(c.name)}</button>`).join("");
  };
  let dest = "konto"; const chosen = [];
  let editAcc = false;
  const na = {slot:null, kind:"konto"};
  const accChips = (sel, attr) => state.accounts.slice().sort((a,b)=>(KIND_ORDER[a.kind||"konto"]-KIND_ORDER[b.kind||"konto"])||(a.order||0)-(b.order||0))
    .map(a=>`<button class="chip" data-${editAcc?"delacc":attr}="${esc(a.id)}" aria-pressed="${!editAcc && a.id===sel}" ${editAcc?`aria-label="${esc(a.name)} löschen"`:""}>${a.kind==="ziel"?"🎯 ":a.kind==="umschlag"?zipIcon(a)+" ":""}${esc(a.name)}${editAcc?'<span class="x" aria-hidden="true">×</span>':""}</button>`).join("")
    + (attr==="acc" ? "" : editAcc ? `<button class="chip ghost" data-editdone="1">Fertig</button>` : `<button class="chip ghost" data-newfor="${attr}">+ Neu</button><button class="chip ghost" data-editacc="1">Bearbeiten</button>`);
  const drawAcc = () => {
    $("#fAcc").innerHTML = accChips(d.account, "acc");
    if(d.type==="out") document.querySelectorAll("#fAcc [data-acc]").forEach(b => { const k = (accById(b.dataset.acc)||{}).kind; if((k==="depot"||k==="ziel") && b.dataset.acc!==d.account) b.hidden = true; });

    $("#catBox").hidden = d.type==="transfer";
    $("#placeBox").hidden = d.type!=="out";
    $("#accBox").hidden = d.type==="transfer" || state.accounts.length<2;
    $("#trBox").hidden = d.type!=="transfer";
  };
  const canSplit = () => !entry && d.type==="in" && umschlaege().length>0;
  const splitOn = () => canSplit() && dest==="zips" && (accById(d.account)||{}).kind!=="umschlag";
  const drawSplit = () => {
    const keep = {}; document.querySelectorAll("[data-split]").forEach(i => keep[i.dataset.split] = i.value);
    $("#splitRows").innerHTML = chosen.map(id => { const z = accById(id); if(!z) return ""; return `<div class="splitrow" style="grid-template-columns:1fr 7.5em auto"><span>${zipIcon(z)} ${esc(z.name)} <small class="num" style="color:var(--muted)">(${money(balance(z))})</small></span><input class="input num" inputmode="decimal" placeholder="0" data-split="${esc(id)}" value="${esc(keep[id]||"")}" autocomplete="off" aria-label="Betrag für ${esc(z.name)}"><button class="chip" data-unsplit="${esc(id)}" aria-label="${esc(z.name)} entfernen" style="padding:6px 10px">×</button></div>`; }).join("");
    const left = umschlaege().filter(z=>!chosen.includes(z.id));
    $("#splitAdd").hidden = !left.length;
    $("#splitAdd").innerHTML = `<option value="">＋ Zip hinzufügen …</option>` + (left.length>1 ? `<option value="__all">Alle Zips</option>` : "") + left.map(z=>`<option value="${esc(z.id)}">${zipIcon(z)} ${esc(z.name)}</option>`).join("");
    document.querySelectorAll("[data-split]").forEach(i => i.oninput = sync);
  };

  const splitSum = () => splits().reduce((s,x)=>s+x.amount,0);
  const valid = () => parseAmount($("#fAmount").value)>0 && splitSum() <= parseAmount($("#fAmount").value) && d.date && (d.type==="transfer" ? (d.from && d.to && d.from!==d.to && accById(d.from) && accById(d.to)) : (d.cat && accById(d.account||"giro")));

    drawAcc();
    document.querySelectorAll("#fType [data-type]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.type===d.type)));
    document.querySelectorAll("#fCat [data-cat]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.cat===d.cat)));
    document.querySelectorAll("#fDate [data-date]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.date===d.date)));

    $("#ok").disabled = !valid();
    $("#destBox").hidden = !canSplit();
    document.querySelectorAll("#fDest [data-dest]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.dest===dest)));

    if(splitOn()){
      const total = parseAmount($("#fAmount").value), used = splitSum(), rest = total - used;
      $("#splitRest").innerHTML = rest < 0 ? `<span class="neg">Du hast <b class="neg">${money(-rest)}</b> mehr verteilt, als reinkommt.</span>`
        : !chosen.length ? `Wähl oben die Zips aus, auf die du verteilen willst.` : used ? `Noch frei: <b class="num">${money(rest)}</b>, bleibt auf ${esc(accName(d.account))}` : `Was du nicht verteilst, bleibt auf ${esc(accName(d.account))}.`;

    const sv = ra ? savebackFor(parseAmount($("#fAmount").value), ra, d.date, entry&&entry.id) : 0;
    $("#ruHint").hidden = !rv && !sv;
    $("#ruHint").textContent = [rv?`Round-up: ${money(rv)} aufs ${accName(ra.roundupTo)}`:"", sv?`Saveback: +${money(sv)} aufs ${accName(ra.savebackTo)}`:""].filter(Boolean).join(" · ");
  };
  const CUSTOM = "__custom__";

  const opt = p => `<option value="${esc(p)}">${esc(p)}</option>`;
  $("#fPlace").innerHTML = `<option value="">– kein Ort –</option>`
    + (recent.length ? `<optgroup label="Zuletzt genutzt">${recent.map(opt).join("")}</optgroup>` : "")
    + OUT_CATS.filter(c=>PLACES[c.id]).map(c => `<optgroup label="${esc(c.name)}">${PLACES[c.id].map(opt).join("")}</optgroup>` + (c.id==="shopping" ? `<optgroup label="Mode &amp; Schuhe">${PLACES.mode.map(opt).join("")}</optgroup>` : "")).join("")
    + `<option value="${CUSTOM}">Eigener Ort …</option>`;
  $("#fPlace").value = d.place || "";
  $("#fPlace").onchange = e => {
    const v = e.target.value;
    $("#fPlaceIn").hidden = v!==CUSTOM;
    if(v===CUSTOM){ d.place = ""; $("#fPlaceIn").value = ""; $("#fPlaceIn").focus(); return; }
    d.place = v;
    const pc = placeCat(v);
    if(pc && (!d.cat || !entry)) { d.cat = pc; sync(); }
  };
  $("#fPlaceIn").oninput = e => { d.place = e.target.value.trim(); };
  drawCats(); sync();

    if(e.target.closest("[data-editdone]")){ editAcc = false; $("#trWarn").hidden = true; sync(); return true; }
    const del = e.target.closest("[data-delacc]");
    if(del){
      const a = accById(del.dataset.delacc), w = $("#trWarn");
      if(!a) return true;

      if(a.kind!=="ziel" && a.kind!=="umschlag" && konten().length<2){ w.textContent = "Mindestens ein Konto muss bleiben."; w.hidden = false; return true; }
      const {id, ...data} = a;
      store.del("accounts", id).then(() => { if(d.from===id) d.from=null; if(d.to===id) d.to=null; if(d.account===id) d.account=k0; w.hidden = true; sync(); toast(`„${a.name}“ gelöscht`, () => save("accounts", id, data).then(sync)); });
      return true;
    }

  };
  const syncNa = () => { document.querySelectorAll("#naKind [data-nakind]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.nakind===na.kind))); $("#naOk").disabled = !$("#naName").value.trim(); };
  $("#naName").oninput = syncNa;
  $("#naKind").onclick = e => { const b=e.target.closest("[data-nakind]"); if(b){ na.kind=b.dataset.nakind; syncNa(); } };
  $("#naCancel").onclick = () => { $("#newAcc").hidden = true; };
  $("#naOk").onclick = async () => {
    const name = $("#naName").value.trim(); if(!name) return;
    const id = newId();
    try { await save("accounts", id, {name, kind:na.kind, start:0, order:Date.now()}); } catch(e){ return; }
    if(na.slot==="from"){ d.from = id; if(d.to===id) d.to=null; } else { d.to = id; if(d.from===id) d.from=null; }
    $("#newAcc").hidden = true; sync(); toast(`„${name}“ angelegt`);
  };
  $("#fFrom").onclick = e => { if(manage(e)) return; const b=e.target.closest("[data-from]"); if(b){ d.from=b.dataset.from; if(d.to===d.from) d.to=null; sync(); } };
  $("#fTo").onclick = e => { if(manage(e)) return; const b=e.target.closest("[data-to]"); if(b){ d.to=b.dataset.to; if(d.from===d.to) d.from=null; sync(); } };
  const autoBar = () => { if(!entry && d.type==="in" && ["trinkgeld","taschengeld","geschenk"].includes(d.cat)){ const bar = konten().find(a=>a.kind==="bar"); if(bar) d.account = bar.id; } };
  $("#fCatSel").onchange = e => { d.cat = e.target.value; autoBar(); sync(); };
  $("#fDest").onclick = e => { const b = e.target.closest("[data-dest]"); if(!b) return; dest = b.dataset.dest; if(dest==="zips" && (accById(d.account)||{}).kind==="umschlag"){ const bar = konten().find(a=>a.kind==="bar")||konten()[0]; if(bar) d.account = bar.id; } drawSplit(); sync(); };
  $("#splitAdd").onchange = e => { const v = e.target.value; if(v==="__all") umschlaege().forEach(z=>{ if(!chosen.includes(z.id)) chosen.push(z.id); }); else if(v) chosen.push(v); drawSplit(); sync(); const ins = document.querySelectorAll("[data-split]"); if(ins.length && v && v!=="__all") ins[ins.length-1].focus(); };
  $("#splitRows").onclick = e => { const b = e.target.closest("[data-unsplit]"); if(b){ chosen.splice(chosen.indexOf(b.dataset.unsplit),1); drawSplit(); sync(); } };
  drawSplit();
  $("#fCat").onclick = e => { const b=e.target.closest("[data-cat]"); if(b){ d.cat=b.dataset.cat;
    if(!entry && d.type==="in" && ["trinkgeld","taschengeld","geschenk"].includes(d.cat)){ const bar = konten().find(a=>a.kind==="bar"); if(bar) d.account = bar.id; }
    sync(); } };
  document.querySelectorAll("[data-split]").forEach(i => i.oninput = sync);
  $("#fDate").onclick = e => { const b=e.target.closest("[data-date]"); if(b){ d.date=b.dataset.date; sync(); } };
  $("#fDateIn").onchange = e => { if(e.target.value){ d.date=e.target.value; } sync(); };
  $("#fAmount").oninput = sync;
  $("#cancel").onclick = closeSheet;
  const submit = async () => {
    const amount = parseAmount($("#fAmount").value);
    if(!valid()) return;
    const id = entry ? entry.id : newId();
    const base = {type:d.type, amount, date:d.date, note:$("#fNote").value.trim(), createdAt: entry ? (entry.createdAt||Date.now()) : Date.now()};
    const data = d.type==="transfer" ? {...base, from:d.from, to:d.to} : {...base, cat:d.cat, account:d.account||"giro"};
    if(d.type==="out" && d.place) data.place = d.place;
    const sp = splits();
    closeSheet();
    try { await save("entries", id, data); await syncRoundup(id, data);
      for(const x of sp) await save("entries", newId(), {type:"transfer", amount:x.amount, from:data.account, to:x.to, date:data.date, note:"", split:id, createdAt:Date.now()});
      if(!entry){ toast(sp.length ? `Einnahme eingetragen, ${money(sp.reduce((s,x)=>s+x.amount,0))} auf ${sp.length} Zip${sp.length>1?"s":""} verteilt` : ({in:"Einnahme",out:"Ausgabe",transfer:"Umbuchung"})[d.type]+" eingetragen: "+money(amount)); if(d.date.slice(0,7)!==state.month){ state.month=d.date.slice(0,7); render(); } } } catch(e){}
  };
  $("#ok").onclick = submit;
  $("#fNote").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); submit(); } };
  if(entry) $("#del").onclick = async () => {
    const {id, ...data} = entry; const kids = [childOf(id), sbOf(id)].filter(Boolean); closeSheet();
    try {
      await store.del("entries", id); for(const k of kids) await store.del("entries", k.id);
      toast("Gelöscht", async () => { await save("entries", id, data); for(const k of kids){ const {id:cid, ...cd} = k; await save("entries", cid, cd); } });
    } catch(e){ toast("Löschen fehlgeschlagen."); }
  };
  if(!entry) setTimeout(()=>$("#fAmount").focus(), 60);
}

const ZIP_ICONS = [[/urlaub|reise|ferien/i,"✈️"],[/auto|kfz|tank|werkstatt/i,"🚗"],[/geschenk|geburtstag|weihnacht/i,"🎁"],[/lebensmittel|essen|einkauf/i,"🛒"],[/rückzahl|schuld|kredit/i,"💸"],[/notgroschen|not|puffer/i,"🛟"],[/kleid|mode|klamott/i,"👕"],[/haus|wohn|miete|möbel/i,"🏠"],[/tier|hund|katze/i,"🐾"],[/handy|technik/i,"📱"],[/freizeit|hobby|spaß/i,"🎉"],[/gesund|arzt|apothek/i,"💊"],[/sparen|spar/i,"🐷"],[/haar|friseur|beauty|drogerie/i,"💇"],[/abo|vertrag|versicherung/i,"📄"]];
const ZIP_PICK = ["✉️","✈️","🚗","🎁","🛒","💸","🛟","👕","🏠","🐾","📱","🎉","💊","🐷","💇","📄","🎓","👶","🍼","⚽","🎮","📚","🎄","💍","🏖️","🍽️","⛽","🧾"];
const zipIcon = a => { if(a && a.icon) return a.icon; for(const [r,i] of ZIP_ICONS) if(r.test(a.name||"")) return i; return "✉️"; };
const zipColor = a => { const i = umschlaege().findIndex(z=>z.id===a.id); return "--c"+((Math.max(0,i)%8)+1); };
function zipMonth(id, m){
  let inn = 0, out = 0;
  for(const e of state.entries){
    if((e.date||"").slice(0,7)!==m) continue;
    if(e.type==="transfer"){ if(e.to===id) inn += e.amount; if(e.from===id) out += e.amount; }
    else if(accOf(e)===id && !isKorr(e)){ if(e.type==="out") out += e.amount; else inn += e.amount; }
  }
  return {inn, out};
}
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function renderSips(){

  const m = curMonth();
  const tot = us.reduce((r,a)=>{ const x = zipMonth(a.id, m); r.inn += x.inn; r.out += x.out; return r; }, {inn:0,out:0});
  const [whole, cents] = money(Math.abs(inEnv)).replace(/\s?€/,"").split(",");
  let html = reminderHtml() + `<div class="hero">

      <div><div class="label">${MON[Number(m.slice(5))-1]} befüllt</div><div class="v num pos">${money(tot.inn)}</div></div>

  </div>`;
  html += `<section><h2><span>Deine Zips</span><button class="linkbtn" id="addEnv2" style="color:var(--accent);font-size:.95rem">+ Neuer Zip</button></h2>`;
  if(!us.length) html += `<div class="empty" style="padding:20px 16px"><strong>Noch keine Zips</strong>Für dein Bargeld im Budgetplaner. Leg los mit einem Tipp:</div>
    <div class="chips" style="justify-content:center">${["Urlaub","Auto","Rückzahlung","Geschenke","Lebensmittel","Notgroschen"].map(n=>`<button class="chip" data-newenv="${n}">+ ${n}</button>`).join("")}</div>
    <div class="addrow" style="margin-top:14px"><button class="addbtn" id="addEnv">+ Eigenen Zip anlegen</button></div>`;
  else html += `<div class="zgrid">${us.map(a => {
    const b = balance(a), t = a.target||0, pct = t ? Math.max(0,Math.min(1,b/t)) : 0, x = zipMonth(a.id, m);
    return `<div class="zcard" style="--zc:var(${zipColor(a)})">
      <button class="open" data-zip="${esc(a.id)}" aria-label="${esc(a.name)} öffnen">
        <span class="ic" aria-hidden="true">${zipIcon(a)}</span>
        <span class="zn">${esc(a.name)}</span>
        <span class="zb num ${b<0?"neg":""}">${money(b)}</span>
        ${t?`<span class="zbar" role="img" aria-label="${Math.round(pct*100)} Prozent von ${money(t)}"><i style="width:${(pct*100).toFixed(1)}%"></i></span><span class="zt">${b>=t?"Ziel erreicht":`${Math.round(pct*100)} % von ${money(t)}`}</span>`:""}
        <span class="zm">${x.inn||x.out ? `${MON[Number(m.slice(5))-1]}: ${x.inn?"+"+money(x.inn):""}${x.inn&&x.out?" · ":""}${x.out?"−"+money(x.out):""}` : "Diesen Monat noch nichts"}</span>
      </button>
      <div class="zact"><button data-payzip="${esc(a.id)}">Bezahlen</button><button class="fill" data-fill="${esc(a.id)}">Befüllen</button></div>
    </div>`;
  }).join("")}<button class="zcard addz" id="addEnv">+ Neuer Zip</button></div>`;
  html += `</section>`;
  if(us.length){
    const ids = new Set(us.map(a=>a.id));
    const moves = state.entries.filter(e => e.type==="transfer" ? (ids.has(e.from)||ids.has(e.to)) : ids.has(accOf(e)))
      .sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1)).slice(0,15);
    html += `<section><h2><span>Letzte Bewegungen</span></h2>`;

    html += `</section>`;
  }
  $("#main").innerHTML = html;
}

// Zip-Detail
function zipSheet(a){

  const now = new Date(); const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); const mm = d.getFullYear()+"-"+pad(d.getMonth()+1); months.push({mm, l:MON[d.getMonth()], ...zipMonth(a.id, mm)}); }
  const mx = Math.max(1, ...months.map(x=>Math.max(x.inn,x.out)));
  const moves = state.entries.filter(e => e.type==="transfer" ? (e.from===a.id||e.to===a.id) : accOf(e)===a.id)
    .sort((x,y)=> x.date===y.date ? (y.createdAt||0)-(x.createdAt||0) : (x.date<y.date?1:-1)).slice(0,12);
  const spent = state.entries.filter(e=>e.type==="out" && accOf(e)===a.id && !isKorr(e));

      <div class="hlab">${months.map(x=>`<span>${x.l}</span>`).join("")}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Befüllt</span><span><i style="background:var(--danger)"></i>Raus</span></div>
    </div>
    ${byCat.length?`<div><div class="label" style="margin-bottom:6px">Wofür ausgegeben</div><p class="hint" style="color:var(--ink)">${byCat.map(x=>`${x.c.i} ${esc(x.c.name)} <b class="num">${money(x.sum)}</b>`).join(" · ")}</p></div>`:""}

  `);

// ---- Daueraufträge ----
const IV = {weekly:"Wöchentlich", monthly:"Monatlich", quarterly:"Vierteljährlich", halfyearly:"Halbjährlich", yearly:"Jährlich"};
const IV_PER_MONTH = {weekly:52/12, monthly:1, quarterly:1/3, halfyearly:1/6, yearly:1/12};
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function addInterval(date, iv, day){
  const [y,m,d] = date.split("-").map(Number);
  if(iv==="weekly") return iso(new Date(y, m-1, d+7));
  const step = iv==="yearly" ? 12 : iv==="halfyearly" ? 6 : iv==="quarterly" ? 3 : 1;
  const t = new Date(y, m-1+step, 1); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(Math.min(day||d, last));
}
let recRunning = false;
async function runRecurring(){
  if(recRunning) return; recRunning = true;
  try {
    const today = iso(new Date()); let n = 0;
    for(const r of state.recurring){
      const ok = r.type==="transfer" ? accById(r.from) && accById(r.to) : accById(r.account);
      if(!ok || !r.amount || !r.start) continue;
      const first = r.next || r.start, day = Number(r.start.slice(8,10)); let next = first, guard = 0;
      while(next <= today && guard++ < 500){
        const eid = "rec-"+r.id+"-"+next;
        if(!state.entries.some(e=>e.id===eid)){
          const base = {amount:r.amount, date:next, note:r.name||"", createdAt:Date.now(), rec:r.id};
          const data = r.type==="transfer" ? {...base, type:"transfer", from:r.from, to:r.to} : {...base, type:r.type, cat:r.cat, account:r.account};
          await store.set("entries", eid, data); n++;
        }
        next = addInterval(next, r.interval, day);
      }
      if(next !== first){ const {id, ...d} = r; await store.set("recurring", id, {...d, next}); }
    }
    if(n) toast(n===1 ? "1 Dauerauftrag eingetragen" : n+" Daueraufträge eingetragen");
  } finally { recRunning = false; }
}
const fmtShort = d => { const x = new Date(d+"T12:00"); return x.getDate()+"."+(x.getMonth()+1)+"."+(x.getFullYear()!==new Date().getFullYear()?String(x.getFullYear()).slice(2):""); };
function recRow(r){
  const c = r.type==="transfer" ? null : catById(r.cat);
  const sign = r.type==="in" ? "+" : r.type==="out" ? "−" : "";
  const where = r.type==="transfer" ? accName(r.from)+" → "+accName(r.to) : accName(r.account);
  return `<li><button class="acc" data-rec="${esc(r.id)}"><span class="badge" style="${c?tint(c.c):""}" aria-hidden="true">${r.icon||(c?c.i:((accById(r.to)||{}).kind==="depot"?"📈":"⇄"))}</span><span class="mid"><div class="t">${esc(r.name || (c?c.name:(accById(r.to)||{}).kind==="depot"?"Sparplan":"Umbuchung"))}</div><div class="s">${esc(IV[r.interval]||"")}${r.interval==="weekly"?" ("+WD[new Date((r.start||"")+"T12:00").getDay()]+")":r.start?" am "+Number(r.start.slice(8,10))+".":""} · nächster ${esc(fmtShort(r.next||r.start))}</div><div class="s">${esc(where)}</div></span><span class="a num ${r.type==="in"?"pos":""}">${sign}${money(r.amount)}</span></button></li>`;
}
function recSection(){
  const recs = state.recurring.slice().sort((a,b)=>(a.next||a.start||"").localeCompare(b.next||b.start||""));
  const pm = t => Math.round(recs.filter(r=>t(r)).reduce((s,r)=>s+r.amount*(IV_PER_MONTH[r.interval]||1),0));
  const isInv = r => r.type==="transfer" && (accById(r.to)||{}).kind==="depot";
  const fixOut = pm(r=>r.type==="out"), fixInv = pm(isInv), fixIn = pm(r=>r.type==="in");
  let h = `<section><h2><span>Daueraufträge</span>${recs.length?`<span class="num">${recs.length}</span>`:""}</h2>`;
  if(recs.length){
    h += `<div class="inv" style="margin-bottom:10px"><div class="parts">
      <div><span>Fixkosten pro Monat</span><b class="num">${money(fixOut)}</b></div>
      ${fixInv?`<div><span>Sparpläne pro Monat</span><b class="num">${money(fixInv)}</b></div>`:""}
      ${fixIn?`<div><span>Feste Einnahmen pro Monat</span><b class="num pos">${money(fixIn)}</b></div>`:""}
    </div>${recs.some(r=>r.interval!=="monthly")?`<p class="hint">Wöchentliche, vierteljährliche, halbjährliche und jährliche Posten sind auf den Monat umgerechnet.</p>`:""}</div>`;
    h += `<ul class="accs recs">${recs.map(recRow).join("")}</ul>`;
  } else h += `<p class="hint" style="margin:0 4px 4px">Handy, Abos, Miete, Strom oder Sparpläne einmal anlegen. Die App bucht sie dann am richtigen Tag automatisch.</p>`;
  return h + `<div class="addrow"><button class="addbtn" id="addRec">+ Dauerauftrag</button></div></section>`;
}

    if(clamp(y,m) < t.getDate()){ m++; if(m>11){ m=0; y++; } }

function nextAfterToday(start, iv){ const today = iso(new Date()), day = Number(start.slice(8,10)); let n = start, g = 0; while(n <= today && g++ < 1000) n = addInterval(n, iv, day); return n; }
