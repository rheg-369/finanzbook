<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haushaltsbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushaltsbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one-column phone app. Sticky month switcher, month summary + budget, category bars, entries by day, floating add button, bottom sheet editor */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#191f1b; --muted:#646d66; --line:#e2e5df;
  --accent:#2f6b4f; --accent-soft:#e2eee7; --danger:#b3412e; --warn:#9a5f0c; --chip:#eceee9; --track:#e8ebe6;
  --shadow:0 10px 30px rgba(20,40,30,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#8a918c;
  --f-display:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ece8; --muted:#97a29a; --line:#2a312d;
  --accent:#6fbf94; --accent-soft:#1f3329; --danger:#e47a66; --warn:#e0a54a; --chip:#232a26; --track:#262d29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#7d857f;
  color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:16px}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.ptitle{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;min-width:9.5ch;text-align:center}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
.icon:disabled{opacity:.35}

.hero{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.big .cents{font-size:.55em;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.trio div{min-width:0}
.trio .v{font-weight:600;margin-top:2px;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)} .neg{color:var(--danger)}
.budget{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--danger)}
.bline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.bline b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.88rem;align-self:flex-start}

section{margin-top:22px}
section > h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px 2px;display:flex;justify-content:space-between}
.cats{background:var(--surface);border-radius:16px;padding:6px 0;list-style:none;margin:0}
.cat{width:100%;border:0;background:none;text-align:left;padding:9px 16px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat .name{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0}
.cat .amt{font-weight:600;font-size:.95rem}
.cat .amt small{color:var(--muted);font-weight:400;margin-left:6px}
.cat .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--track)}
.cat .track i{display:block;height:100%;border-radius:4px;min-width:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.filter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0 0 8px 2px}
.filter button{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8rem}

.day{margin-top:14px}
.day h3{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:500;margin:0 0 6px 2px}
.entries{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.entry{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.entries li:last-child .entry{border-bottom:0}
.badge{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.entry .mid{flex:1;min-width:0}
.entry .t{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);margin-bottom:6px}
.status{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:94%;overflow-y:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{font-family:var(--f-display);font-size:1.15rem;margin:0}
.txt{border:0;background:none;padding:0;color:var(--muted);font-weight:500;min-width:80px;text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0}
.amount input{border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:3rem;text-align:right;width:6.5ch;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount span{font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip input[type=date]{border:0;background:none;padding:0;font-size:.88rem;width:8.5em;min-width:0}
.row{display:flex;gap:10px}
.primary{flex:1;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--bg);font-weight:600;font-size:1rem}
.primary:disabled{opacity:.45}
.danger{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:none;color:var(--danger);font-weight:600}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.remind{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.9rem}
.remind span{flex:1 1 180px}
.remind button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.remind .go{background:var(--accent);color:var(--bg)}
.remind .later{background:none;color:var(--muted)}
.accs{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.acc{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.accs li:last-child .acc{border-bottom:0}
.acc .mid{flex:1;min-width:0}
.acc .t{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.acc .a{font-weight:600;white-space:nowrap}
.goal{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goals{display:flex;flex-direction:column;gap:10px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .name{border:0;background:none;padding:0;font-weight:600;font-size:1rem;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .of{font-size:.88rem;color:var(--muted);white-space:nowrap}
.goal .of b{color:var(--ink)}
.goal .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.goal .put{border:0;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addbtn{flex:1 1 40%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:11px;color:var(--muted);font-weight:500;font-size:.92rem}
.seg3{grid-template-columns:1fr 1fr 1fr}
.sublabel{font-size:.82rem;color:var(--muted);margin:-4px 0 0}
.warnmsg{font-size:.85rem;color:var(--danger);margin:0}
.splits{display:flex;flex-direction:column;gap:8px}
.splitrow{display:grid;grid-template-columns:1fr 7.5em;gap:10px;align-items:center}
.splitrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splitrow input{text-align:right;padding:10px 12px}
.splitrest{font-size:.88rem;margin:8px 0 0;color:var(--muted)}
.splitrest b{color:var(--ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip .x{margin-left:2px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--surface);display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;line-height:1}
.newacc{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.inv{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.inv .yr{display:flex;align-items:center;justify-content:space-between}
.inv .yr button{border:0;background:var(--chip);border-radius:10px;width:36px;height:32px;font-weight:700;color:var(--ink)}
.inv .yr button:disabled{opacity:.3}
.inv .yr b{font-family:var(--f-display);font-size:1.05rem}
.inv .tot{text-align:center}
.inv .tot .v{font-family:var(--f-display);font-weight:700;font-size:2rem}
.inv .parts{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.inv .parts div{display:flex;justify-content:space-between;gap:10px}
.inv .parts span{color:var(--muted)}
.inv .months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:70px}
.inv .months i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.inv .months i.z{background:var(--line)}
.inv .mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:.62rem;color:var(--muted);text-align:center;margin-top:-8px}
.chk{display:flex;flex-direction:column;gap:10px}
.chkrow{display:grid;grid-template-columns:1fr 8em;gap:4px 10px;align-items:center}
.chkrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chkrow .app{grid-column:1;font-size:.8rem;color:var(--muted)}
.chkrow input{grid-row:1/span 2;grid-column:2;text-align:right;padding:10px 12px}
.chkrow .df{grid-column:1/-1;font-size:.82rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:30;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;padding:0}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="hrow">
    <div class="month" id="monthNav">
      <button class="icon" id="prev" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="monthTitle">November</h1>
      <button class="icon" id="next" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <h1 class="ptitle" id="pageTitle" hidden>Konten</h1>
    <button class="icon" id="settings" aria-label="Budget einstellen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="seg seg3" id="tabs" role="tablist"><button data-tab="monat">Monat</button><button data-tab="sips">Zips</button><button data-tab="konten">Konten</button></div>
  </header>
  <main id="main"></main>
  <div class="status" id="status" hidden></div>
</div>

<button class="fab" id="fab" aria-label="Neue Ausgabe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Categories: fixed order = fixed color slot (never re-colored by rank)
const OUT_CATS = [
  {id:"lebensmittel", name:"Lebensmittel", c:"--c1"},
  {id:"wohnen", name:"Wohnen & Nebenkosten", c:"--c2"},
  {id:"mobilitaet", name:"Mobilität", c:"--c3"},
  {id:"restaurant", name:"Restaurant & Café", c:"--c4"},
  {id:"freizeit", name:"Freizeit", c:"--c5"},
  {id:"gesundheit", name:"Gesundheit", c:"--c6"},
  {id:"shopping", name:"Shopping", c:"--c7"},
  {id:"abos", name:"Abos & Verträge", c:"--c8"},
  {id:"sonstiges", name:"Sonstiges", c:"--c9"},
];
const IN_CATS = [
  {id:"gehalt", name:"Gehalt", c:"--accent"},
  {id:"taschengeld", name:"Taschengeld", c:"--accent"},
  {id:"trinkgeld", name:"Trinkgeld", c:"--accent"},
  {id:"geschenk", name:"Geschenk", c:"--accent"},
  {id:"verkauf", name:"Verkauf", c:"--accent"},
  {id:"saveback", name:"Saveback", c:"--accent"},
  {id:"einnahme-sonst", name:"Sonstige Einnahme", c:"--accent"},
];
// Vordefinierte Orte, gruppiert nach der Kategorie, die beim Auswählen vorgeschlagen wird
const PLACES = {
  lebensmittel: ["REWE","EDEKA","Lidl","Aldi Süd","Aldi Nord","Kaufland","Penny","Netto","Norma","Bäckerei","Metzgerei","Wochenmarkt"],
  restaurant: ["Restaurant","Café","Imbiss","Lieferando","McDonald's","Burger King","Starbucks","Bar"],
  mobilitaet: ["Tankstelle","Aral","Shell","Deutsche Bahn","ÖPNV-Ticket","Parken","Taxi / Uber","Werkstatt"],
  shopping: ["Amazon","dm","Rossmann","Müller","IKEA","MediaMarkt / Saturn","Decathlon","Otto"],
  mode: ["Zara","Reserved","Uniqlo","H&M","Primark","Adidas","Nike","Zalando","About You","Snipes","Bershka","Pull&Bear","New Yorker","TK Maxx","C&A"],
  freizeit: ["Kino","Fitnessstudio","Konzert / Event","Urlaub / Reise","Geschenk"],
  gesundheit: ["Apotheke","Arzt","Optiker","Friseur"],
  wohnen: ["Miete","Strom","Gas / Heizung","Rundfunkbeitrag"],
  abos: ["Netflix","Spotify","Disney+","Amazon Prime","Handyvertrag","Internet","Versicherung"],
};
const placeCat = p => { for(const [c, list] of Object.entries(PLACES)) if(list.includes(p)) return c==="mode" ? "shopping" : c; return null; };
const PRESET = new Set(Object.values(PLACES).flat());
function recentPlaces(){
  const seen = new Map();
  state.entries.filter(e => e.place && !PRESET.has(e.place)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(e => { if(!seen.has(e.place)) seen.set(e.place, true); });
  return [...seen.keys()].slice(0,12);
}
const KORR = {id:"korrektur", name:"Korrektur", c:"--muted"};
const isKorr = e => e.cat==="korrektur";
const catById = id => OUT_CATS.concat(IN_CATS, [KORR]).find(c => c.id===id) || OUT_CATS[OUT_CATS.length-1];

// ---- money & dates ----
const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const money = cents => eur.format((cents||0)/100);
function parseAmount(s){
  s = String(s||"").trim().replace(/\s|€/g,"");
  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isFinite(n) && n>0 ? Math.round(n*100) : 0;
}
const toInput = cents => cents ? (cents/100).toFixed(2).replace(".",",").replace(/,00$/,"") : "";
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dayOffset = n => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d); };
const curMonth = () => iso(new Date()).slice(0,7);
function shiftMonth(m, k){ const [y,mo] = m.split("-").map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function monthName(m){ const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1,1); const n=d.toLocaleDateString("de-DE",{month:"long"}); return y===new Date().getFullYear()? n : n+" "+y; }
function fmtDay(s){
  if(s===dayOffset(0)) return "Heute";
  if(s===dayOffset(-1)) return "Gestern";
  return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"});
}

// ---- state ----
const state = { entries:[], accounts:[], settings:{budget:0}, month:curMonth(), cat:null, ready:false, tab:"monat", invYear:new Date().getFullYear() };
try { const t = localStorage.getItem("hhb.tab"); if(t==="konten"||t==="sips") state.tab = t; } catch(e){}
function parseSigned(s){
  s = String(s||"").trim().replace(/\s|€/g,"");
  const neg = /^[-−]/.test(s); s = s.replace(/^[-−+]/,"");
  if(!s) return 0;
  if(s.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s); if(!isFinite(n)) return NaN;
  return Math.round(n*100) * (neg?-1:1);
}
const toSigned = c => c ? (c<0?"-":"") + (Math.abs(c)/100).toFixed(2).replace(".",",").replace(/,00$/,"") : "";
const accOf = e => e.account || "giro";
const umschlaege = () => state.accounts.filter(a=>a.kind==="umschlag").sort((a,b)=>(a.order||0)-(b.order||0));
const konten = () => state.accounts.filter(a=>a.kind!=="ziel" && a.kind!=="umschlag").sort((a,b)=>(a.order||0)-(b.order||0));
const ziele = () => state.accounts.filter(a=>a.kind==="ziel").sort((a,b)=>(a.order||0)-(b.order||0));
const accById = id => state.accounts.find(a=>a.id===id);
const accName = id => (accById(id)||{name:"Unbekannt"}).name;
function movement(id){
  let m = 0;
  for(const e of state.entries){
    if(e.type==="transfer"){ if(e.to===id) m += e.amount; if(e.from===id) m -= e.amount; }
    else if(accOf(e)===id) m += e.type==="in" ? e.amount : -e.amount;
  }
  return m;
}
const balance = a => (a.start||0) + movement(a.id);
// Investiert: alles, was in einem Jahr auf Depot-Konten geflossen ist (Einzahlungen, Round-up, Saveback)
function investedYear(year){
  const D = new Set(state.accounts.filter(a=>a.kind==="depot").map(a=>a.id));
  const r = {manual:0, roundup:0, saveback:0, out:0, months:Array(12).fill(0)};
  const y = String(year);
  for(const e of state.entries){
    if((e.date||"").slice(0,4)!==y) continue;
    const m = Number((e.date||"").slice(5,7))-1;
    let v = 0;
    if(e.type==="transfer"){
      if(D.has(e.to) && !D.has(e.from)){ v = e.amount; if(e.auto) r.roundup += v; else r.manual += v; }
      else if(D.has(e.from) && !D.has(e.to)){ r.out += e.amount; }
    } else if(e.type==="in" && e.cat==="saveback" && D.has(accOf(e))){ v = e.amount; r.saveback += v; }
    if(v && m>=0 && m<12) r.months[m] += v;
  }
  r.total = r.manual + r.roundup + r.saveback;
  return r;
}
const KINDS = {konto:"Konto", bar:"Bargeld", depot:"Depot", ziel:"Sparziel", umschlag:"Zip"};
const KIND_ORDER = {konto:0, bar:0, depot:0, umschlag:1, ziel:2};
// Round-up (z. B. Trade Republic): Aufrundung auf den nächsten vollen Euro × Multiplikator, als Umbuchung aufs Depot
function roundupFor(amount, acc){
  if(!acc || !acc.roundup || !acc.roundupTo || !accById(acc.roundupTo)) return 0;
  return ((100 - amount % 100) % 100) * acc.roundup;
}
const childOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="transfer");
const sbOf = id => state.entries.find(e => e.auto && e.parent===id && e.type==="in");
// Saveback (z. B. Trade Republic): Prozent der Kartenzahlung als Einnahme ins Depot, mit Monatsdeckel
function savebackFor(amount, acc, date, parentId){
  if(!acc || !acc.saveback || !acc.savebackTo || !accById(acc.savebackTo)) return 0;
  const raw = Math.round(amount * acc.saveback / 100);
  const cap = acc.savebackCap || 0;
  if(!cap) return raw;
  const m = (date||"").slice(0,7);
  const used = state.entries.filter(e => e.auto && e.type==="in" && e.sbFrom===acc.id && (e.date||"").slice(0,7)===m && e.parent!==parentId).reduce((s,e)=>s+e.amount,0);
  return Math.max(0, Math.min(raw, cap - used));
}
async function syncRoundup(parentId, data){
  const child = childOf(parentId);
  const acc = data && data.type==="out" ? accById(data.account) : null;
  const amt = acc ? roundupFor(data.amount, acc) : 0;
  if(amt>0) await save("entries", child ? child.id : parentId+"-ru", {type:"transfer", auto:true, parent:parentId, from:acc.id, to:acc.roundupTo, amount:amt, date:data.date, note:"", createdAt:data.createdAt});
  else if(child) await store.del("entries", child.id);
  const sb = sbOf(parentId);
  const sv = acc ? savebackFor(data.amount, acc, data.date, parentId) : 0;
  if(sv>0) await save("entries", sb ? sb.id : parentId+"-sb", {type:"in", auto:true, parent:parentId, sbFrom:acc.id, account:acc.savebackTo, cat:"saveback", amount:sv, date:data.date, note:"", createdAt:data.createdAt});
  else if(sb) await store.del("entries", sb.id);
}
const usedBy = id => state.entries.some(e => e.type==="transfer" ? (e.from===id||e.to===id) : accOf(e)===id);

// ---- storage: only on this device ----
let store = null;
const local = {
  read(col){ try { return JSON.parse(localStorage.getItem("hhb."+col)||"{}"); } catch(e){ return {}; } },
  write(col,o){ try { localStorage.setItem("hhb."+col, JSON.stringify(o)); } catch(e){} },
};
function localStore(){
  const subs = {};
  const emit = col => { const o = local.read(col); (subs[col]||[]).forEach(cb => cb(Object.entries(o).map(([id,d])=>({id,...d})))); };
  return { kind:"local",
    sub(col,cb){ (subs[col] ||= []).push(cb); emit(col); },
    async set(col,id,data){ const o=local.read(col); o[id]=data; local.write(col,o); emit(col); },
    async del(col,id){ const o=local.read(col); delete o[id]; local.write(col,o); emit(col); } };
}
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function status(msg){ const el=$("#status"); el.textContent=msg||""; el.hidden=!msg; }

function boot(){
  store = localStore();
  if(!Object.keys(local.read("accounts")).length) local.write("accounts", {giro:{name:"Girokonto", kind:"konto", start:0, order:0}, bargeld:{name:"Bargeld", kind:"bar", start:0, order:1}});
  store.sub("accounts", rows => { state.accounts=rows; render(); });
  store.sub("entries", rows => { state.entries=rows; state.ready=true; render(); });
  store.sub("settings", rows => { const m = rows.find(r=>r.id==="main"); state.settings = m ? m : {budget:0}; render(); });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadController && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => {
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
}

// ---- render ----
function render(){
  const m = state.month;
  document.querySelectorAll("#tabs [data-tab]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tab===state.tab)));
  $("#monthNav").hidden = state.tab!=="monat"; $("#pageTitle").hidden = state.tab==="monat";
  $("#pageTitle").textContent = state.tab==="sips" ? "Zips" : "Konten";
  if(state.tab==="konten" && state.ready){ renderKonten(); return; }
  if(state.tab==="sips" && state.ready){ renderSips(); return; }
  $("#monthTitle").textContent = monthName(m);
  $("#next").disabled = m >= curMonth();
  const main = $("#main");
  if(!state.ready){ main.innerHTML = `<div class="empty">Daten werden geladen …</div>`; return; }

  const inMonth = state.entries.filter(e => (e.date||"").slice(0,7)===m);
  const outs = inMonth.filter(e => e.type!=="in" && e.type!=="transfer" && !isKorr(e));
  const ins = inMonth.filter(e => e.type==="in" && !isKorr(e));
  const spent = outs.reduce((s,e)=>s+(e.amount||0),0);
  const earned = ins.reduce((s,e)=>s+(e.amount||0),0);
  const saldo = earned - spent;
  const [whole, cents] = money(spent).replace(/\s?€/,"").split(",");

  // budget
  const budget = state.settings.budget||0;
  let budgetHtml = `<button class="linkbtn" id="setBudget">Monatsbudget festlegen</button>`;
  if(budget){
    const pct = spent/budget;
    const rest = budget - spent;
    const isCur = m===curMonth();
    const [y,mo] = m.split("-").map(Number);
    const daysLeft = isCur ? new Date(y,mo,0).getDate() - new Date().getDate() + 1 : 0;
    const perDay = isCur && rest>0 ? ` · <span>noch <b class="num">${money(Math.floor(rest/daysLeft))}</b> pro Tag</span>` : "";
    budgetHtml = `<div class="budget">
      <div class="bline"><span>Budget <b class="num">${money(budget)}</b></span><span>${rest>=0?`Übrig <b class="num pos">${money(rest)}</b>`:`Überzogen <b class="num neg">${money(-rest)}</b>`}${perDay}</span></div>
      <div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent des Budgets verbraucht"><i class="${pct>1?"over":pct>.85?"warn":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i></div>
    </div>`;
  }

  let html = reminderHtml() + `<div class="hero">
    <div><div class="label">Ausgaben im ${esc(monthName(m).split(" ")[0])}</div>
      <div class="big num">${esc(whole)}<span class="cents">,${esc(cents)} €</span></div></div>
    ${budgetHtml}
    <div class="trio">
      <div><div class="label">Einnahmen</div><div class="v num pos">${money(earned)}</div></div>
      <div><div class="label">Ausgaben</div><div class="v num">${money(spent)}</div></div>
      <div><div class="label">Saldo</div><div class="v num ${saldo<0?"neg":saldo>0?"pos":""}">${saldo>0?"+":""}${money(saldo)}</div></div>
    </div>
  </div>`;

  // categories
  const byCat = OUT_CATS.map(c => ({...c, sum: outs.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0), n: outs.filter(e=>e.cat===c.id).length}))
    .filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
  if(byCat.length){
    const max = byCat[0].sum;
    html += `<section><h2><span>Nach Kategorie</span></h2><ul class="cats">${byCat.map(c => `
      <li><button class="cat" data-cat="${c.id}" aria-pressed="${state.cat===c.id}" title="${esc(c.name)}: ${money(c.sum)}, ${c.n} Einträge">
        <span class="name"><span class="dot" style="background:var(${c.c})"></span>${esc(c.name)}</span>
        <span class="amt num">${money(c.sum)}<small>${Math.round(c.sum/spent*100)} %</small></span>
        <span class="track"><i style="width:${(c.sum/max*100).toFixed(1)}%;background:var(${c.c})"></i></span>
      </button></li>`).join("")}</ul></section>`;
  }

  // entries
  let list = inMonth.filter(e => !e.auto);
  if(state.cat) list = list.filter(e=>e.cat===state.cat);
  list.sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1));
  html += `<section><h2><span>Einträge</span><span class="num">${list.length}</span></h2>`;
  if(state.cat) html += `<div class="filter">Nur ${esc(catById(state.cat).name)} <button id="clearCat">Alle zeigen</button></div>`;
  if(!list.length){
    html += `<div class="empty"><strong>${inMonth.length? "Keine Einträge in dieser Kategorie" : "Noch keine Einträge im "+esc(monthName(m))}</strong>Tippe auf das Plus unten rechts, um eine Ausgabe einzutragen.</div>`;
  } else {
    const days = {};
    list.forEach(e => (days[e.date] ||= []).push(e));
    html += Object.keys(days).sort().reverse().map(d => {
      const daySum = days[d].reduce((s,e)=> s + ((e.type==="out"||!e.type) && !isKorr(e) ? e.amount : 0),0);
      return `<div class="day"><h3><span>${esc(fmtDay(d))}</span><span class="num">${daySum?"−"+money(daySum):""}</span></h3>
        <ul class="entries">${days[d].map(entryRow).join("")}</ul></div>`;
    }).join("");
  }
  html += `</section>`;
  main.innerHTML = html;
}
function entryRow(e){
  if(isKorr(e)){
    const pl = e.type==="in";
    return `<li><button class="entry" data-korr="${esc(e.id)}">
      <span class="badge" style="background:var(--muted)" aria-hidden="true">±</span>
      <span class="mid"><div class="t">Korrektur (Abgleich)</div><div class="s">${esc(accName(accOf(e)))} · zählt nicht als ${pl?"Einnahme":"Ausgabe"}</div></span>
      <span class="a num" style="color:var(--muted)">${pl?"+":"−"}${money(e.amount)}</span>
    </button></li>`;
  }
  if(e.type==="transfer"){
    const toKind = (accById(e.to)||{}).kind;
    const fromKind = (accById(e.from)||{}).kind;
    const label = e.auto ? "Round-up" : toKind==="umschlag" ? "In Zip gesteckt" : fromKind==="umschlag" ? "Aus Zip genommen" : ({ziel:"Zurückgelegt", bar:"Abgehoben", depot:"Investiert"})[toKind] || "Umbuchung";
    return `<li><button class="entry" data-edit="${esc(e.id)}">
      <span class="badge" style="background:var(--muted)" aria-hidden="true">⇄</span>
      <span class="mid"><div class="t">${esc(e.note || label)}</div><div class="s">${esc(accName(e.from))} → ${esc(accName(e.to))}</div></span>
      <span class="a num" style="color:var(--muted)">${money(e.amount)}</span>
    </button></li>`;
  }
  const c = catById(e.cat);
  const multi = state.accounts.length > 1;
  const isIn = e.type==="in";
  const title = e.note || e.place || c.name;
  const ru = e.type==="out" ? childOf(e.id) : null;
  const sbk = e.type==="out" ? sbOf(e.id) : null;
  return `<li><button class="entry" data-edit="${esc(e.id)}">
    <span class="badge" style="background:var(${c.c})" aria-hidden="true">${esc(c.name.slice(0,2))}</span>
    <span class="mid"><div class="t">${esc(title)}</div>${(e.note||e.place||multi||ru||sbk)?`<div class="s">${esc([(e.note||e.place)?c.name:"", e.note&&e.place?e.place:"", multi?accName(accOf(e)):"", ru?"Round-up "+money(ru.amount):"", sbk?"Saveback +"+money(sbk.amount):""].filter(Boolean).join(" · "))}</div>`:""}</span>
    <span class="a num ${isIn?"pos":""}">${isIn?"+":"−"}${money(e.amount)}</span>
  </button></li>`;
}

// ---- toast ----
let toastTimer;
function toast(msg, undo){
  const el=$("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button id="undo">Rückgängig</button>':""}`;
  el.hidden=false;
  if(undo) $("#undo").onclick = () => { undo(); el.hidden=true; };
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,4000);
}
async function save(col,id,data){
  try { await store.set(col,id,data); }
  catch(e){ toast(e && e.code==="quota_exceeded" ? "Speicher voll. Lösche alte Einträge." : "Speichern fehlgeschlagen. Versuch es nochmal."); throw e; }
}

  };
  const splitOn = () => !entry && d.type==="in" && umschlaege().length>0 && (accById(d.account)||{}).kind!=="umschlag";
  const splits = () => splitOn() ? [...document.querySelectorAll("[data-split]")].map(i=>({to:i.dataset.split, amount:parseAmount(i.value)})).filter(x=>x.amount>0) : [];
  const splitSum = () => splits().reduce((s,x)=>s+x.amount,0);
  const valid = () => parseAmount($("#fAmount").value)>0 && splitSum() <= parseAmount($("#fAmount").value) && d.date && (d.type==="transfer" ? (d.from && d.to && d.from!==d.to && accById(d.from) && accById(d.to)) : (d.cat && accById(d.account||"giro")));
  const sync = () => {
    drawAcc();
    document.querySelectorAll("#fType [data-type]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.type===d.type)));
    document.querySelectorAll("#fCat [data-cat]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.cat===d.cat)));
    document.querySelectorAll("#fDate [data-date]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.date===d.date)));
    $("#dateCustom").setAttribute("aria-pressed", String(!dateChips.some(([,v])=>v===d.date)));
    $("#fDateIn").value = d.date;
    $("#ok").disabled = !valid();
    $("#splitBox").hidden = !splitOn();
    if(splitOn()){
      const total = parseAmount($("#fAmount").value), used = splitSum(), rest = total - used;
      $("#splitRest").innerHTML = rest < 0 ? `<span class="neg">Du hast <b class="neg">${money(-rest)}</b> mehr verteilt, als reinkommt.</span>`
        : used ? `Noch frei: <b class="num">${money(rest)}</b>, bleibt auf ${esc(accName(d.account))}` : `Optional. Was du nicht verteilst, bleibt auf ${esc(accName(d.account))}.`;
    }
    const ra = d.type==="out" ? accById(d.account) : null, rv = ra ? roundupFor(parseAmount($("#fAmount").value), ra) : 0;
    const sv = ra ? savebackFor(parseAmount($("#fAmount").value), ra, d.date, entry&&entry.id) : 0;
    $("#ruHint").hidden = !rv && !sv;
    $("#ruHint").textContent = [rv?`Round-up: ${money(rv)} aufs ${accName(ra.roundupTo)}`:"", sv?`Saveback: +${money(sv)} aufs ${accName(ra.savebackTo)}`:""].filter(Boolean).join(" · ");
  };
  const CUSTOM = "__custom__";
  const recent = recentPlaces();
  const opt = p => `<option value="${esc(p)}">${esc(p)}</option>`;
  $("#fPlace").innerHTML = `<option value="">– kein Ort –</option>`
    + (recent.length ? `<optgroup label="Zuletzt genutzt">${recent.map(opt).join("")}</optgroup>` : "")
    + OUT_CATS.filter(c=>PLACES[c.id]).map(c => `<optgroup label="${esc(c.name)}">${PLACES[c.id].map(opt).join("")}</optgroup>` + (c.id==="shopping" ? `<optgroup label="Mode &amp; Schuhe">${PLACES.mode.map(opt).join("")}</optgroup>` : "")).join("")
    + `<option value="${CUSTOM}">Eigener Ort …</option>`;
  $("#fPlace").value = d.place || "";
  $("#fPlace").onchange = e => {
    const v = e.target.value;
    $("#fPlaceIn").hidden = v!==CUSTOM;
    if(v===CUSTOM){ d.place = ""; $("#fPlaceIn").value = ""; $("#fPlaceIn").focus(); return; }
    d.place = v;
    const pc = placeCat(v);
    if(pc && (!d.cat || !entry)) { d.cat = pc; sync(); }
  };
  $("#fPlaceIn").oninput = e => { d.place = e.target.value.trim(); };
  drawCats(); sync();
  $("#fType").onclick = e => { const b=e.target.closest("[data-type]"); if(b){ d.type=b.dataset.type; if(d.type==="transfer"){ d.from ||= d.account||k0; } else { d.account ||= d.from||k0; drawCats(); } sync(); } };
  $("#fAcc").onclick = e => { const b=e.target.closest("[data-acc]"); if(b){ d.account=b.dataset.acc; sync(); } };
  const manage = e => {
    const nf = e.target.closest("[data-newfor]");
    if(nf){ na.slot = nf.dataset.newfor; $("#naSlot").textContent = na.slot==="from" ? "Von" : "Nach"; $("#naName").value = ""; $("#newAcc").hidden = false; syncNa(); $("#naName").focus(); return true; }
    if(e.target.closest("[data-editacc]")){ editAcc = true; $("#newAcc").hidden = true; sync(); return true; }
    if(e.target.closest("[data-editdone]")){ editAcc = false; $("#trWarn").hidden = true; sync(); return true; }
    const del = e.target.closest("[data-delacc]");
    if(del){
      const a = accById(del.dataset.delacc), w = $("#trWarn");
      if(!a) return true;
      if(usedBy(a.id)){ w.textContent = `„${a.name}“ hat noch Buchungen und kann nicht gelöscht werden. Lösch zuerst die Buchungen oder lass es einfach stehen.`; w.hidden = false; return true; }
      if(a.kind!=="ziel" && a.kind!=="umschlag" && konten().length<2){ w.textContent = "Mindestens ein Konto muss bleiben."; w.hidden = false; return true; }
      const {id, ...data} = a;
      store.del("accounts", id).then(() => { if(d.from===id) d.from=null; if(d.to===id) d.to=null; if(d.account===id) d.account=k0; w.hidden = true; sync(); toast(`„${a.name}“ gelöscht`, () => save("accounts", id, data).then(sync)); });
      return true;
    }
    return false;
  };
  const syncNa = () => { document.querySelectorAll("#naKind [data-nakind]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.nakind===na.kind))); $("#naOk").disabled = !$("#naName").value.trim(); };
  $("#naName").oninput = syncNa;
  $("#naKind").onclick = e => { const b=e.target.closest("[data-nakind]"); if(b){ na.kind=b.dataset.nakind; syncNa(); } };
  $("#naCancel").onclick = () => { $("#newAcc").hidden = true; };
  $("#naOk").onclick = async () => {
    const name = $("#naName").value.trim(); if(!name) return;
    const id = newId();
    try { await save("accounts", id, {name, kind:na.kind, start:0, order:Date.now()}); } catch(e){ return; }
    if(na.slot==="from"){ d.from = id; if(d.to===id) d.to=null; } else { d.to = id; if(d.from===id) d.from=null; }
    $("#newAcc").hidden = true; sync(); toast(`„${name}“ angelegt`);
  };
  $("#fFrom").onclick = e => { if(manage(e)) return; const b=e.target.closest("[data-from]"); if(b){ d.from=b.dataset.from; if(d.to===d.from) d.to=null; sync(); } };
  $("#fTo").onclick = e => { if(manage(e)) return; const b=e.target.closest("[data-to]"); if(b){ d.to=b.dataset.to; if(d.from===d.to) d.from=null; sync(); } };
  $("#fCat").onclick = e => { const b=e.target.closest("[data-cat]"); if(b){ d.cat=b.dataset.cat;
    if(!entry && d.type==="in" && ["trinkgeld","taschengeld","geschenk"].includes(d.cat)){ const bar = konten().find(a=>a.kind==="bar"); if(bar) d.account = bar.id; }
    sync(); } };
  document.querySelectorAll("[data-split]").forEach(i => i.oninput = sync);
  $("#fDate").onclick = e => { const b=e.target.closest("[data-date]"); if(b){ d.date=b.dataset.date; sync(); } };
  $("#fDateIn").onchange = e => { if(e.target.value){ d.date=e.target.value; } sync(); };
  $("#fAmount").oninput = sync;
  $("#cancel").onclick = closeSheet;
  const submit = async () => {
    const amount = parseAmount($("#fAmount").value);
    if(!valid()) return;
    const id = entry ? entry.id : newId();
    const base = {type:d.type, amount, date:d.date, note:$("#fNote").value.trim(), createdAt: entry ? (entry.createdAt||Date.now()) : Date.now()};
    const data = d.type==="transfer" ? {...base, from:d.from, to:d.to} : {...base, cat:d.cat, account:d.account||"giro"};
    if(d.type==="out" && d.place) data.place = d.place;
    const sp = splits();
    closeSheet();
    try { await save("entries", id, data); await syncRoundup(id, data);
      for(const x of sp) await save("entries", newId(), {type:"transfer", amount:x.amount, from:data.account, to:x.to, date:data.date, note:"", split:id, createdAt:Date.now()});
      if(!entry){ toast(sp.length ? `Einnahme eingetragen, ${money(sp.reduce((s,x)=>s+x.amount,0))} auf ${sp.length} Zip${sp.length>1?"s":""} verteilt` : ({in:"Einnahme",out:"Ausgabe",transfer:"Umbuchung"})[d.type]+" eingetragen: "+money(amount)); if(d.date.slice(0,7)!==state.month){ state.month=d.date.slice(0,7); render(); } } } catch(e){}
  };
  $("#ok").onclick = submit;
  $("#fNote").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); submit(); } };
  if(entry) $("#del").onclick = async () => {
    const {id, ...data} = entry; const kids = [childOf(id), sbOf(id)].filter(Boolean); closeSheet();
    try {
      await store.del("entries", id); for(const k of kids) await store.del("entries", k.id);
      toast("Gelöscht", async () => { await save("entries", id, data); for(const k of kids){ const {id:cid, ...cd} = k; await save("entries", cid, cd); } });
    } catch(e){ toast("Löschen fehlgeschlagen."); }
  };
  if(!entry) setTimeout(()=>$("#fAmount").focus(), 60);
}

// ---- Konten & Sparziele ----
function renderKonten(){
  const ks = konten(), zs = ziele(), us = umschlaege();
  const onAcc = ks.reduce((s,a)=>s+balance(a),0), inGoals = zs.reduce((s,a)=>s+balance(a),0), inEnv = us.reduce((s,a)=>s+balance(a),0);
  const total = onAcc + inGoals + inEnv;
  const [whole, cents] = money(Math.abs(total)).replace(/\s?€/,"").split(",");
  let html = reminderHtml() + `<div class="hero">
    <div><div class="label">Gesamtvermögen</div><div class="big num ${total<0?"neg":""}">${total<0?"−":""}${esc(whole)}<span class="cents">,${esc(cents)} €</span></div></div>
    <div class="trio">
      <div><div class="label">Konten</div><div class="v num">${money(onAcc)}</div></div>
      <div><div class="label">Zips</div><div class="v num">${money(inEnv)}</div></div>
      <div><div class="label">Sparziele</div><div class="v num pos">${money(inGoals)}</div></div>
    </div></div>`;
  html += `<section><h2><span>Konten</span></h2><ul class="accs">${ks.map(a => {
    const b = balance(a);
    return `<li><button class="acc" data-account="${esc(a.id)}"><span class="mid"><div class="t">${esc(a.name)}</div><div class="s">${esc(KINDS[a.kind||"konto"])}${a.roundup&&a.roundupTo?` · Round-up ${a.roundup}×`:""}${a.saveback&&a.savebackTo?` · Saveback ${String(a.saveback).replace(".",",")} %`:""}${(a.roundup||a.saveback)&&(a.roundupTo||a.savebackTo)?` → ${esc(accName(a.roundupTo||a.savebackTo))}`:""}</div></span><span class="a num ${b<0?"neg":""}">${money(b)}</span></button></li>`;
  }).join("")}</ul>
  <div class="addrow"><button class="addbtn" id="addKonto">+ Konto</button><button class="addbtn" id="addTransfer">Umbuchen</button>${ks.some(a=>a.kind==="bar")?`<button class="addbtn" id="withdraw">Abheben</button>`:""}${ks.some(a=>a.kind==="depot")?`<button class="addbtn" id="invest">Investieren</button>`:""}<button class="addbtn" id="checkAcc">Kontostände prüfen</button></div></section>`;

  if(ks.some(a=>a.kind==="depot")){
    const Y = state.invYear, now = new Date().getFullYear();
    const years = state.entries.map(e=>Number((e.date||"").slice(0,4))).filter(Boolean);
    const minY = Math.min(now, ...years);
    const r = investedYear(Y), mx = Math.max(...r.months, 1);
    const ML = ["J","F","M","A","M","J","J","A","S","O","N","D"];
    html += `<section><h2><span>Investiert</span></h2><div class="inv">
      <div class="yr"><button data-invyear="${Y-1}" ${Y<=minY?"disabled":""} aria-label="Vorheriges Jahr">‹</button><b>${Y}</b><button data-invyear="${Y+1}" ${Y>=now?"disabled":""} aria-label="Nächstes Jahr">›</button></div>
      <div class="tot"><div class="label">In ${Y} ins Depot eingezahlt</div><div class="v num">${money(r.total)}</div></div>
      <div class="parts">
        <div><span>Selbst eingezahlt</span><b class="num">${money(r.manual)}</b></div>
        <div><span>Round-up</span><b class="num">${money(r.roundup)}</b></div>
        <div><span>Saveback</span><b class="num">${money(r.saveback)}</b></div>
        ${r.out?`<div><span>Aus dem Depot entnommen</span><b class="num neg">−${money(r.out)}</b></div><div><span>Netto investiert</span><b class="num">${money(r.total-r.out)}</b></div>`:""}
      </div>
      <div class="months" role="img" aria-label="Einzahlungen pro Monat">${r.months.map(v=>`<i class="${v?"":"z"}" style="height:${v?Math.max(4,v/mx*100):3}%"></i>`).join("")}</div>
      <div class="mlab">${ML.map(l=>`<span>${l}</span>`).join("")}</div>
    </div></section>`;
  }

  html += `<section><h2><span>Sparziele</span></h2>`;
  if(!zs.length) html += `<div class="empty" style="padding:24px 16px"><strong>Noch kein Sparziel</strong>Leg zum Beispiel „Urlaub“ mit 1.500 € an und leg nach und nach Geld zurück.</div>`;
  html += `<div class="goals">${zs.map(a => {
    const b = balance(a), t = a.target||0, pct = t ? Math.max(0,Math.min(1,b/t)) : 0;
    return `<div class="goal">
      <div class="top"><button class="name" data-account="${esc(a.id)}">${esc(a.name)}</button><span class="of num"><b>${money(b)}</b>${t?` von ${money(t)}`:""}</span></div>
      ${t?`<div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent erreicht"><i style="width:${(pct*100).toFixed(1)}%"></i></div>`:""}
      <div class="foot"><span>${t ? (b>=t ? "Ziel erreicht" : `Noch ${money(t-b)} · ${Math.round(pct*100)} %`) : "Ohne Zielbetrag"}</span><button class="put" data-put="${esc(a.id)}">Zurücklegen</button></div>
    </div>`;
  }).join("")}</div>
  <div class="addrow"><button class="addbtn" id="addZiel">+ Sparziel</button></div></section>`;
  html += `<section><h2><span>Sicherung</span></h2><p class="hint" style="margin:0 0 4px">${esc(lastBackupText().trim())}</p><div class="addrow"><button class="addbtn" id="backupNow">Sicherung speichern</button><button class="addbtn" id="impBtn">Sicherung laden</button></div></section>`;
  $("#main").innerHTML = html;
}

// ---- Sips (Bargeld-Zips) ----
function renderSips(){
  const us = umschlaege();
  const inEnv = us.reduce((s,a)=>s+balance(a),0);
  const bar = konten().filter(a=>a.kind==="bar");
  const free = bar.reduce((s,a)=>s+balance(a),0);
  const [whole, cents] = money(Math.abs(inEnv)).replace(/\s?€/,"").split(",");
  let html = reminderHtml() + `<div class="hero">
    <div><div class="label">In allen Zips</div><div class="big num">${inEnv<0?"−":""}${esc(whole)}<span class="cents">,${esc(cents)} €</span></div></div>
    <div class="trio" style="grid-template-columns:1fr 1fr">
      <div><div class="label">Bargeld noch frei</div><div class="v num ${free<0?"neg":""}">${money(free)}</div></div>
      <div><div class="label">Bargeld gesamt</div><div class="v num">${money(free+inEnv)}</div></div>
    </div>
    <p class="hint">„Befüllen“ nimmt Geld aus deinem Bargeld, „Rausnehmen“ legt es zurück. Ausgaben bezahlst du direkt aus einem Zip, indem du ihn beim Eintragen als Konto wählst. Tipp auf einen Namen, um den Zip umzubenennen oder zu löschen.</p>
  </div>`;
  html += `<section><h2><span>Deine Zips</span><span class="num">${us.length}</span></h2>`;
  if(!us.length) html += `<div class="empty" style="padding:20px 16px"><strong>Noch keine Zips</strong>Für dein Bargeld im Budgetplaner. Leg los mit einem Tipp:</div>
    <div class="chips" style="justify-content:center">${["Urlaub","Auto","Rückzahlung","Geschenke","Lebensmittel","Notgroschen"].map(n=>`<button class="chip" data-newenv="${n}">+ ${n}</button>`).join("")}</div>`;
  html += `<div class="goals">${us.map(a => {
    const b = balance(a), t = a.target||0, pct = t ? Math.max(0,Math.min(1,b/t)) : 0;
    return `<div class="goal">
      <div class="top"><button class="name" data-account="${esc(a.id)}">✉ ${esc(a.name)}</button><span class="of num"><b class="${b<0?"neg":""}">${money(b)}</b>${t?` von ${money(t)}`:""}</span></div>
      ${t?`<div class="bar" role="img" aria-label="${Math.round(pct*100)} Prozent gefüllt"><i style="width:${(pct*100).toFixed(1)}%"></i></div>`:""}
      <div class="foot"><button class="put" style="background:none;padding-left:0;color:var(--muted)" data-take="${esc(a.id)}">Rausnehmen</button><button class="put" data-fill="${esc(a.id)}">Befüllen</button></div>
    </div>`;
  }).join("")}</div>
  <div class="addrow"><button class="addbtn" id="addEnv">+ Zip</button></div></section>`;
  if(us.length){
    const ids = new Set(us.map(a=>a.id));
    const moves = state.entries.filter(e => e.type==="transfer" ? (ids.has(e.from)||ids.has(e.to)) : ids.has(accOf(e)))
      .sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1)).slice(0,15);
    html += `<section><h2><span>Letzte Bewegungen</span></h2>`;
    html += moves.length ? `<ul class="entries">${moves.map(entryRow).join("")}</ul>` : `<p class="hint">Noch keine Bewegungen. Tipp bei einem Zip auf „Befüllen“.</p>`;
    html += `</section>`;
  }
  $("#main").innerHTML = html;
}

function accountSheet(acc, kind, presetName){
  kind = acc ? (acc.kind||"konto") : kind;
  const isEnv = kind==="umschlag";
  const isZiel = kind==="ziel" || isEnv;
  const word = isEnv ? "Zip" : kind==="ziel" ? "Sparziel" : "Konto";
  const r = {kind, roundup: acc&&acc.roundup||0, roundupTo: acc&&(acc.roundupTo||acc.savebackTo)||null, saveback: acc&&acc.saveback||0};
  const targets = () => state.accounts.filter(a => (a.kind==="depot"||a.kind==="ziel") && (!acc || a.id!==acc.id));
  const cur = acc ? balance(acc) : 0;
  openSheet(`
    <div class="sheet-head"><button class="txt" id="cancel">Abbrechen</button><h3 id="sheetTitle">${acc?word:(isEnv?"Neuer ":"Neues ")+word}</h3><span style="min-width:80px"></span></div>
    <input class="input" id="aName" placeholder="${isEnv?"Name, z. B. Auto oder Geschenke":isZiel?"Name, z. B. Urlaub":"Name, z. B. Trade Republic oder Tagesgeld"}" value="${esc(acc?acc.name:(presetName||""))}" autocomplete="off">
    ${isZiel?`<div><div class="label" style="margin-bottom:6px">${isEnv?"Zielbetrag (optional)":"Zielbetrag"}</div><input class="input num" id="aTarget" inputmode="decimal" placeholder="z. B. 1.500" value="${esc(toInput(acc&&acc.target||0))}" autocomplete="off"></div>`:""}
    <div><div class="label" style="margin-bottom:6px">${isEnv?"Aktuell im Zip":isZiel?"Schon angespart":acc?"Aktueller Kontostand":"Anfangsbestand (heutiger Kontostand)"}</div><input class="input num" id="aBal" inputmode="decimal" placeholder="0" value="${esc(toSigned(cur))}" autocomplete="off"></div>
    <p class="sublabel">${isEnv?"Ab jetzt steckst du Geld mit „Befüllen“ rein. Ausgaben kannst du direkt aus dem Zip bezahlen.":isZiel?"Weiteres Geld legst du über „Zurücklegen“ dazu.":acc?`Anfangsbestand: ${money(acc.start||0)}. Änderst du den Stand hier, wird der Anfangsbestand angepasst. Für Abweichungen im Alltag lieber „Kontostände prüfen“ nutzen, dann bleibt die Differenz sichtbar.`:"Ab jetzt rechnet die App den Stand mit deinen Einträgen weiter. Minus für Dispo, z. B. -250."}</p>
    ${isZiel?"":`<div><div class="label" style="margin-bottom:6px">Art</div><div class="chips" id="aKind">${["konto","bar","depot"].map(k=>`<button class="chip" data-kind="${k}">${KINDS[k]}</button>`).join("")}</div></div>
    <div id="ruBox"><div class="label" style="margin-bottom:6px">Round-up</div>
      <p class="sublabel" style="margin:0 0 8px">Jede Ausgabe von diesem Konto wird auf den nächsten Euro aufgerundet, die Differenz mal Faktor geht aufs Depot. Beispiel bei 10×: 0,85 € Kauf ergibt 1,50 €.</p>
      <div class="chips" id="aMult">${[0,1,2,3,5,10].map(m=>`<button class="chip" data-mult="${m}">${m?m+"×":"Aus"}</button>`).join("")}</div>
      <div class="label" style="margin:14px 0 6px">Saveback</div>
      <p class="sublabel" style="margin:0 0 8px">Ein Teil jeder Kartenzahlung kommt als Einnahme aufs Depot zurück. Bei Trade Republic z. B. 1 %, höchstens 15 € im Monat.</p>
      <div class="chips" id="aSb"><button class="chip" data-sb="0">Aus</button><button class="chip" data-sb="1">An</button></div>
      <div id="sbBox" class="row" style="margin-top:8px">
        <label style="flex:1"><span class="label">Prozent</span><input class="input num" id="aSbPct" inputmode="decimal" value="${esc(String(acc&&acc.saveback||1).replace(".",","))}" autocomplete="off" style="margin-top:4px"></label>
        <label style="flex:1"><span class="label">Max. pro Monat (€)</span><input class="input num" id="aSbCap" inputmode="decimal" value="${esc(toInput(acc&&acc.savebackCap!=null?acc.savebackCap:1500))}" placeholder="kein Limit" autocomplete="off" style="margin-top:4px"></label>
      </div>
      <div id="ruTo" style="margin-top:10px"></div></div>`}
    <p class="warnmsg" id="aWarn" hidden></p>
    <div class="row">${acc?`<button class="danger" id="del">Löschen</button>`:""}<button class="primary" id="ok">${acc?"Speichern":"Anlegen"}</button></div>
  `);
  const sync = () => {
    if(!isZiel && (r.roundup||r.saveback) && !r.roundupTo){ const ts0 = targets(); if(ts0.length===1) r.roundupTo = ts0[0].id; }
    $("#ok").disabled = !$("#aName").value.trim() || isNaN(parseSigned($("#aBal").value)) || (!isZiel && r.kind==="konto" && (r.roundup>0 || r.saveback) && !r.roundupTo);
    if(isZiel) return;
    document.querySelectorAll("#aKind [data-kind]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.kind===r.kind)));
    $("#ruBox").hidden = r.kind!=="konto";
    document.querySelectorAll("#aMult [data-mult]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.mult===r.roundup)));
    document.querySelectorAll("#aSb [data-sb]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.sb===(r.saveback?1:0))));
    $("#sbBox").hidden = !r.saveback;
    const ts = targets();
    $("#ruTo").innerHTML = !(r.roundup||r.saveback) ? "" : ts.length
      ? `<div class="label" style="margin-bottom:6px">Investieren auf</div><div class="chips">${ts.map(a=>`<button class="chip" data-rto="${esc(a.id)}" aria-pressed="${a.id===r.roundupTo}">${esc(a.name)}</button>`).join("")}</div>`
      : `<p class="warnmsg">Leg zuerst ein Konto der Art „Depot“ an, z. B. „Trade Republic Depot“.</p>`;
  };
  sync(); $("#aName").oninput = sync; $("#aBal").oninput = sync;
  if(!isZiel){
    $("#aKind").onclick = e => { const b=e.target.closest("[data-kind]"); if(b){ r.kind=b.dataset.kind; sync(); } };
    $("#aMult").onclick = e => { const b=e.target.closest("[data-mult]"); if(b){ r.roundup=+b.dataset.mult; sync(); } };
    $("#aSb").onclick = e => { const b=e.target.closest("[data-sb]"); if(b){ r.saveback = +b.dataset.sb ? 1 : 0; sync(); } };
    $("#ruTo").onclick = e => { const b=e.target.closest("[data-rto]"); if(b){ r.roundupTo=b.dataset.rto; sync(); } };
  }
  $("#cancel").onclick = closeSheet;
  $("#ok").onclick = async () => {
    const name = $("#aName").value.trim(); const want = parseSigned($("#aBal").value);
    if(!name || isNaN(want)) return;
    const id = acc ? acc.id : newId();
    const data = {name, kind: r.kind, start: want - (acc ? movement(acc.id) : 0), order: acc ? (acc.order||0) : Date.now()};
    if(r.kind==="konto" && r.roundup && r.roundupTo){ data.roundup = r.roundup; data.roundupTo = r.roundupTo; }
    if(r.kind==="konto" && r.saveback && r.roundupTo){
      const pct = Number(String($("#aSbPct").value).replace(",",".")); 
      data.saveback = isFinite(pct) && pct>0 ? pct : 1; data.savebackCap = parseAmount($("#aSbCap").value); data.savebackTo = r.roundupTo;
    }
    if(isZiel) data.target = parseAmount($("#aTarget").value);
    closeSheet();
    try { await save("accounts", id, data); toast(acc ? "Gespeichert" : word+" angelegt"); } catch(e){}
  };
  if(acc) $("#del").onclick = async () => {
    const w = $("#aWarn");
    if(usedBy(acc.id)){ w.textContent = "Hier hängen noch Buchungen dran. Lösch oder ändere sie zuerst, dann kannst du "+(isEnv?"den Zip":isZiel?"das Sparziel":"das Konto")+" löschen."; w.hidden=false; return; }
    if(!isZiel && konten().length<2){ w.textContent = "Mindestens ein Konto muss bleiben."; w.hidden=false; return; }
    const {id, ...data} = acc; closeSheet();
    try { await store.del("accounts", id); toast("Gelöscht", () => save("accounts", id, data)); } catch(e){ toast("Löschen fehlgeschlagen."); }
  };
}

// ---- Monatlicher Kontostand-Abgleich ----
const checkAccs = () => konten().filter(a=>a.kind!=="depot").concat(umschlaege());
function checkSheet(){
  const accs = checkAccs();
  openSheet(`
    <div class="sheet-head"><button class="txt" id="cancel">Abbrechen</button><h3 id="sheetTitle">Abgleich</h3><span style="min-width:80px"></span></div>
    <p class="hint">Schau in deine Bank-App und zähl dein Bargeld. Trag nur ein, wo der echte Stand anders ist. Leere Felder heißen „stimmt“.</p>
    <div class="chk">${accs.map(a=>`<div class="chkrow"><span class="n">${a.kind==="umschlag"?"✉ ":""}${esc(a.name)}</span><span class="app">In der App: ${money(balance(a))}</span>
      <input class="input num" data-chk="${esc(a.id)}" inputmode="decimal" placeholder="${esc(toSigned(balance(a))||"0")}" autocomplete="off" aria-label="Echter Stand ${esc(a.name)}">
      <p class="df" data-df="${esc(a.id)}"></p></div>`).join("")}</div>
    <div class="row"><button class="primary" id="ok">Alles stimmt</button></div>
  `);
  const diffs = () => accs.map(a => { const inp = document.querySelector(`[data-chk="${a.id}"]`); const v = inp.value.trim(); const real = v ? parseSigned(v) : NaN; return {a, d: isNaN(real) ? 0 : real - balance(a), bad: !!v && isNaN(real)}; });
  const sync = () => {
    const ds = diffs(); let n = 0;
    for(const {a,d,bad} of ds){
      const el = document.querySelector(`[data-df="${a.id}"]`);
      el.textContent = bad ? "Bitte eine Zahl eingeben" : d ? `Differenz ${d>0?"+":"−"}${money(Math.abs(d))}` : "";
      el.style.color = bad||d<0 ? "var(--danger)" : "var(--ink)";
      if(d) n++;
    }
    $("#ok").textContent = n ? `${n} Korrektur${n>1?"en":""} buchen` : "Alles stimmt";
    $("#ok").disabled = ds.some(x=>x.bad);
  };
  document.querySelectorAll("[data-chk]").forEach(i => i.oninput = sync);
  $("#cancel").onclick = closeSheet;
  $("#ok").onclick = async () => {
    const ds = diffs().filter(x=>x.d); const today = iso(new Date()); const now = Date.now();
    closeSheet();
    try {
      for(const {a,d} of ds) await save("entries", newId(), {type: d>0?"in":"out", cat:"korrektur", amount: Math.abs(d), account:a.id, date:today, note:"", createdAt:now});
      try { localStorage.setItem("hhb.lastCheck", curMonth()); localStorage.removeItem("hhb.checkSnooze"); } catch(_){}
      toast(ds.length ? `${ds.length} Korrektur${ds.length>1?"en":""} gebucht` : "Super, alles stimmt"); render();
    } catch(e){}
  };
}
function korrSheet(x){
  const pl = x.type==="in";
  openSheet(`
    <div class="sheet-head"><button class="txt" id="cancel">Schließen</button><h3 id="sheetTitle">Korrektur</h3><span style="min-width:80px"></span></div>
    <p class="hint">${pl?"+":"−"}${money(x.amount)} auf ${esc(accName(accOf(x)))} vom ${esc(new Date(x.date+"T12:00").toLocaleDateString("de-DE"))}. Entstanden beim Kontostand-Abgleich, damit die App wieder mit dem echten Stand übereinstimmt. Zählt nicht als Einnahme oder Ausgabe.</p>
    <div class="row"><button class="danger" id="del" style="flex:1">Korrektur löschen</button></div>
  `);
  $("#cancel").onclick = closeSheet;
  $("#del").onclick = async () => { const {id, ...data} = x; closeSheet(); try { await store.del("entries", id); toast("Gelöscht", () => save("entries", id, data)); } catch(e){} };
}

function budgetSheet(){
  openSheet(`
    <div class="sheet-head"><button class="txt" id="cancel">Abbrechen</button><h3 id="sheetTitle">Monatsbudget</h3><span style="min-width:80px"></span></div>
    <p class="hint">Wie viel willst du pro Monat höchstens ausgeben? Leer lassen, um kein Budget anzuzeigen.</p>
    <label class="amount"><input id="fBudget" inputmode="decimal" placeholder="0" value="${esc(toInput(state.settings.budget||0))}" aria-label="Budget in Euro" autocomplete="off"><span>€</span></label>
    <div class="row"><button class="primary" id="ok">Speichern</button></div>
    <div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px">
      <div class="label">Datensicherung</div>
      <p class="hint">Deine Einträge liegen nur auf diesem Gerät. Sichere sie ab und zu als Datei, z. B. in iCloud Drive.${lastBackupText()}</p>
      <div class="row"><button class="danger" style="color:var(--ink);flex:1" id="exp">Sicherung speichern</button><button class="danger" style="color:var(--ink);flex:1" id="imp">Sicherung laden</button></div>
      <button class="danger" style="color:var(--ink)" id="csv">Als Tabelle (CSV) exportieren</button>
      
      <p class="hint" style="text-align:center">Version ${APP_VERSION}</p>
    </div>
  `);
  $("#cancel").onclick = closeSheet;
  $("#exp").onclick = exportBackup;
  $("#csv").onclick = exportCsv;
  $("#imp").onclick = pickBackup;
  $("#ok").onclick = async () => {
    const budget = parseAmount($("#fBudget").value);
    closeSheet();
    try { await save("settings","main",{budget}); toast(budget ? "Budget gespeichert" : "Budget entfernt"); } catch(e){}
  };
  setTimeout(()=>$("#fBudget").focus(), 60);
}

// ---- backup reminder (every 14 days) ----
const APP_VERSION = "2.2 (22.11.2026)";
const REMIND_DAYS = 14, DAY = 864e5;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function checkHtml(){
  if(!state.entries.length || lsGet("hhb.lastCheck")===curMonth()) return "";
  if(+(lsGet("hhb.checkSnooze")||0) > Date.now()) return "";
  return `<div class="remind" role="status"><span>Neuer Monat: Stimmen deine Kontostände und dein Bargeld noch?</span><button class="later" id="checkLater">Später</button><button class="go" id="checkNow">Jetzt prüfen</button></div>`;
}
function reminderHtml(){ return checkHtml() + backupHtml(); }
function backupHtml(){
  if(!state.entries.length) return "";
  const now = Date.now();
  if(+(lsGet("hhb.snooze")||0) > now) return "";
  const last = +(lsGet("hhb.lastBackup")||0);
  const since = last || Math.min(...state.entries.map(e => e.createdAt||now));
  const days = Math.floor((now - since)/DAY);
  if(days < REMIND_DAYS) return "";
  const msg = last ? `Letzte Sicherung vor ${days} Tagen.` : `Du hast deine Einträge noch nie gesichert.`;
  return `<div class="remind" role="status"><span>${msg} Speichere jetzt eine Kopie in iCloud Drive.</span><button class="later" id="snooze">Später</button><button class="go" id="backupNow">Jetzt sichern</button></div>`;
}

// ---- backup ----
function lastBackupText(){ try { const t = localStorage.getItem("hhb.lastBackup"); return t ? " Letzte Sicherung: "+new Date(+t).toLocaleDateString("de-DE")+"." : " Noch keine Sicherung gemacht."; } catch(e){ return ""; } }
async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  const file = new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return true; } catch(e){ if(e && e.name==="AbortError") return false; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000); return true;
}
async function exportBackup(){
  const data = {app:"haushaltsbuch", version:1, exportedAt:new Date().toISOString(), entries: local.read("entries"), accounts: local.read("accounts"), settings: local.read("settings")};
  if(await saveFile("haushaltsbuch-"+iso(new Date())+".json", JSON.stringify(data,null,1), "application/json")){
    try { localStorage.setItem("hhb.lastBackup", String(Date.now())); } catch(e){}
    toast("Sicherung erstellt"); render();
  }
}
async function exportCsv(){
  const eurStr = c => (c/100).toFixed(2).replace(".",",");
  const rows = [["Datum","Art","Kategorie","Ort","Konto","Nach Konto","Betrag","Notiz"]].concat(
    state.entries.slice().sort((a,b)=>a.date<b.date?-1:1).map(e => e.type==="transfer"
      ? [e.date, "Umbuchung", "", "", accName(e.from), accName(e.to), eurStr(e.amount), e.note||""]
      : [e.date, e.type==="in"?"Einnahme":"Ausgabe", catById(e.cat).name, e.place||"", accName(accOf(e)), "", eurStr((e.type==="in"?1:-1)*e.amount), e.note||""]));
  const csv = "\ufeff"+rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  if(await saveFile("haushaltsbuch-"+iso(new Date())+".csv", csv, "text/csv")) toast("Tabelle exportiert");
}
const DEFAULT_ACCS = () => ({giro:{name:"Girokonto", kind:"konto", start:0, order:0}, bargeld:{name:"Bargeld", kind:"bar", start:0, order:1}});
const asMap = x => Array.isArray(x) ? Object.fromEntries(x.filter(e=>e&&e.id).map(({id,...r})=>[id,r])) : (x && typeof x==="object" ? x : {});
// Sicherung einlesen (auch ältere Versionen: ohne Konten, Einträge ohne Konto = Girokonto)
function parseBackup(text){
  const d = JSON.parse(text);
  if(!d || d.app!=="haushaltsbuch" || typeof d.entries!=="object") throw 0;
  const entries = asMap(d.entries), accounts = asMap(d.accounts);
  let settings = d.settings && typeof d.settings==="object" ? d.settings : null;
  if(settings && !settings.main && "budget" in settings) settings = {main: settings};
  return {entries, accounts, settings, at: d.exportedAt};
}
function fixAccounts(accs, entries){
  if(!Object.keys(accs).length) accs = DEFAULT_ACCS();
  for(const e of Object.values(entries)){
    const ids = e.type==="transfer" ? [e.from, e.to] : [e.account || "giro"];
    for(const id of ids) if(id && !accs[id]) accs[id] = id==="giro" ? DEFAULT_ACCS().giro : id==="bargeld" ? DEFAULT_ACCS().bargeld : {name:"Konto aus Sicherung", kind:"konto", start:0, order:Date.now()};
  }
  return accs;
}
function pickBackup(){
  const i = document.createElement("input"); i.type = "file"; i.hidden = true;
  i.onchange = () => { const f = i.files[0]; i.remove(); if(f) importBackup(f); };
  document.body.appendChild(i); i.click();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let b; try { b = parseBackup(r.result); } catch(e){ toast("Diese Datei ist keine Haushaltsbuch-Sicherung."); return; }
    const cur = local.read("entries");
    const nE = Object.keys(b.entries).length, nNew = Object.keys(b.entries).filter(k=>!cur[k]).length, nA = Object.keys(b.accounts).length;
    const when = b.at ? new Date(b.at).toLocaleDateString("de-DE") + ", " + new Date(b.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr" : "unbekannt";
    openSheet(`
      <div class="sheet-head"><button class="txt" id="cancel">Abbrechen</button><h3 id="sheetTitle">Sicherung laden</h3><span style="min-width:80px"></span></div>
      <p class="hint">Sicherung vom <b>${esc(when)}</b> mit ${nE} Einträgen${nA?` und ${nA} Konten (inkl. Zips und Sparziele)`:""}.</p>
      <button class="primary" id="impReplace">Wiederherstellen</button>
      <p class="sublabel" style="margin:0">Alles auf diesem iPhone wird durch die Sicherung ersetzt. Gut für ein neues Handy oder wenn etwas schiefgelaufen ist.</p>
      <button class="danger" style="color:var(--ink)" id="impMerge">Nur Fehlendes ergänzen</button>
      <p class="sublabel" style="margin:0">Deine jetzigen Einträge bleiben, nur was in der Sicherung zusätzlich ist, kommt dazu (${nNew} Einträge).</p>
      <div id="impConfirm" hidden style="display:flex;flex-direction:column;gap:10px">
        <p class="warnmsg">Sicher? Einträge, die du seit dieser Sicherung gemacht hast, gehen verloren.</p>
        <div class="row"><button class="danger" id="impNo" style="flex:1;color:var(--ink)">Nein</button><button class="primary" id="impYes" style="background:var(--danger)">Ja, ersetzen</button></div>
      </div>
    `);
    const done = msg => { closeSheet(); try { sessionStorage.setItem("hhb.importMsg", msg); } catch(e){} location.reload(); };
    $("#cancel").onclick = closeSheet;
    $("#impConfirm").hidden = true;
    $("#impReplace").onclick = () => { $("#impConfirm").hidden = false; $("#impConfirm").style.display = "flex"; };
    $("#impNo").onclick = () => { $("#impConfirm").hidden = true; $("#impConfirm").style.display = "none"; };
    $("#impYes").onclick = () => {
      local.write("entries", b.entries);
      local.write("accounts", fixAccounts(b.accounts, b.entries));
      if(b.settings) local.write("settings", b.settings);
      done("Sicherung wiederhergestellt: " + nE + " Einträge");
    };
    $("#impMerge").onclick = () => {
      const all = Object.assign({}, b.entries, cur);
      local.write("entries", all);
      local.write("accounts", fixAccounts(Object.assign({}, b.accounts, local.read("accounts")), all));
      if(b.settings && !local.read("settings").main) local.write("settings", b.settings);
      done(nNew + " Einträge ergänzt");
    };
  };
  r.readAsText(file);
}

// ---- events ----
document.addEventListener("click", e => {
  const c = e.target.closest(".cat[data-cat]");
  if(c){ state.cat = state.cat===c.dataset.cat ? null : c.dataset.cat; render(); return; }
  if(e.target.closest("#clearCat")){ state.cat=null; render(); return; }
  const kr = e.target.closest("[data-korr]");
  if(kr){ const x = state.entries.find(y=>y.id===kr.dataset.korr); if(x) korrSheet(x); return; }
  if(e.target.closest("#checkNow") || e.target.closest("#checkAcc")){ checkSheet(); return; }
  if(e.target.closest("#checkLater")){ try { localStorage.setItem("hhb.checkSnooze", String(Date.now()+DAY)); } catch(_){} render(); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ const x = state.entries.find(y=>y.id===ed.dataset.edit); if(x) entrySheet(x); return; }
  if(e.target.closest("#setBudget")){ budgetSheet(); return; }
  if(e.target.closest("#backupNow")){ exportBackup(); return; }
  if(e.target.closest("#impBtn")){ pickBackup(); return; }
  const tb = e.target.closest("#tabs [data-tab]");
  if(tb){ state.tab = tb.dataset.tab; try{ localStorage.setItem("hhb.tab", state.tab); }catch(_){} render(); window.scrollTo({top:0}); return; }
  const ac = e.target.closest("[data-account]");
  if(ac){ const a = accById(ac.dataset.account); if(a) accountSheet(a); return; }
  const pt = e.target.closest("[data-put]");
  if(pt){ const k = konten().find(a=>a.id!==pt.dataset.put); entrySheet(null, {type:"transfer", to:pt.dataset.put, from:k?k.id:null, note:""}); return; }
  if(e.target.closest("#addKonto")){ accountSheet(null,"konto"); return; }
  if(e.target.closest("#addZiel")){ accountSheet(null,"ziel"); return; }
  if(e.target.closest("#addEnv")){ accountSheet(null,"umschlag"); return; }
  const ne = e.target.closest("[data-newenv]");
  if(ne){ accountSheet(null,"umschlag",ne.dataset.newenv); return; }
  const fl = e.target.closest("[data-fill]");
  if(fl){ const bar = konten().find(a=>a.kind==="bar") || konten()[0]; entrySheet(null, {type:"transfer", from:bar&&bar.id, to:fl.dataset.fill}); return; }
  const tk = e.target.closest("[data-take]");
  if(tk){ const bar = konten().find(a=>a.kind==="bar") || konten()[0]; entrySheet(null, {type:"transfer", from:tk.dataset.take, to:bar&&bar.id}); return; }
  if(e.target.closest("#addTransfer")){ entrySheet(null, {type:"transfer"}); return; }
  const iy = e.target.closest("[data-invyear]");
  if(iy){ state.invYear = Number(iy.dataset.invyear); render(); return; }
  if(e.target.closest("#invest")){ const dep = konten().filter(a=>a.kind==="depot"); const ks2 = konten().filter(a=>a.kind==="konto"); const src = ks2.find(a=>a.roundupTo||a.savebackTo) || ks2[0]; const to = (src && accById(src.roundupTo||src.savebackTo)) || dep[0]; entrySheet(null, {type:"transfer", from:src&&src.id, to:to&&to.id}); return; }
  if(e.target.closest("#withdraw")){ const bar = konten().find(a=>a.kind==="bar"); const src = konten().find(a=>a.kind==="konto"); entrySheet(null, {type:"transfer", to:bar&&bar.id, from:src&&src.id}); return; }
  if(e.target.closest("#snooze")){ try { localStorage.setItem("hhb.snooze", String(Date.now()+2*DAY)); } catch(_){} render(); return; }
});
$("#prev").onclick = () => { state.month = shiftMonth(state.month,-1); state.cat=null; render(); };
$("#next").onclick = () => { if(state.month<curMonth()){ state.month = shiftMonth(state.month,1); state.cat=null; render(); } };
$("#settings").onclick = budgetSheet;
$("#fab").onclick = () => entrySheet(null);
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) render(); });

boot();
try { const m = sessionStorage.getItem("hhb.importMsg"); if(m){ sessionStorage.removeItem("hhb.importMsg"); toast(m); } } catch(e){}
})();
</script>
