// ---- backup reminder (every 14 days) ----
const APP_VERSION = "2.11 (22.11.2026)";
const REMIND_DAYS = 14, DAY = 864e5;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function checkHtml(){
  if(!state.entries.length || lsGet("hhb.lastCheck")===curMonth()) return "";
  if(+(lsGet("hhb.checkSnooze")||0) > Date.now()) return "";
  return `<div class="remind" role="status"><span>Neuer Monat: Stimmen deine Kontostände und dein Bargeld noch?</span><button class="later" id="checkLater">Später</button><button class="go" id="checkNow">Jetzt prüfen</button></div>`;
}
function reminderHtml(){ return resetUndoHtml() + checkHtml() + backupHtml(); }
function backupHtml(){
  if(!state.entries.length) return "";
  const now = Date.now();
  if(+(lsGet("hhb.snooze")||0) > now) return "";
  const last = +(lsGet("hhb.lastBackup")||0);
  const since = last || Math.min(...state.entries.map(e => e.createdAt||now));
  const days = Math.floor((now - since)/DAY);
  if(days < REMIND_DAYS) return "";
  const msg = last ? `Letzte Sicherung vor ${days} Tagen.` : `Du hast deine Einträge noch nie gesichert.`;
  return `<div class="remind" role="status"><span>${msg} Speichere jetzt eine Kopie in iCloud Drive.</span><button class="later" id="snooze">Später</button><button class="go" id="backupNow">Jetzt sichern</button></div>`;
}

// ---- backup ----
function lastBackupText(){ try { const t = localStorage.getItem("hhb.lastBackup"); return t ? " Letzte Sicherung: "+new Date(+t).toLocaleDateString("de-DE")+"." : " Noch keine Sicherung gemacht."; } catch(e){ return ""; } }
async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  const file = new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return true; } catch(e){ if(e && e.name==="AbortError") return false; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000); return true;
}
async function exportBackup(){
  const data = {app:"haushaltsbuch", version:1, exportedAt:new Date().toISOString(), entries: local.read("entries"), accounts: local.read("accounts"), settings: local.read("settings"), recurring: local.read("recurring")};
  if(await saveFile("haushaltsbuch-"+iso(new Date())+".json", JSON.stringify(data,null,1), "application/json")){
    try { localStorage.setItem("hhb.lastBackup", String(Date.now())); } catch(e){}
    toast("Sicherung erstellt"); render();
  }
}
async function exportCsv(){
  const eurStr = c => (c/100).toFixed(2).replace(".",",");
  const rows = [["Datum","Art","Kategorie","Ort","Konto","Nach Konto","Betrag","Notiz"]].concat(
    state.entries.slice().sort((a,b)=>a.date<b.date?-1:1).map(e => e.type==="transfer"
      ? [e.date, "Umbuchung", "", "", accName(e.from), accName(e.to), eurStr(e.amount), e.note||""]
      : [e.date, e.type==="in"?"Einnahme":"Ausgabe", catById(e.cat).name, e.place||"", accName(accOf(e)), "", eurStr((e.type==="in"?1:-1)*e.amount), e.note||""]));
  const csv = "\ufeff"+rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  if(await saveFile("haushaltsbuch-"+iso(new Date())+".csv", csv, "text/csv")) toast("Tabelle exportiert");
}
const DEFAULT_ACCS = () => ({giro:{name:"Girokonto", kind:"konto", start:0, order:0}, bargeld:{name:"Bargeld", kind:"bar", start:0, order:1}});
const asMap = x => Array.isArray(x) ? Object.fromEntries(x.filter(e=>e&&e.id).map(({id,...r})=>[id,r])) : (x && typeof x==="object" ? x : {});
// Sicherung einlesen (auch ältere Versionen: ohne Konten, Einträge ohne Konto = Girokonto)
function parseBackup(text){
  const d = JSON.parse(text);
  if(!d || d.app!=="haushaltsbuch" || typeof d.entries!=="object") throw 0;
  const entries = asMap(d.entries), accounts = asMap(d.accounts);
  let settings = d.settings && typeof d.settings==="object" ? d.settings : null;
  if(settings && !settings.main && "budget" in settings) settings = {main: settings};
  return {entries, accounts, settings, recurring: asMap(d.recurring), at: d.exportedAt};
}
function fixAccounts(accs, entries){
  if(!Object.keys(accs).length) accs = DEFAULT_ACCS();
  for(const e of Object.values(entries)){
    const ids = e.type==="transfer" ? [e.from, e.to] : [e.account || "giro"];
    for(const id of ids) if(id && !accs[id]) accs[id] = id==="giro" ? DEFAULT_ACCS().giro : id==="bargeld" ? DEFAULT_ACCS().bargeld : {name:"Konto aus Sicherung", kind:"konto", start:0, order:Date.now()};
  }
  return accs;
}
function pickBackup(){
  const i = document.createElement("input"); i.type = "file"; i.hidden = true;
  i.onchange = () => { const f = i.files[0]; i.remove(); if(f) importBackup(f); };
  document.body.appendChild(i); i.click();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let b; try { b = parseBackup(r.result); } catch(e){ toast("Diese Datei ist keine Haushaltsbuch-Sicherung."); return; }
    const cur = local.read("entries");
    const nE = Object.keys(b.entries).length, nNew = Object.keys(b.entries).filter(k=>!cur[k]).length, nA = Object.keys(b.accounts).length;
    const when = b.at ? new Date(b.at).toLocaleDateString("de-DE") + ", " + new Date(b.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr" : "unbekannt";
    openSheet(`
      <div class="sheet-head"><span style="width:36px;flex:none"></span><h3 id="sheetTitle">Sicherung laden</h3><button class="xbtn" id="cancel" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="hint">Sicherung vom <b>${esc(when)}</b> mit ${nE} Einträgen${nA?` und ${nA} Konten (inkl. Zips und Sparziele)`:""}.</p>
      <button class="primary" id="impReplace">Wiederherstellen</button>
      <p class="sublabel" style="margin:0">Alles auf diesem iPhone wird durch die Sicherung ersetzt. Gut für ein neues Handy oder wenn etwas schiefgelaufen ist.</p>
      <button class="danger" style="color:var(--ink)" id="impMerge">Nur Fehlendes ergänzen</button>
      <p class="sublabel" style="margin:0">Deine jetzigen Einträge bleiben, nur was in der Sicherung zusätzlich ist, kommt dazu (${nNew} Einträge).</p>
      <div id="impConfirm" hidden style="display:flex;flex-direction:column;gap:10px">
        <p class="warnmsg">Sicher? Einträge, die du seit dieser Sicherung gemacht hast, gehen verloren.</p>
        <div class="row"><button class="danger" id="impNo" style="flex:1;color:var(--ink)">Nein</button><button class="primary" id="impYes" style="background:var(--danger)">Ja, ersetzen</button></div>
      </div>
    `);
    const done = msg => { closeSheet(); try { sessionStorage.setItem("hhb.importMsg", msg); } catch(e){} location.reload(); };
    $("#cancel").onclick = closeSheet;
    $("#impConfirm").hidden = true;
    $("#impReplace").onclick = () => { $("#impConfirm").hidden = false; $("#impConfirm").style.display = "flex"; };
    $("#impNo").onclick = () => { $("#impConfirm").hidden = true; $("#impConfirm").style.display = "none"; };
    $("#impYes").onclick = () => {
      local.write("entries", b.entries);
      local.write("accounts", fixAccounts(b.accounts, b.entries));
      if(b.settings) local.write("settings", b.settings);
      local.write("recurring", b.recurring);
      done("Sicherung wiederhergestellt: " + nE + " Einträge");
    };
    $("#impMerge").onclick = () => {
      const all = Object.assign({}, b.entries, cur);
      local.write("entries", all);
      local.write("accounts", fixAccounts(Object.assign({}, b.accounts, local.read("accounts")), all));
      if(b.settings && !local.read("settings").main) local.write("settings", b.settings);
      local.write("recurring", Object.assign({}, b.recurring, local.read("recurring")));
      done(nNew + " Einträge ergänzt");
    };
  };
  r.readAsText(file);
}

document.addEventListener("click", e => {
  const c = e.target.closest(".cat[data-cat]");
  if(c){ state.cat = state.cat===c.dataset.cat ? null : c.dataset.cat; render(); return; }
  if(e.target.closest("#clearCat")){ state.cat=null; render(); return; }
  const pc = e.target.closest("[data-pcat]");
  if(pc){ state.cat = state.cat===pc.dataset.pcat ? null : pc.dataset.pcat; render(); return; }
  const pm = e.target.closest("[data-pie]");
  if(pm){ state.pie = pm.dataset.pie; if(state.pie!=="cat") state.cat = null; render(); return; }
  const rc = e.target.closest("[data-rec]");
  if(rc){ const r = state.recurring.find(x=>x.id===rc.dataset.rec); if(r) recSheet(r); return; }
  if(e.target.closest("#addRec")){ recSheet(null); return; }
  if(e.target.closest("#undoReset")){ try { const u = JSON.parse(localStorage.getItem("hhb.resetUndo")); Object.entries(u.data).forEach(([k,v]) => { if(v===null) localStorage.removeItem("hhb."+k); else localStorage.setItem("hhb."+k, v); }); localStorage.removeItem("hhb.resetUndo"); sessionStorage.setItem("hhb.importMsg", "Daten wiederhergestellt"); } catch(_){} location.reload(); return; }
  if(e.target.closest("#undoResetNo")){ try { localStorage.removeItem("hhb.resetUndo"); } catch(_){} render(); return; }
  const kr = e.target.closest("[data-korr]");
  if(kr){ const x = state.entries.find(y=>y.id===kr.dataset.korr); if(x) korrSheet(x); return; }
  if(e.target.closest("#checkNow") || e.target.closest("#checkAcc")){ checkSheet(); return; }
  if(e.target.closest("#checkLater")){ try { localStorage.setItem("hhb.checkSnooze", String(Date.now()+DAY)); } catch(_){} render(); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ const x = state.entries.find(y=>y.id===ed.dataset.edit); if(x) entrySheet(x); return; }
  if(e.target.closest("#setBudget")){ budgetSheet(); return; }
  if(e.target.closest("#backupNow")){ exportBackup(); return; }
  if(e.target.closest("#impBtn")){ pickBackup(); return; }
  const tb = e.target.closest("#tabs [data-tab]");
  if(tb){ state.tab = tb.dataset.tab; try{ localStorage.setItem("hhb.tab", state.tab); }catch(_){} render(); window.scrollTo({top:0}); try { if(!matchMedia("(prefers-reduced-motion: reduce)").matches) $("#main").animate([{opacity:0, transform:"translateY(8px)"},{opacity:1, transform:"none"}], {duration:220, easing:"ease-out"}); } catch(_){} return; }
  const ac = e.target.closest("[data-account]");
  if(ac){ const a = accById(ac.dataset.account); if(a) accountSheet(a); return; }
  const pt = e.target.closest("[data-put]");
  if(pt){ const k = konten().find(a=>a.id!==pt.dataset.put); entrySheet(null, {type:"transfer", to:pt.dataset.put, from:k?k.id:null, note:""}); return; }
  if(e.target.closest("#addKonto")){ accountSheet(null,"konto"); return; }
  if(e.target.closest("#addZiel")){ accountSheet(null,"ziel"); return; }
  if(e.target.closest("#addEnv2")){ accountSheet(null,"umschlag"); return; }
  if(e.target.closest("#addEnv")){ accountSheet(null,"umschlag"); return; }
  const ne = e.target.closest("[data-newenv]");
  if(ne){ accountSheet(null,"umschlag",ne.dataset.newenv); return; }
  const zo = e.target.closest("[data-zip]");
  if(zo){ const a = accById(zo.dataset.zip); if(a) zipSheet(a); return; }
  const pz = e.target.closest("[data-payzip]");
  if(pz){ entrySheet(null, {type:"out", account:pz.dataset.payzip}); return; }
  if(e.target.closest("#payZip")){ const z = umschlaege()[0]; entrySheet(null, {type:"out", account:z&&z.id}); return; }
  if(e.target.closest("#fillAll")){ fillAllSheet(); return; }
  const fl = e.target.closest("[data-fill]");
  if(fl){ const bar = konten().find(a=>a.kind==="bar") || konten()[0]; entrySheet(null, {type:"transfer", from:bar&&bar.id, to:fl.dataset.fill}); return; }
  const tk = e.target.closest("[data-take]");
  if(tk){ const bar = konten().find(a=>a.kind==="bar") || konten()[0]; entrySheet(null, {type:"transfer", from:tk.dataset.take, to:bar&&bar.id}); return; }
  if(e.target.closest("#addTransfer")){ entrySheet(null, {type:"transfer"}); return; }
  const iy = e.target.closest("[data-invyear]");
  if(iy){ state.invYear = Number(iy.dataset.invyear); render(); return; }
  if(e.target.closest("#invest")){ const dep = konten().filter(a=>a.kind==="depot"); const ks2 = konten().filter(a=>a.kind==="konto"); const src = ks2.find(a=>a.roundupTo||a.savebackTo) || ks2[0]; const to = (src && accById(src.roundupTo||src.savebackTo)) || dep[0]; entrySheet(null, {type:"transfer", from:src&&src.id, to:to&&to.id}); return; }
  if(e.target.closest("#withdraw")){ const bar = konten().find(a=>a.kind==="bar"); const src = konten().find(a=>a.kind==="konto"); entrySheet(null, {type:"transfer", to:bar&&bar.id, from:src&&src.id}); return; }
  if(e.target.closest("#snooze")){ try { localStorage.setItem("hhb.snooze", String(Date.now()+2*DAY)); } catch(_){} render(); return; }
});
$("#prev").onclick = () => { state.month = shiftMonth(state.month,-1); state.cat=null; render(); };
$("#next").onclick = () => { if(state.month<curMonth()){ state.month = shiftMonth(state.month,1); state.cat=null; render(); } };
$("#settings").onclick = budgetSheet;
$("#fab").onclick = () => entrySheet(null);
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ runRecurring(); render(); } });

boot();
try { const m = sessionStorage.getItem("hhb.importMsg"); if(m){ sessionStorage.removeItem("hhb.importMsg"); toast(m); } } catch(e){}
})();
</script>

</body>
</html>
